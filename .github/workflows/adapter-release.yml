name: Prepare adapter release evidence

on:
  workflow_call:

permissions:
  contents: read

jobs:
  qualification:
    name: Prepare signed-tag adapter qualification
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact signed tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
      - name: Activate pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.22.0 --activate
      - name: Build immutable plan tooling
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter @filebelt/devops build
      - name: Generate signed-tag adapter plan
        run: tests/scripts/prepare-adapter-image-plan.sh --channel release --output artifacts/adapter-image-plan.json
      - name: Prime exact locked dependency sources
        run: |
          for manifest in Cargo.toml adapters/{smb,ftp-ftps,onlyoffice,git,nfs,transcode}/Cargo.toml; do
            cargo fetch --locked --manifest-path "$manifest"
          done
      - name: Enforce pre-image gates without publishing
        run: |
          mkdir -p artifacts/evidence
          python3 tests/scripts/validate-adapter-publication.py \
            --plan artifacts/adapter-image-plan.json \
            --policy supply-chain/license-compatibility-v1.toml \
            --evidence-root artifacts/evidence \
            --output artifacts/adapter-pre-image-evidence.json
          python3 tests/scripts/check-license-compatibility.py --repo-root . \
            --pre-image-evidence artifacts/adapter-pre-image-evidence.json
      - name: Upload immutable adapter evidence for the release owner
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: filebelt-adapter-release-evidence
          path: |
            artifacts/adapter-image-plan.json
            artifacts/adapter-pre-image-evidence.json
          if-no-files-found: error
          retention-days: 30
