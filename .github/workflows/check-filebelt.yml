# SPDX-License-Identifier: Apache-2.0

name: Check FileBelt

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

jobs:
  source-structure:
    name: Source structure
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3
      - name: Check repository boundaries
        run: python3 tests/scripts/check-source-structure.py --repo-root .
      - name: Test repository scripts
        run: python3 -m unittest discover -s tests/scripts -p 'test_*.py'
      - name: Check local Markdown links
        run: python3 tests/scripts/check-markdown-links.py --repo-root .
      - name: Check release-tag signer trust
        run: tests/scripts/verify-release-tag.sh --check-trust
      - name: Check Helm image contract
        run: tests/scripts/check-helm-chart.sh
      - name: Check Kubernetes acceptance contracts
        run: tests/kubernetes/check-acceptance-contract.sh
      - name: Check fail-closed NFS qualification contract
        run: tests/scripts/check-nfs-qualification-contract.sh
      - name: Install REUSE
        run: >-
          python3 -m pip install --disable-pip-version-check
          "reuse[charset-normalizer]==6.2.0"
      - name: Check REUSE compliance
        run: reuse lint

  rust:
    name: Rust workspace
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Show pinned toolchain
        run: rustc --version && cargo --version
      - name: Check formatting
        run: cargo fmt --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Run tests
        run: cargo test --workspace --all-features --locked

  fuzz-smoke:
    name: Fuzz smoke (${{ matrix.target }}, ${{ matrix.profile }})
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - nfs_vfs_boundary
          - mcp_runner_relay
          - collaboration_wire
          - revision_protocol
          - runtime_config
        profile: [stable, asan]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned ASan toolchain
        if: matrix.profile == 'asan'
        run: rustup toolchain install nightly-2026-08-04 --profile minimal
      - name: Install pinned cargo-fuzz
        run: |
          cargo install --locked cargo-fuzz --version 0.13.2
          test "$(cargo fuzz --version)" = "cargo-fuzz 0.13.2"
      - name: Run bounded fuzz smoke
        env:
          FILEBELT_FUZZ_OUTPUT_DIR: ${{ runner.temp }}/filebelt-fuzz
        run: >-
          tests/scripts/run-fuzz-target.sh
          --target ${{ matrix.target }}
          --profile ${{ matrix.profile }}
          --mode smoke
          --runs 256

  rust-boundaries:
    name: Rust boundaries
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
      - name: Show pinned toolchain
        run: rustc --version && cargo --version
      - name: Test Rust boundary checkers
        run: |
          python3 tests/scripts/test_check_rust_module_size.py
          python3 tests/scripts/test_check_cargo_boundaries.py
      - name: Check Rust module-size advisory
        run: tests/scripts/check-rust-module-size.sh --warn
      - name: Check resolved Cargo boundaries
        run: tests/scripts/check-cargo-boundaries.sh
      - name: Check source and manifest boundaries
        run: >-
          cargo test --locked -p filebelt-repository-tests
          --test dependency_boundaries
          --test module_decomposition_contract

  supply-chain:
    name: Rust supply chain
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned policy tools
        run: |
          cargo install --locked cargo-audit --version 0.22.2
          cargo install --locked cargo-deny --version 0.20.2
          cargo install --locked cargo-vet --version 0.10.2
      - name: Check advisories
        run: cargo audit
      - name: Check dependencies and licenses
        run: cargo deny check
      - name: Check review evidence
        run: cargo vet --locked

  node:
    name: Node workspace
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
      - name: Activate pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.20.0 --activate
      - name: Install without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check dependency licenses
        run: >-
          pnpm licenses list --json |
          python3 tests/scripts/check-node-licenses.py
          --policy supply-chain/node-policy.toml
      - name: Audit dependencies
        run: pnpm audit --audit-level high
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  protocol:
    name: Protocol policy
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
      - name: Activate pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.20.0 --activate
      - name: Install without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install pinned Buf when schemas exist
        run: |
          if find protocol -name '*.proto' -print -quit | grep -q .; then
            GOBIN="$RUNNER_TEMP/bin" go install github.com/bufbuild/buf/cmd/buf@v1.72.0
            echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          fi
      - name: Check generated protocol clients
        run: python3 tests/scripts/check-generated.py --repo-root .

  dco:
    name: DCO
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check commit sign-offs
        run: >-
          python3 tests/scripts/check-dco.py
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"

  bootstrap-gate:
    name: Bootstrap gate
    if: always()
    needs: [source-structure, rust, fuzz-smoke, rust-boundaries, supply-chain, node, protocol, dco]
    runs-on: ubuntu-26.04
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Require every bootstrap job
        env:
          SOURCE_STRUCTURE: ${{ needs.source-structure.result }}
          RUST: ${{ needs.rust.result }}
          FUZZ_SMOKE: ${{ needs.fuzz-smoke.result }}
          RUST_BOUNDARIES: ${{ needs.rust-boundaries.result }}
          SUPPLY_CHAIN: ${{ needs.supply-chain.result }}
          NODE: ${{ needs.node.result }}
          PROTOCOL: ${{ needs.protocol.result }}
          DCO: ${{ needs.dco.result }}
        run: |
          test "$SOURCE_STRUCTURE" = success
          test "$RUST" = success
          test "$FUZZ_SMOKE" = success
          test "$RUST_BOUNDARIES" = success
          test "$SUPPLY_CHAIN" = success
          test "$NODE" = success
          test "$PROTOCOL" = success
          test "$DCO" = success -o "$DCO" = skipped

  fuzz-sustained:
    name: Sustained fuzz (${{ matrix.target }})
    if: ${{ !cancelled() && needs.bootstrap-gate.result == 'success' && github.event_name != 'pull_request' }}
    needs: bootstrap-gate
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        target:
          - nfs_vfs_boundary
          - mcp_runner_relay
          - collaboration_wire
          - revision_protocol
          - runtime_config
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned ASan toolchain
        if: matrix.target != 'collaboration_wire'
        run: rustup toolchain install nightly-2026-08-04 --profile minimal
      - name: Install pinned cargo-fuzz
        if: matrix.target != 'collaboration_wire'
        run: |
          cargo install --locked cargo-fuzz --version 0.13.2
          test "$(cargo fuzz --version)" = "cargo-fuzz 0.13.2"
      - name: Verify version-pinned collaboration quarantine
        if: matrix.target == 'collaboration_wire'
        run: >-
          python3 tests/scripts/check-fuzz-quarantine.py
          --repo-root .
          --target collaboration_wire
      - name: Run sustained ASan and LSan campaign
        if: matrix.target != 'collaboration_wire'
        env:
          FILEBELT_FUZZ_OUTPUT_DIR: ${{ runner.temp }}/filebelt-fuzz
          FILEBELT_FUZZ_SECONDS: ${{ github.event_name == 'push' && '900' || '3600' }}
        run: >-
          tests/scripts/run-fuzz-target.sh
          --target ${{ matrix.target }}
          --profile asan
          --mode campaign
          --seconds "$FILEBELT_FUZZ_SECONDS"

  phase1-images-native:
    name: Phase 1 images (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            platform: linux/amd64
            artifact-arch: amd64
          - runner: ubuntu-26.04-arm
            platform: linux/arm64
            artifact-arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
      - name: Activate pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.20.0 --activate
      - name: Build image-plan tooling
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter @filebelt/devops build
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.36.1
      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.73.0
          cache: false
      - name: Prepare read-only image plan
        run: tests/scripts/prepare-image-plan.sh --channel build --output artifacts/phase1/image-plan.json
      - name: Build, inspect, scan, and smoke all roles
        run: >-
          tests/scripts/run-image-matrix.sh
          --plan artifacts/phase1/image-plan.json
          --platform ${{ matrix.platform }}
          --output-dir artifacts/phase1/${{ matrix.artifact-arch }}
      - name: Upload image evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: filebelt-phase1-${{ matrix.artifact-arch }}
          path: artifacts/phase1
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}

  phase1-images-riscv64:
    name: Phase 1 images (linux/riscv64)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
      - name: Activate pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.20.0 --activate
      - name: Build image-plan tooling
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter @filebelt/devops build
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.36.1
      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.73.0
          cache: false
      - name: Prepare read-only image plan
        run: tests/scripts/prepare-image-plan.sh --channel build --output artifacts/phase1/image-plan.json
      - name: Cross-build, inspect, scan, and smoke all roles
        run: >-
          tests/scripts/run-image-matrix.sh
          --plan artifacts/phase1/image-plan.json
          --platform linux/riscv64
          --qemu-mode rootless
          --output-dir artifacts/phase1/riscv64
      - name: Upload RISC-V evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: filebelt-phase1-riscv64
          path: artifacts/phase1
          if-no-files-found: error
          retention-days: 30

  phase1-gate:
    name: Phase 1 gate
    if: always()
    needs: [bootstrap-gate, phase1-images-native, phase1-images-riscv64]
    runs-on: ubuntu-26.04
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Require the complete Phase 1 matrix
        env:
          BOOTSTRAP: ${{ needs.bootstrap-gate.result }}
          NATIVE: ${{ needs.phase1-images-native.result }}
          RISCV64: ${{ needs.phase1-images-riscv64.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          test "$BOOTSTRAP" = success
          test "$NATIVE" = success
          if test "$EVENT_NAME" = pull_request; then
            test "$RISCV64" = skipped
          else
            test "$RISCV64" = success
          fi

  docker-integration:
    name: Docker integration (${{ matrix.unit }})
    if: ${{ !cancelled() && needs.bootstrap-gate.result == 'success' && needs.phase1-images-native.result == 'success' }}
    needs: [bootstrap-gate, phase1-images-native]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - unit: core
            timeout_minutes: 45
            requires_playwright: false
          - unit: collaboration
            timeout_minutes: 60
            requires_playwright: true
          - unit: mcp
            timeout_minutes: 45
            requires_playwright: false
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        if: matrix.requires_playwright
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
      - name: Activate pinned pnpm
        if: matrix.requires_playwright
        run: corepack enable && corepack prepare pnpm@11.20.0 --activate
      - name: Install browser workspace without lifecycle scripts
        if: matrix.requires_playwright
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install pinned Playwright browsers
        if: matrix.requires_playwright
        run: pnpm --filter @filebelt/web exec playwright install --with-deps chromium firefox
      - name: Download exact AMD64 image evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: filebelt-phase1-amd64
          path: artifacts/docker/${{ matrix.unit }}-images
      - name: Run isolated ${{ matrix.unit }} unit without rebuilding FileBelt
        run: >-
          python3 tests/docker/units/run-unit.py
          --unit ${{ matrix.unit }}
          --image-dir artifacts/docker/${{ matrix.unit }}-images
          --image-channel build
          --diagnostics-dir artifacts/docker/${{ matrix.unit }}
      - name: Upload scrubbed failure diagnostics for ${{ matrix.unit }}
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: filebelt-docker-${{ matrix.unit }}-diagnostics
          path: artifacts/docker/${{ matrix.unit }}
          if-no-files-found: warn
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}

  docker-integration-gate:
    name: Docker integration gate
    if: always()
    needs: [docker-integration]
    runs-on: ubuntu-26.04
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Require the complete Docker matrix
        env:
          DOCKER_INTEGRATION: ${{ needs.docker-integration.result }}
        run: |
          test "$DOCKER_INTEGRATION" = success

  phase3-kind-current:
    name: Kubernetes v1.36.1 compatibility (PR)
    if: ${{ !cancelled() && needs.bootstrap-gate.result == 'success' && github.event_name == 'pull_request' }}
    needs: bootstrap-gate
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3
      - name: Install pinned Kind and kubectl
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          version: v0.32.0
          kubectl_version: v1.36.3
          install_only: true
      - name: Verify Kubernetes client tools
        env:
          KIND_SHA256: 50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54
        run: |
          kind version | grep -F '0.32.0'
          printf '%s  %s\n' "$KIND_SHA256" "$(command -v kind)" | sha256sum --check --status
          kubectl version --client
      - name: Run current Kubernetes lifecycle acceptance
        env:
          FILEBELT_KUBERNETES_TIMEOUT_SECONDS: "420"
        run: >-
          tests/scripts/run-kubernetes-kind-compatibility.sh
          --node-image
          kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5

  phase3-kind-supported:
    name: Kubernetes ${{ matrix.kubernetes }} compatibility
    if: ${{ !cancelled() && needs.bootstrap-gate.result == 'success' && github.event_name != 'pull_request' }}
    needs: bootstrap-gate
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - kubernetes: v1.34.8
            kubectl: v1.34.10
            node_image: kindest/node:v1.34.8@sha256:02722c2dedddcfc00febf5d27fbeb9b7b2c14294c82109ff4a85d89ac9ba3256
          - kubernetes: v1.35.5
            kubectl: v1.35.7
            node_image: kindest/node:v1.35.5@sha256:ce977ae6d65918d0b58a5f8b5e940429c2ce42fa3a5619ec2bbc60b949c0ac95
          - kubernetes: v1.36.1
            kubectl: v1.36.3
            node_image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3
      - name: Install pinned Kind and kubectl
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          version: v0.32.0
          kubectl_version: ${{ matrix.kubectl }}
          install_only: true
      - name: Verify Kubernetes client tools
        env:
          KIND_SHA256: 50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54
        run: |
          kind version | grep -F '0.32.0'
          printf '%s  %s\n' "$KIND_SHA256" "$(command -v kind)" | sha256sum --check --status
          kubectl version --client
      - name: Run supported Kubernetes lifecycle acceptance
        env:
          FILEBELT_KUBERNETES_TIMEOUT_SECONDS: "420"
        run: >-
          tests/scripts/run-kubernetes-kind-compatibility.sh
          --node-image
          ${{ matrix.node_image }}

  phase3-network-calico:
    name: Kubernetes NetworkPolicy (Calico)
    if: ${{ !cancelled() && needs.bootstrap-gate.result == 'success' }}
    needs: bootstrap-gate
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3
      - name: Install pinned Kubernetes client
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          version: v0.32.0
          kubectl_version: v1.34.10
          install_only: true
      - name: Install checksum-pinned Minikube
        env:
          MINIKUBE_VERSION: v1.38.1
          MINIKUBE_SHA256: 099477eaf248bcb5bcea8ce78a2898e93ac01461c35189da1848c3de82ecd22e
        run: |
          install_root="${RUNNER_TEMP}/minikube"
          mkdir -p "${install_root}/bin"
          curl --fail --location --retry 3 --retry-all-errors --retry-delay 2 \
            "https://github.com/kubernetes/minikube/releases/download/${MINIKUBE_VERSION}/minikube-linux-amd64" \
            --output "${install_root}/minikube"
          printf '%s  %s\n' "${MINIKUBE_SHA256}" "${install_root}/minikube" | sha256sum --check --status
          install -m 0755 "${install_root}/minikube" "${install_root}/bin/minikube"
          echo "${install_root}/bin" >> "${GITHUB_PATH}"
      - name: Run Calico policy acceptance
        env:
          FILEBELT_KUBERNETES_TIMEOUT_SECONDS: "600"
        run: tests/scripts/run-kubernetes-network-policy.sh --cni calico

  phase3-network-cilium:
    name: Kubernetes NetworkPolicy (Cilium)
    if: ${{ !cancelled() && needs.bootstrap-gate.result == 'success' && github.event_name != 'pull_request' }}
    needs: bootstrap-gate
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3
      - name: Install pinned Kubernetes client
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          version: v0.32.0
          kubectl_version: v1.34.10
          install_only: true
      - name: Install checksum-pinned Minikube
        env:
          MINIKUBE_VERSION: v1.38.1
          MINIKUBE_SHA256: 099477eaf248bcb5bcea8ce78a2898e93ac01461c35189da1848c3de82ecd22e
        run: |
          install_root="${RUNNER_TEMP}/minikube"
          mkdir -p "${install_root}/bin"
          curl --fail --location --retry 3 --retry-all-errors --retry-delay 2 \
            "https://github.com/kubernetes/minikube/releases/download/${MINIKUBE_VERSION}/minikube-linux-amd64" \
            --output "${install_root}/minikube"
          printf '%s  %s\n' "${MINIKUBE_SHA256}" "${install_root}/minikube" | sha256sum --check --status
          install -m 0755 "${install_root}/minikube" "${install_root}/bin/minikube"
          echo "${install_root}/bin" >> "${GITHUB_PATH}"
      - name: Run Cilium policy acceptance
        env:
          FILEBELT_KUBERNETES_TIMEOUT_SECONDS: "600"
        run: tests/scripts/run-kubernetes-network-policy.sh --cni cilium

  phase3-gate:
    name: Phase 3 gate
    if: always()
    needs:
      - phase1-gate
      - fuzz-sustained
      - docker-integration-gate
      - phase3-kind-current
      - phase3-kind-supported
      - phase3-network-calico
      - phase3-network-cilium
    runs-on: ubuntu-26.04
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Require the event-appropriate Kubernetes matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          PHASE1: ${{ needs.phase1-gate.result }}
          FUZZ_SUSTAINED: ${{ needs.fuzz-sustained.result }}
          DOCKER_INTEGRATION: ${{ needs.docker-integration-gate.result }}
          KIND_CURRENT: ${{ needs.phase3-kind-current.result }}
          KIND_SUPPORTED: ${{ needs.phase3-kind-supported.result }}
          CALICO: ${{ needs.phase3-network-calico.result }}
          CILIUM: ${{ needs.phase3-network-cilium.result }}
        run: |
          test "$PHASE1" = success
          test "$DOCKER_INTEGRATION" = success
          test "$CALICO" = success
          if test "$EVENT_NAME" = pull_request; then
            test "$KIND_CURRENT" = success
            test "$KIND_SUPPORTED" = skipped
            test "$CILIUM" = skipped
            test "$FUZZ_SUSTAINED" = skipped
          else
            test "$KIND_CURRENT" = skipped
            test "$KIND_SUPPORTED" = success
            test "$CILIUM" = success
            test "$FUZZ_SUSTAINED" = success
          fi
