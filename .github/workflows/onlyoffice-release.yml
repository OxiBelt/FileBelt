# SPDX-License-Identifier: Apache-2.0

name: ONLYOFFICE delivery and release scaffold

on:
  pull_request:
    paths:
      - "adapters/onlyoffice/**"
      - "deploy/helm/filebelt-onlyoffice/**"
      - "devops/source/adapter-image-plan.ts"
      - ".github/workflows/onlyoffice-release.yml"
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

jobs:
  adapter-contract:
    name: Validate adapter and multi-platform release contract
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions: { contents: read }
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install the RISC-V stdlib target
        run: rustup target add riscv64gc-unknown-linux-musl
      - name: Check the AGPL adapter source boundary
        run: cargo check --locked --manifest-path adapters/onlyoffice/Cargo.toml
      - name: Compile the RISC-V adapter probe target
        run: cargo check --locked --manifest-path adapters/onlyoffice/Cargo.toml --target riscv64gc-unknown-linux-musl
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
      - name: Activate pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.21.0 --activate
      - name: Check dependency-free launcher lockfile
        run: python3 tests/scripts/check-onlyoffice-pnpm-lock.py --repo-root .
      - name: Check adapter launcher
        run: |
          cd adapters/onlyoffice
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm test
          pnpm typecheck
      - name: Verify the immutable adapter image plan
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter @filebelt/devops test
      - name: Verify coordinated SemVer and release readiness boundary
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import tomllib

          root = pathlib.Path(".")
          versions = {
              json.loads((root / "package.json").read_text())["version"],
              tomllib.loads((root / "Cargo.toml").read_text())["workspace"]["package"]["version"],
              tomllib.loads((root / "adapters/onlyoffice/Cargo.toml").read_text())["package"]["version"],
          }
          chart = (root / "deploy/helm/filebelt-onlyoffice/Chart.yaml").read_text().splitlines()
          chart_version = next(line.split(":", 1)[1].strip().strip('"') for line in chart if line.startswith("version:"))
          app_version = next(line.split(":", 1)[1].strip().strip('"') for line in chart if line.startswith("appVersion:"))
          versions.update((chart_version, app_version))
          assert len(versions) == 1, f"coordinated SemVer mismatch: {sorted(versions)}"
          PY
      - name: Record publication boundary
        run: |
          test "$(grep -c 'linux/amd64' devops/source/adapter-image-plan.ts)" -ge 1
          test "$(grep -c 'linux/arm64' devops/source/adapter-image-plan.ts)" -ge 1
          grep -F 'riscv64Policy: "compile-and-probe-only"' devops/source/adapter-image-plan.ts
          echo "The adapter publication workflow remains read-only until digest-pinned image inputs and source-offer release evidence are admitted."

  chart-contract:
    name: Validate isolated adapter chart
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions: { contents: read }
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4
      - name: Render the namespace-isolated chart
        run: tests/scripts/check-onlyoffice-helm-chart.sh
