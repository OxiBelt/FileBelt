# SPDX-License-Identifier: Apache-2.0

name: Phase 8 qualification harness contract

on:
  pull_request:
    paths:
      - "tests/performance/phase8/**"
      - "tests/scripts/test_phase8_performance_evidence.py"
      - "tests/scripts/test_run_phase8_qualification.py"
      - "tests/docker/units.toml"
      - "tests/docker/units/catalog.py"
      - "tests/docker/units/run-unit.py"
      - "source/apps/filebeltctl/src/phase8.rs"
      - "source/apps/filebeltctl/src/main.rs"
      - ".github/workflows/phase8-performance.yml"
  workflow_dispatch:

jobs:
  evidence-contract:
    name: Validate executable evidence contract
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions: { contents: read }
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test fail-closed evidence checker
        run: |
          python3 tests/scripts/test_phase8_performance_evidence.py
          python3 tests/scripts/test_run_phase8_qualification.py
      - name: Check executable harness sources
        run: |
          python3 -m py_compile \
            tests/performance/phase8/phase8_evidence.py \
            tests/performance/phase8/run_local_qualification.py
          node --check tests/performance/phase8/internal_health.mjs
          node --check tests/performance/phase8/collaboration_endpoint.mjs
          test ! -e tests/performance/phase8/example.json
