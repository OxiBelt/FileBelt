name: Release image dry run

on:
  workflow_dispatch:

jobs:
  image-platforms:
    name: Dry run (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            platform: linux/amd64
            artifact-arch: amd64
            qemu-arguments: ""
          - runner: ubuntu-26.04-arm
            platform: linux/arm64
            artifact-arch: arm64
            qemu-arguments: ""
          - runner: ubuntu-26.04
            platform: linux/riscv64
            artifact-arch: riscv64
            qemu-arguments: "--qemu-mode rootless"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    permissions: { contents: read }
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
      - name: Activate pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.21.0 --activate
      - name: Build image-plan tooling
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter @filebelt/devops build
      - name: Check retained OxiBelt image admission
        run: tests/scripts/verify-oxibelt-admission.sh .
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.36.1
      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: false
      - name: Prepare immutable image plan
        env:
          FILEBELT_CHANNEL: build
        run: >-
          tests/scripts/prepare-image-plan.sh
          --channel "$FILEBELT_CHANNEL"
          --output artifacts/phase1/image-plan.json
      - name: Build all fifteen Apache roles
        run: >-
          tests/scripts/run-image-matrix.sh
          --plan artifacts/phase1/image-plan.json
          --platform ${{ matrix.platform }}
          ${{ matrix.qemu-arguments }}
          --output-dir artifacts/phase1/${{ matrix.artifact-arch }}
      - name: Upload dry-run evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: filebelt-release-dry-run-${{ matrix.artifact-arch }}
          path: artifacts/phase1
          if-no-files-found: error
          retention-days: 30

  normalized-rebuild:
    name: Normalized AMD64 rebuild
    runs-on: ubuntu-26.04
    timeout-minutes: 150
    permissions: { contents: read }
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
      - name: Activate pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.21.0 --activate
      - name: Build image-plan tooling
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter @filebelt/devops build
      - name: Check retained OxiBelt image admission
        run: tests/scripts/verify-oxibelt-admission.sh .
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.36.1
      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: false
      - name: Prepare immutable image plan
        env:
          FILEBELT_CHANNEL: build
        run: >-
          tests/scripts/prepare-image-plan.sh
          --channel "$FILEBELT_CHANNEL"
          --output artifacts/phase1/image-plan.json
      - name: Compare normalized rebuilds
        run: >-
          tests/scripts/verify-image-rebuild.sh
          --plan artifacts/phase1/image-plan.json
          --platform linux/amd64
          --output-dir artifacts/phase1/rebuild
      - name: Upload rebuild evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: filebelt-release-rebuild-amd64
          path: artifacts/phase1
          if-no-files-found: error
          retention-days: 30

  dry-run-gate:
    name: Release dry-run gate
    if: always()
    needs: [image-platforms, normalized-rebuild]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every read-only release check
        env:
          PLATFORMS: ${{ needs.image-platforms.result }}
          REBUILD: ${{ needs.normalized-rebuild.result }}
        run: |
          test "$PLATFORMS" = success
          test "$REBUILD" = success
