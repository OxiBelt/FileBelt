name: Release image dry run

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-dry-run-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image-platforms:
    name: Dry run (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            artifact-arch: amd64
            qemu-arguments: ""
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            artifact-arch: arm64
            qemu-arguments: ""
          - runner: ubuntu-24.04
            platform: linux/riscv64
            artifact-arch: riscv64
            qemu-arguments: "--qemu-mode rootless"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.19.0"
      - name: Activate pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.20.0 --activate
      - name: Build image-plan tooling
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter @filebelt/devops build
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.36.1
      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.73.0
          cache: false
      - name: Prepare immutable image plan
        env:
          FILEBELT_CHANNEL: ${{ startsWith(github.ref, 'refs/tags/') && 'release' || 'build' }}
        run: >-
          tests/scripts/prepare-image-plan.sh
          --channel "$FILEBELT_CHANNEL"
          --output artifacts/phase1/image-plan.json
      - name: Build all seven roles
        run: >-
          tests/scripts/run-image-matrix.sh
          --plan artifacts/phase1/image-plan.json
          --platform ${{ matrix.platform }}
          ${{ matrix.qemu-arguments }}
          --output-dir artifacts/phase1/${{ matrix.artifact-arch }}
      - name: Upload dry-run evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: filebelt-release-dry-run-${{ matrix.artifact-arch }}
          path: artifacts/phase1
          if-no-files-found: error
          retention-days: 30

  normalized-rebuild:
    name: Normalized AMD64 rebuild
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.19.0"
      - name: Activate pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.20.0 --activate
      - name: Build image-plan tooling
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter @filebelt/devops build
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.36.1
      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.73.0
          cache: false
      - name: Prepare immutable image plan
        env:
          FILEBELT_CHANNEL: ${{ startsWith(github.ref, 'refs/tags/') && 'release' || 'build' }}
        run: >-
          tests/scripts/prepare-image-plan.sh
          --channel "$FILEBELT_CHANNEL"
          --output artifacts/phase1/image-plan.json
      - name: Compare normalized rebuilds
        run: >-
          tests/scripts/verify-image-rebuild.sh
          --plan artifacts/phase1/image-plan.json
          --platform linux/amd64
          --output-dir artifacts/phase1/rebuild
      - name: Upload rebuild evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: filebelt-release-rebuild-amd64
          path: artifacts/phase1
          if-no-files-found: error
          retention-days: 30

  dry-run-gate:
    name: Release dry-run gate
    if: always()
    needs: [image-platforms, normalized-rebuild]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every read-only release check
        env:
          PLATFORMS: ${{ needs.image-platforms.result }}
          REBUILD: ${{ needs.normalized-rebuild.result }}
        run: |
          test "$PLATFORMS" = success
          test "$REBUILD" = success
