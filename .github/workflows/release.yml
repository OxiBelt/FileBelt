# SPDX-License-Identifier: Apache-2.0

name: Publish release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

jobs:
  adapter-release:
    name: Prepare separate adapter artifacts
    permissions:
      contents: read
    uses: ./.github/workflows/adapter-release.yml

  image-platforms:
    name: Validate release images (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            platform: linux/amd64
            artifact-arch: amd64
            qemu-arguments: ""
          - runner: ubuntu-26.04-arm
            platform: linux/arm64
            artifact-arch: arm64
            qemu-arguments: ""
          - runner: ubuntu-26.04
            platform: linux/riscv64
            artifact-arch: riscv64
            qemu-arguments: "--qemu-mode rootless"
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    timeout-minutes: 150
    steps:
      - name: Check out the signed tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
      - name: Activate pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.21.0 --activate
      - name: Build image-plan tooling
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter @filebelt/devops build
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.36.1
      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: false
      - name: Prepare signed release plan
        run: tests/scripts/prepare-image-plan.sh --channel release --output artifacts/phase3/image-plan.json
      - name: Build and validate all fifteen Apache role contracts
        run: >-
          tests/scripts/run-image-matrix.sh
          --plan artifacts/phase3/image-plan.json
          --platform ${{ matrix.platform }}
          ${{ matrix.qemu-arguments }}
          --output-dir artifacts/phase3/${{ matrix.artifact-arch }}
      - name: Upload validated release subjects
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: filebelt-release-${{ matrix.artifact-arch }}
          path: artifacts/phase3
          if-no-files-found: error
          retention-days: 30

  normalized-rebuild:
    name: Verify normalized AMD64 rebuild
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 150
    steps:
      - name: Check out the signed tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
      - name: Activate pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.21.0 --activate
      - name: Build image-plan tooling
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter @filebelt/devops build
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.36.1
      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: false
      - name: Prepare signed release plan
        run: tests/scripts/prepare-image-plan.sh --channel release --output artifacts/phase3/image-plan.json
      - name: Compare normalized rebuilds
        run: >-
          tests/scripts/verify-image-rebuild.sh
          --plan artifacts/phase3/image-plan.json
          --platform linux/amd64
          --output-dir artifacts/phase3/rebuild
      - name: Upload rebuild evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: filebelt-release-rebuild-amd64
          path: artifacts/phase3
          if-no-files-found: error
          retention-days: 30

  package-assets:
    name: Validate and package Helm/admin assets
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Check out the signed tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
      - name: Verify the authorized release tag
        run: tests/scripts/prepare-image-plan.sh --channel release --output artifacts/phase3/image-plan.json
      - name: Package release assets
        run: tests/scripts/package-release-assets.sh --output-dir artifacts/release
      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: filebelt-release-assets
          path: artifacts/release
          if-no-files-found: error
          retention-days: 30

  docker-integration-acceptance:
    name: Exercise exact AMD64 ${{ matrix.unit }} archives
    if: ${{ !cancelled() && needs.image-platforms.result == 'success' }}
    needs: image-platforms
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - unit: core
            timeout_minutes: 45
            requires_playwright: false
          - unit: collaboration
            timeout_minutes: 60
            requires_playwright: true
          - unit: mcp
            timeout_minutes: 45
            requires_playwright: false
    steps:
      - name: Check out the signed tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node
        if: matrix.requires_playwright
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
      - name: Activate pinned pnpm
        if: matrix.requires_playwright
        run: corepack enable && corepack prepare pnpm@11.21.0 --activate
      - name: Install browser workspace without lifecycle scripts
        if: matrix.requires_playwright
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install pinned Playwright browsers
        if: matrix.requires_playwright
        run: pnpm --filter @filebelt/web exec playwright install --with-deps chromium firefox
      - name: Download AMD64 image evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: filebelt-release-amd64
          path: artifacts/docker/${{ matrix.unit }}-images
      - name: Run exact-artifact ${{ matrix.unit }} acceptance without rebuilding FileBelt
        run: >-
          tests/scripts/run-kubernetes-release-gate.sh
          --image-dir artifacts/docker/${{ matrix.unit }}-images
          --unit ${{ matrix.unit }}
          --docker-topology outside
          --diagnostics-dir artifacts/docker/${{ matrix.unit }}
      - name: Upload scrubbed failure diagnostics for ${{ matrix.unit }}
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: filebelt-release-docker-${{ matrix.unit }}-diagnostics
          path: artifacts/docker/${{ matrix.unit }}
          if-no-files-found: warn
          retention-days: 30

  kubernetes-compatibility:
    name: Kubernetes ${{ matrix.kubernetes }} compatibility
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - kubernetes: v1.34.8
            kubectl: v1.34.10
            node_image: kindest/node:v1.34.8@sha256:02722c2dedddcfc00febf5d27fbeb9b7b2c14294c82109ff4a85d89ac9ba3256
          - kubernetes: v1.35.5
            kubectl: v1.35.7
            node_image: kindest/node:v1.35.5@sha256:ce977ae6d65918d0b58a5f8b5e940429c2ce42fa3a5619ec2bbc60b949c0ac95
          - kubernetes: v1.36.1
            kubectl: v1.36.3
            node_image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
    steps:
      - name: Check out the signed tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4
      - name: Install pinned Kind and kubectl
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          version: v0.32.0
          kubectl_version: ${{ matrix.kubectl }}
          install_only: true
      - name: Run live API compatibility and rollback gate
        run: >-
          tests/scripts/run-kubernetes-kind-compatibility.sh
          --node-image ${{ matrix.node_image }}

  release-gate:
    name: Require every release check
    if: always()
    needs: [adapter-release, image-platforms, normalized-rebuild, package-assets, docker-integration-acceptance, kubernetes-compatibility]
    runs-on: ubuntu-26.04
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Require successful immutable inputs
        env:
          IMAGES: ${{ needs.image-platforms.result }}
          REBUILD: ${{ needs.normalized-rebuild.result }}
          ASSETS: ${{ needs.package-assets.result }}
          DOCKER_INTEGRATION: ${{ needs.docker-integration-acceptance.result }}
          KUBERNETES: ${{ needs.kubernetes-compatibility.result }}
          ADAPTERS: ${{ needs.adapter-release.result }}
        run: |
          test "$IMAGES" = success
          test "$REBUILD" = success
          test "$ASSETS" = success
          test "$DOCKER_INTEGRATION" = success
          test "$KUBERNETES" = success
          test "$ADAPTERS" = success

  promote:
    name: Promote validated immutable subjects
    needs: release-gate
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out the signed tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Download validated AMD64 subjects
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: filebelt-release-amd64
          path: artifacts/downloads/amd64
      - name: Download validated ARM64 subjects
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: filebelt-release-arm64
          path: artifacts/downloads/arm64
      - name: Download validated RISC-V subjects
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: filebelt-release-riscv64
          path: artifacts/downloads/riscv64
      - name: Download packaged release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: filebelt-release-assets
          path: artifacts/release
      - name: Download separate adapter release evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: filebelt-adapter-release-evidence
          path: artifacts/release
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.36.1
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
      - name: Verify tag and locate release plan
        id: plan
        run: |
          tests/scripts/prepare-image-plan.sh --channel release --output artifacts/release-plan.json
          echo "version=$(jq -er '.tag' artifacts/release-plan.json)" >> "$GITHUB_OUTPUT"
      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Verify packaged checksums before publication
        run: cd artifacts/release && sha256sum --check SHA256SUMS
      - name: Promote image archives without rebuilding
        id: subjects
        run: |
          tests/scripts/promote-release-artifacts.sh \
            --plan artifacts/release-plan.json \
            --artifacts-root artifacts/downloads \
            --registry ghcr.io \
            --output artifacts/release/image-subjects.json
          for item in \
            api:filebelt-api \
            io:filebelt-worker-io \
            maintenance:filebelt-worker-maintenance \
            collaboration:filebelt-collaboration \
            tools:filebelt-tools \
            vfs:filebelt-vfs \
            headscale_sync:filebelt-headscale-sync \
            nfs_relay:filebelt-nfs-relay \
            document:filebelt-document \
            revision:filebelt-revision \
            web:filebelt-web; do
            key=${item%%:*}
            role=${item#*:}
            digest=$(jq -er --arg role "$role" '.subjects[] | select(.role == $role) | .digest' artifacts/release/image-subjects.json)
            echo "$key=$digest" >> "$GITHUB_OUTPUT"
          done
      - name: Publish and read back Helm charts
        id: chart
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          if helm show chart oci://ghcr.io/oxibelt/charts/filebelt --version "$VERSION" >/dev/null 2>&1; then
            echo "refusing to replace existing Helm release ${VERSION}" >&2
            exit 1
          fi
          output=$(helm push "artifacts/release/filebelt-${VERSION}.tgz" oci://ghcr.io/oxibelt/charts)
          digest=$(awk '$1 == "Digest:" { print $2 }' <<<"$output")
          test "${digest#sha256:}" != "$digest"
          mkdir -p artifacts/release/readback
          helm pull oci://ghcr.io/oxibelt/charts/filebelt --version "$VERSION" --destination artifacts/release/readback
          cmp "artifacts/release/filebelt-${VERSION}.tgz" "artifacts/release/readback/filebelt-${VERSION}.tgz"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Complete release checksums
        run: |
          cd artifacts/release
          sha256sum image-subjects.json adapter-image-plan.json adapter-pre-image-evidence.json >>SHA256SUMS
      - name: Attest API image index
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/oxibelt/filebelt-api
          subject-digest: ${{ steps.subjects.outputs.api }}
          push-to-registry: false
      - name: Attest I/O image index
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/oxibelt/filebelt-worker-io
          subject-digest: ${{ steps.subjects.outputs.io }}
          push-to-registry: false
      - name: Attest maintenance image index
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/oxibelt/filebelt-worker-maintenance
          subject-digest: ${{ steps.subjects.outputs.maintenance }}
          push-to-registry: false
      - name: Attest collaboration image index
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/oxibelt/filebelt-collaboration
          subject-digest: ${{ steps.subjects.outputs.collaboration }}
          push-to-registry: false
      - name: Attest tools image index
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/oxibelt/filebelt-tools
          subject-digest: ${{ steps.subjects.outputs.tools }}
          push-to-registry: false
      - name: Attest VFS image index
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/oxibelt/filebelt-vfs
          subject-digest: ${{ steps.subjects.outputs.vfs }}
          push-to-registry: false
      - name: Attest Headscale synchronization image index
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/oxibelt/filebelt-headscale-sync
          subject-digest: ${{ steps.subjects.outputs.headscale_sync }}
          push-to-registry: false
      - name: Attest NFS relay image index
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/oxibelt/filebelt-nfs-relay
          subject-digest: ${{ steps.subjects.outputs.nfs_relay }}
          push-to-registry: false
      - name: Attest document provider image index
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/oxibelt/filebelt-document
          subject-digest: ${{ steps.subjects.outputs.document }}
          push-to-registry: false
      - name: Attest revision coordinator image index
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/oxibelt/filebelt-revision
          subject-digest: ${{ steps.subjects.outputs.revision }}
          push-to-registry: false
      - name: Attest web image index
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/oxibelt/filebelt-web
          subject-digest: ${{ steps.subjects.outputs.web }}
          push-to-registry: false
      - name: Attest Helm OCI subject
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/oxibelt/charts/filebelt
          subject-digest: ${{ steps.chart.outputs.digest }}
          push-to-registry: false
      - name: Create immutable GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: >-
          gh release create "$VERSION"
          "artifacts/release/filebelt-${VERSION}.tgz"
          "artifacts/release/filebelt-postgresql-admin-${VERSION}.tar.gz"
          "artifacts/release/SHA256SUMS"
          "artifacts/release/image-subjects.json"
          "artifacts/release/adapter-image-plan.json"
          "artifacts/release/adapter-pre-image-evidence.json"
          --verify-tag
          --title "FileBelt ${VERSION}"
          --generate-notes
