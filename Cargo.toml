# SPDX-License-Identifier: Apache-2.0

[workspace]
members = [
  "source",
  "source/apps/filebelt-api",
  "source/apps/filebelt-collaboration",
  "source/apps/filebelt-worker-io",
  "source/apps/filebelt-worker-maintenance",
  "source/apps/filebelt-media-controller",
  "source/apps/filebelt-document",
  "source/apps/filebelt-mcp-broker",
  "source/apps/filebelt-mcp-runner",
  "source/apps/filebelt-controller",
  "source/apps/filebeltctl",
  "source/apps/filebelt-vfs",
  "source/apps/filebelt-headscale-sync",
  "source/apps/filebelt-nfs-relay",
  "source/apps/filebelt-private-egress-gateway",
  "source/apps/filebelt-tunnel-relay",
  "source/apps/filebelt-revision",
  "source/crates/filebelt-build-identity",
  "source/crates/filebelt-domain",
  "source/crates/filebelt-authz",
  "source/crates/filebelt-database",
  "source/crates/filebelt-events-protocol",
  "source/crates/filebelt-storage",
  "source/crates/filebelt-capability-keyset",
  "source/crates/filebelt-storage-protocol",
  "source/crates/filebelt-vfs-protocol",
  "source/crates/filebelt-document-protocol",
  "source/crates/filebelt-revision-protocol",
  "source/crates/filebelt-directory-repository-protocol",
  "source/crates/filebelt-mcp-policy",
  "source/crates/filebelt-mcp-protocol",
  "source/crates/filebelt-mcp-vault",
  "source/crates/filebelt-secret-vault",
  "source/crates/filebelt-control-protocol",
  "source/crates/filebelt-collaboration-protocol",
  "source/crates/filebelt-runtime",
  "source/crates/filebelt-deployment-diagnostics",
  "fuzz",
  "tests/rust",
  "tests/unsafe-harness",
]
exclude = [
  "adapters/smb",
  "adapters/ftp-ftps",
  "adapters/onlyoffice",
  "adapters/nfs",
  "adapters/transcode",
  "adapters/git",
  "adapters/directory-repository",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
repository = "https://github.com/OxiBelt/FileBelt"
publish = false

[workspace.dependencies]
anyhow = "=1.0.104"
argon2 = { version = "=0.5.3", features = ["std"] }
aws-lc-rs = { version = "=1.18.0", default-features = false }
axum = { version = "=0.8.9", features = ["http1", "http2", "json", "macros", "tokio", "ws"] }
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
blake3 = "=1.8.7"
bytes = "=1.12.1"
clap = { version = "=4.6.6", features = ["derive"] }
filebelt-authz = { version = "=0.1.0", path = "source/crates/filebelt-authz" }
filebelt-capability-keyset = { version = "=0.1.0", path = "source/crates/filebelt-capability-keyset" }
filebelt-collaboration-protocol = { version = "=0.1.0", path = "source/crates/filebelt-collaboration-protocol" }
filebelt-database = { version = "=0.1.0", path = "source/crates/filebelt-database" }
filebelt-deployment-diagnostics = { version = "=0.1.0", path = "source/crates/filebelt-deployment-diagnostics" }
filebelt-domain = { version = "=0.1.0", path = "source/crates/filebelt-domain" }
filebelt-document-protocol = { version = "=0.1.0", path = "source/crates/filebelt-document-protocol" }
filebelt-revision-protocol = { version = "=0.1.0", path = "source/crates/filebelt-revision-protocol" }
filebelt-directory-repository-protocol = { version = "=0.1.0", path = "source/crates/filebelt-directory-repository-protocol" }
filebelt-events-protocol = { version = "=0.1.0", path = "source/crates/filebelt-events-protocol" }
filebelt-mcp-policy = { version = "=0.1.0", path = "source/crates/filebelt-mcp-policy" }
filebelt-mcp-protocol = { version = "=0.1.0", path = "source/crates/filebelt-mcp-protocol" }
filebelt-mcp-vault = { version = "=0.1.0", path = "source/crates/filebelt-mcp-vault" }
filebelt-secret-vault = { version = "=0.1.0", path = "source/crates/filebelt-secret-vault" }
filebelt-runtime = { version = "=0.1.0", path = "source/crates/filebelt-runtime" }
filebelt-storage = { version = "=0.1.0", path = "source/crates/filebelt-storage" }
filebelt-storage-protocol = { version = "=0.1.0", path = "source/crates/filebelt-storage-protocol" }
futures-util = "=0.3.34"
fs2 = "=0.4.3"
getrandom = "=0.4.3"
http = "=1.5.0"
http-body-util = "=0.1.4"
hyper = { version = "=1.11.0", features = ["client", "http1"] }
hyper-util = { version = "=0.1.20", features = ["tokio"] }
h3 = "=0.0.8"
h3-quinn = { version = "=0.0.10", default-features = false, features = ["datagram"] }
h3-webtransport = "=0.1.2"
iggy = "=0.8.0"
jiff = "=0.2.35"
libfuzzer-sys = "=0.4.13"
md4 = { version = "=0.11.0", default-features = false }
openidconnect = { version = "=4.0.1", default-features = false, features = ["reqwest"] }
opentelemetry = { version = "=0.32.0", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "=0.32.0", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace"] }
opentelemetry_sdk = { version = "=0.32.1", default-features = false, features = ["trace"] }
opentelemetry-reqwest = { package = "reqwest", version = "=0.13.4", default-features = false, features = ["blocking", "rustls-no-provider"] }
prometheus-client = "=0.25.0"
rcgen = "=0.14.9"
prost = "=0.14.4"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls-webpki-roots-no-provider"] }
quinn = { version = "=0.11.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
rmcp = { version = "=3.1.4", default-features = false }
rustix = { version = "=1.1.4", features = ["fs"] }
rustls = { version = "=0.23.43", default-features = false, features = ["aws_lc_rs", "std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde_json_canonicalizer = "=0.3.2"
sigstore-verify = { version = "=0.11.0", default-features = false }
sqlx = { version = "=0.9.0", default-features = false, features = ["json", "macros", "migrate", "postgres", "runtime-tokio", "tls-rustls-aws-lc-rs", "uuid"] }
subtle = "=2.6.1"
syn = { version = "=3.0.3", features = ["full", "visit"] }
tempfile = "=3.27.0"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "=0.7.19", features = ["io"] }
tokio-rustls = "=0.26.4"
toml = "=1.1.4"
tower = { version = "=0.5.3", features = ["limit"] }
tower-http = { version = "=0.7.0", features = ["catch-panic", "cors", "limit", "request-id", "trace"] }
tracing = "=0.1.44"
tracing-opentelemetry = { version = "=0.33.0", default-features = false }
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt", "json", "std"] }
url = { version = "=2.5.8", features = ["serde"] }
uuid = { version = "=1.24.1", features = ["serde", "v4"] }
webpki-roots = "=1.0.9"
zeroize = "=1.9.0"
x509-parser = "=0.18.1"
yrs = "=0.27.3"

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
manual_contains = "deny"
manual_find = "deny"
manual_is_ascii_check = "deny"
manual_memcpy = "deny"
manual_slice_fill = "deny"
missing_safety_doc = "deny"
multiple_unsafe_ops_per_block = "deny"
needless_range_loop = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "debuginfo"
