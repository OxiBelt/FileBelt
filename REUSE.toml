# SPDX-License-Identifier: Apache-2.0

version = 1
SPDX-PackageName = "FileBelt"
SPDX-PackageSupplier = "Person: PiQuark6046"
SPDX-PackageDownloadLocation = "https://github.com/OxiBelt/FileBelt"

[[annotations]]
path = [
  ".cargo/**",
  ".github/**",
  ".dockerignore",
  ".gitignore",
  ".node-version",
  ".npmrc",
  "AGENTS.md",
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "Cargo.lock",
  "Cargo.toml",
  "GOVERNANCE.md",
  "README.md",
  "REUSE.toml",
  "SECURITY.md",
  "THIRD_PARTY_NOTICES.md",
  "adapters/README.md",
  "adapters/transcode/**",
  "deny.toml",
  "deploy/**",
  "devops/**",
  "docs/**",
  "eslint.config.js",
  "fuzz/**",
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "protocol/**",
  "rust-toolchain.toml",
  "rustfmt.toml",
  "source/**",
  "supply-chain/**",
  "tests/**",
  "tools/**",
  "tsconfig.json",
  "ui/**",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 PiQuark6046 and FileBelt contributors"
SPDX-License-Identifier = "Apache-2.0"

# Imported verbatim from vercel/components.build at
# ba727450437385af662810329fa19896215f76d5. The upstream Apache-2.0
# license and copyright notice are recorded at:
# https://github.com/vercel/components.build/blob/ba727450437385af662810329fa19896215f76d5/LICENSE
[[annotations]]
path = [".agents/skills/building-components/**"]
precedence = "override"
SPDX-FileCopyrightText = "2023 Vercel, Inc."
SPDX-License-Identifier = "Apache-2.0"

# Imported verbatim from vercel-labs/agent-skills at
# 7c180d9044c9ae2b442b567aad4e42a28dd5ed62. The upstream README declares
# these skills MIT-licensed but supplies no copyright statement:
# https://github.com/vercel-labs/agent-skills/blob/7c180d9044c9ae2b442b567aad4e42a28dd5ed62/README.md#license
[[annotations]]
path = [
  ".agents/skills/vercel-composition-patterns/**",
  ".agents/skills/vercel-react-best-practices/**",
  ".agents/skills/vercel-react-native-skills/**",
  ".agents/skills/web-design-guidelines/**",
]
precedence = "override"
SPDX-FileCopyrightText = "NOASSERTION"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["skills-lock.json"]
precedence = "override"
SPDX-FileCopyrightText = "2026 PiQuark6046 and FileBelt contributors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = [
  ".agents/skills/subagent-orchestration/SKILL.md",
  ".agents/skills/subagent-orchestration/references/orchestration-patterns.md",
  ".agents/skills/subagent-orchestration/references/security-review-budgeting.md",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 PiQuark6046 and FileBelt contributors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["source/ops/runtime/musl-COPYRIGHT"]
precedence = "override"
SPDX-FileCopyrightText = "2005-2020 Rich Felker and musl contributors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["adapters/smb/**", "adapters/ftp-ftps/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 PiQuark6046 and FileBelt contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = ["adapters/onlyoffice/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 PiQuark6046 and FileBelt contributors"
SPDX-License-Identifier = "AGPL-3.0-only"

[[annotations]]
path = ["adapters/git/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 PiQuark6046 and FileBelt contributors"
SPDX-License-Identifier = "GPL-2.0-only"

[[annotations]]
path = ["adapters/nfs/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 PiQuark6046 and FileBelt contributors"
SPDX-License-Identifier = "LGPL-3.0-or-later"

[[annotations]]
path = ["adapters/transcode/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 PiQuark6046 and FileBelt contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"
