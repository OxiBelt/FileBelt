# SPDX-License-Identifier: GPL-3.0-or-later

[graph]
all-features = true

[advisories]
unmaintained = "workspace"
yanked = "deny"

[licenses]
confidence-threshold = 0.93
unused-allowed-license = "deny"
allow = ["Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "CDLA-Permissive-2.0", "ISC", "MIT", "MIT-0", "Unicode-3.0"]
exceptions = [{ crate = "filebelt-ftp-ftps-gateway@0.1.0", allow = ["GPL-3.0-or-later"] }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
