# SPDX-License-Identifier: Apache-2.0

[package]
name = "filebelt-git-adapter"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
publish = false

[workspace]
members = ["."]
resolver = "3"

[dependencies]
filebelt-revision-protocol = { version = "=0.1.0", path = "../../source/crates/filebelt-revision-protocol" }
prost = "=0.14.4"
rustls = { version = "=0.23.43", default-features = false, features = ["aws_lc_rs", "std"] }
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-rustls = "=0.26.4"
toml = "=1.1.4"
serde = { version = "=1.0.229", features = ["derive"] }
uuid = { version = "=1.24.1", features = ["v4"] }
x509-parser = "=0.18.1"

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
