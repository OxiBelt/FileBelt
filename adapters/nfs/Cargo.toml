# SPDX-License-Identifier: LGPL-3.0-or-later

[package]
name = "filebelt-nfs-bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "LGPL-3.0-or-later"
publish = false

[workspace]
members = ["."]
resolver = "3"

[dependencies]
# This adapter-local client consumes only the Apache protocol schema over the
# documented VFS process boundary. The Apache workspace has no dependency on
# this LGPL package.
blake3 = "=1.8.6"
filebelt-vfs-protocol = { version = "=0.1.0", path = "../../source/crates/filebelt-vfs-protocol" }
nix = { version = "=0.31.3", features = ["fs", "socket", "uio", "user"] }
prost = "=0.14.4"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "rustls-tls-webpki-roots-no-provider"] }
rustls = { version = "=0.23.43", default-features = false, features = ["aws_lc_rs", "std"] }
serde = { version = "=1.0.229", features = ["derive"] }
socket2 = { version = "=0.6.5", features = ["all"] }
thiserror = "=2.0.20"
toml = "=1.1.4"
uuid = { version = "=1.24.0", features = ["v4"] }
zeroize = "=1.9.0"
x509-parser = "=0.18.1"

[lib]
path = "bridge/src/lib.rs"

[[bin]]
name = "filebelt-nfs-bridge"
path = "bridge/src/main.rs"

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
