# SPDX-License-Identifier: LGPL-3.0-or-later

[graph]
all-features = true

[advisories]
unmaintained = "workspace"
yanked = "deny"
ignore = [
  { crate = "arrayref@0.3.9", reason = "Temporary through 2026-09-19 under https://github.com/OxiBelt/OxiBelt/issues/154; remove after separately authenticated upstream recovery." },
]

[licenses]
confidence-threshold = 0.93
unused-allowed-license = "deny"
allow = ["Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "CDLA-Permissive-2.0", "ISC", "MIT", "MIT-0", "Unicode-3.0"]
exceptions = [{ crate = "filebelt-nfs-bridge@0.1.0", allow = ["LGPL-3.0-or-later"] }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
