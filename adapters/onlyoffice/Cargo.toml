# SPDX-License-Identifier: AGPL-3.0-only

[workspace]
members = ["."]
resolver = "3"

[package]
name = "filebelt-onlyoffice-adapter"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "AGPL-3.0-only"
publish = false

[dependencies]
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
hmac = "=0.12.1"
prost = "=0.14.4"
quick-xml = { version = "=0.41.0", default-features = false }
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "rustls-tls-webpki-roots-no-provider"] }
rustls = { version = "=0.23.43", default-features = false, features = ["aws_lc_rs", "std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
subtle = "=2.6.1"
toml = "=1.1.4"
url = "=2.5.8"
zip = { version = "=6.0.0", default-features = false, features = ["deflate"] }

# The adapter may consume this Apache-2.0 schema over its documented process
# boundary.  The Apache workspace has no reverse dependency on this package.
filebelt-document-protocol = { version = "=0.1.0", path = "../../source/crates/filebelt-document-protocol" }
tokio = { version = "=1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = "=0.26.4"
x509-parser = "=0.18.1"

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
