# SPDX-License-Identifier: Apache-2.0

[graph]
all-features = true

[advisories]
unmaintained = "workspace"
yanked = "deny"
# `openidconnect` verifies issuer RSA signatures but never holds or performs a
# private-key RSA operation, so the Marvin private-key timing sink is absent.
# The producer-only Iggy path never accepts or validates an rkyv archive.
ignore = ["RUSTSEC-2023-0071", "RUSTSEC-2026-0235"]

[licenses]
confidence-threshold = 0.93
unused-allowed-license = "allow"
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
