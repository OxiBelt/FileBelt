# SPDX-License-Identifier: Apache-2.0

[graph]
all-features = true

[advisories]
unmaintained = "workspace"
yanked = "deny"
# `openidconnect` verifies issuer RSA signatures but never holds or performs a
# private-key RSA operation, so the Marvin private-key timing sink is absent.
ignore = [
  "RUSTSEC-2023-0071",
  { crate = "arrayref@0.3.9", reason = "Temporary through 2026-09-19 under https://github.com/OxiBelt/OxiBelt/issues/154; remove after separately authenticated upstream recovery." },
]

[licenses]
confidence-threshold = 0.93
unused-allowed-license = "deny"
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Zlib",
]
exceptions = [
  { crate = "libfuzzer-sys@0.4.13", allow = ["NCSA"] },
  { crate = "option-ext@0.2.0", allow = ["MPL-2.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
