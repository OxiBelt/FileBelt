apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "filebelt-git.name" . }}-default-deny
  labels:
{{ include "filebelt-git.labels" . | indent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "filebelt-git.name" . }}-coordinator-ingress
  labels:
{{ include "filebelt-git.labels" . | indent 4 }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: filebelt-git, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: git-adapter}
  policyTypes: [Ingress]
  ingress:
    - from:
{{ toYaml .Values.networkPolicy.coordinatorIngress.from | indent 8 }}
      ports: [{port: mtls, protocol: TCP}]
