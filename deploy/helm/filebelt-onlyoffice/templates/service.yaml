apiVersion: v1
kind: Service
metadata:
  name: {{ include "filebelt-onlyoffice.name" . }}
  labels:
{{ include "filebelt-onlyoffice.labels" . | indent 4 }}
  annotations:
{{ include "filebelt-onlyoffice.annotations" . | indent 4 }}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: filebelt-onlyoffice, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: onlyoffice-adapter}
  ports:
    - {name: https, port: {{ .Values.service.port }}, targetPort: https, protocol: TCP}
