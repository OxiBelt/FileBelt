{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if .Values.documents.enabled }}
{{- $quiescedReplicas := ternary 0 .Values.workloads.document.replicas .Values.deployment.quiesced -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "filebelt.name" . }}-document
  labels:
{{ include "filebelt.componentLabels" (dict "root" . "component" "document") | indent 4 }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "filebelt.name" . }}-document
  labels:
{{ include "filebelt.componentLabels" (dict "root" . "component" "document") | indent 4 }}
spec:
  replicas: {{ $quiescedReplicas }}
  minReadySeconds: {{ .Values.deployment.minReadySeconds }}
  progressDeadlineSeconds: 600
  revisionHistoryLimit: {{ .Values.deployment.revisionHistoryLimit }}
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector:
    matchLabels: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: document}
  template:
    metadata:
      labels:
{{ include "filebelt.componentLabels" (dict "root" . "component" "document") | indent 8 }}
      annotations:
        checksum/config: {{ include "filebelt.renderedFilebeltConfiguration" . | sha256sum | quote }}
        checksum/secrets: {{ printf "%s:%s:%s:%s:%s" .Values.secrets.documentDatabase.generation .Values.secrets.documentStorageCapabilityPrivateKey.generation .Values.secrets.documentStorageCapabilityPublicKeyset.generation .Values.secrets.documentApiServerTls.generation .Values.secrets.documentAdapterServerTls.generation | sha256sum | quote }}
    spec:
      serviceAccountName: {{ include "filebelt.name" . }}-document
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ .Values.workloads.document.terminationGracePeriodSeconds }}
      securityContext:
{{ include "filebelt.podSecurityContext" . | indent 8 }}
      topologySpreadConstraints:
        - {maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: ScheduleAnyway, labelSelector: {matchLabels: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: document}}}
        - {maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway, labelSelector: {matchLabels: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: document}}}
      containers:
        - name: document
          image: {{ include "filebelt.image" (dict "root" . "role" "filebelt-document") }}
          imagePullPolicy: IfNotPresent
          args: ["serve", "--config", "/etc/filebelt/filebelt.toml"]
          ports:
            - {name: document-api, containerPort: 8089, protocol: TCP}
            - {name: document-adapter, containerPort: 8090, protocol: TCP}
            - {name: operations, containerPort: 9090, protocol: TCP}
          startupProbe: {httpGet: {path: /health/live, port: operations}, periodSeconds: 2, failureThreshold: 30}
          livenessProbe: {httpGet: {path: /health/live, port: operations}, periodSeconds: 10, timeoutSeconds: 2, failureThreshold: 3}
          readinessProbe: {httpGet: {path: /health/ready, port: operations}, periodSeconds: 5, timeoutSeconds: 2, failureThreshold: 3}
          securityContext:
{{ include "filebelt.containerSecurityContext" . | indent 12 }}
          resources:
{{ toYaml .Values.workloads.document.resources | indent 12 }}
          volumeMounts:
            - {name: filebelt-config, mountPath: /etc/filebelt, readOnly: true}
            - {name: database, mountPath: /run/secrets/document-database-url, subPath: database-url, readOnly: true}
            - {name: document-storage-capability-private, mountPath: /run/secrets/document-storage-capability-private-key, subPath: private-key, readOnly: true}
            - {name: document-storage-capability-public, mountPath: /run/secrets/document-storage-capability-public-keyset, subPath: public-keyset, readOnly: true}
            - {name: api-server-tls, mountPath: /run/secrets/document-api-server-tls, readOnly: true}
            - {name: adapter-server-tls, mountPath: /run/secrets/document-adapter-server-tls, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
{{ include "filebelt.filebeltConfigVolume" . | indent 8 }}
        - name: database
          secret: {secretName: {{ .Values.secrets.documentDatabase.name }}, defaultMode: 0440, items: [{key: {{ .Values.secrets.documentDatabase.key }}, path: database-url}]}
        - name: document-storage-capability-private
          secret: {secretName: {{ .Values.secrets.documentStorageCapabilityPrivateKey.name }}, defaultMode: 0440, items: [{key: {{ .Values.secrets.documentStorageCapabilityPrivateKey.key }}, path: private-key}]}
        - name: document-storage-capability-public
          secret: {secretName: {{ .Values.secrets.documentStorageCapabilityPublicKeyset.name }}, defaultMode: 0440, items: [{key: {{ .Values.secrets.documentStorageCapabilityPublicKeyset.key }}, path: public-keyset}]}
        - name: api-server-tls
          secret: {secretName: {{ .Values.secrets.documentApiServerTls.name }}, defaultMode: 0440, items: [{key: {{ .Values.secrets.documentApiServerTls.certificateKey }}, path: tls.crt}, {key: {{ .Values.secrets.documentApiServerTls.privateKeyKey }}, path: tls.key}, {key: {{ .Values.secrets.documentApiServerTls.caKey }}, path: client-ca.crt}]}
        - name: adapter-server-tls
          secret: {secretName: {{ .Values.secrets.documentAdapterServerTls.name }}, defaultMode: 0440, items: [{key: {{ .Values.secrets.documentAdapterServerTls.certificateKey }}, path: tls.crt}, {key: {{ .Values.secrets.documentAdapterServerTls.privateKeyKey }}, path: tls.key}, {key: {{ .Values.secrets.documentAdapterServerTls.caKey }}, path: client-ca.crt}]}
{{ include "filebelt.tmpVolume" . | indent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "filebelt.name" . }}-document
  labels:
{{ include "filebelt.componentLabels" (dict "root" . "component" "document") | indent 4 }}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: document}
  ports:
    - {name: document-api, port: 8089, targetPort: document-api, protocol: TCP}
    - {name: document-adapter, port: 8090, targetPort: document-adapter, protocol: TCP}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "filebelt.name" . }}-document
  labels:
{{ include "filebelt.componentLabels" (dict "root" . "component" "document") | indent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: document}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "filebelt.name" . }}-document-ingress
  labels:
{{ include "filebelt.componentLabels" (dict "root" . "component" "document") | indent 4 }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: document}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: api}
      ports: [{port: document-api, protocol: TCP}]
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ .Values.documents.integrationNamespace }}}
          podSelector:
            matchLabels: {app.kubernetes.io/name: filebelt-onlyoffice, app.kubernetes.io/component: onlyoffice-adapter}
      ports: [{port: document-adapter, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "filebelt.name" . }}-document-egress
  labels:
{{ include "filebelt.componentLabels" (dict "root" . "component" "document") | indent 4 }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: document}
  policyTypes: [Egress]
  egress:
    - to:
{{ toYaml .Values.networkPolicy.dns.to | indent 8 }}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - to:
{{ toYaml .Values.networkPolicy.postgres.to | indent 8 }}
      ports: [{port: {{ .Values.networkPolicy.postgres.port }}, protocol: TCP}]
    {{- if .Values.networkPolicy.otlp.enabled }}
    - to:
{{ toYaml .Values.networkPolicy.otlp.to | indent 8 }}
      ports: [{port: {{ .Values.networkPolicy.otlp.port }}, protocol: TCP}]
    {{- end }}
{{- end }}
