{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if .Values.mcp.enabled }}
{{- $brokerReplicas := ternary 0 .Values.workloads.mcpBroker.replicas .Values.deployment.quiesced -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "filebelt.name" . }}-mcp-broker
  labels:
{{ include "filebelt.componentLabels" (dict "root" . "component" "mcp-broker") | indent 4 }}
spec:
  replicas: {{ $brokerReplicas }}
  minReadySeconds: {{ .Values.deployment.minReadySeconds }}
  progressDeadlineSeconds: 600
  revisionHistoryLimit: {{ .Values.deployment.revisionHistoryLimit }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: mcp-broker}
  template:
    metadata:
      labels:
{{ include "filebelt.componentLabels" (dict "root" . "component" "mcp-broker") | indent 8 }}
      annotations:
        checksum/config: {{ include "filebelt.renderedFilebeltConfiguration" . | sha256sum | quote }}
        checksum/secrets: {{ printf "%s:%s:%s:%s:%s:%s" .Values.secrets.mcpDatabase.generation .Values.secrets.mcpVaultKeyring.generation .Values.secrets.mcpBrokerServerTls.generation .Values.secrets.mcpGatewayClientTls.generation .Values.secrets.mcpBackendClientTls.generation .Values.secrets.controllerClientTls.generation | sha256sum | quote }}
    spec:
      serviceAccountName: {{ include "filebelt.name" . }}-mcp-broker
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ .Values.workloads.mcpBroker.terminationGracePeriodSeconds }}
      securityContext:
{{ include "filebelt.podSecurityContext" . | indent 8 }}
      topologySpreadConstraints:
        - {maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: ScheduleAnyway, labelSelector: {matchLabels: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: mcp-broker}}}
        - {maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway, labelSelector: {matchLabels: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: mcp-broker}}}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: mcp-broker}
      containers:
        - name: mcp-broker
          image: {{ include "filebelt.image" (dict "root" . "role" "filebelt-mcp-broker") }}
          imagePullPolicy: IfNotPresent
          args: ["serve", "--config", "/etc/filebelt/filebelt.toml"]
          ports:
            - {name: mcp, containerPort: 8082, protocol: TCP}
            - {name: runner-relay, containerPort: 8084, protocol: TCP}
            - {name: operations, containerPort: 9090, protocol: TCP}
          startupProbe: {httpGet: {path: /health/live, port: operations}, periodSeconds: 2, failureThreshold: 30}
          livenessProbe: {httpGet: {path: /health/live, port: operations}, periodSeconds: 10, timeoutSeconds: 2, failureThreshold: 3}
          readinessProbe: {httpGet: {path: /health/ready, port: operations}, periodSeconds: 5, timeoutSeconds: 2, failureThreshold: 3}
          securityContext:
{{ include "filebelt.containerSecurityContext" . | indent 12 }}
          resources:
{{ toYaml .Values.workloads.mcpBroker.resources | indent 12 }}
          volumeMounts:
            - {name: filebelt-config, mountPath: /etc/filebelt, readOnly: true}
            - {name: database, mountPath: /run/secrets/mcp-database-url, subPath: database-url, readOnly: true}
            - {name: vault, mountPath: /run/secrets/mcp-vault-keyring.json, subPath: keyring.json, readOnly: true}
            - {name: server-tls, mountPath: /run/secrets/mcp-broker-server-tls, readOnly: true}
            - {name: gateway-tls, mountPath: /run/secrets/mcp-gateway-tls, readOnly: true}
            - {name: backend-tls, mountPath: /run/secrets/mcp-backend-tls, readOnly: true}
            - {name: controller-tls, mountPath: /run/secrets/controller-client-tls, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
{{ include "filebelt.filebeltConfigVolume" . | indent 8 }}
        - name: database
          secret: {secretName: {{ .Values.secrets.mcpDatabase.name }}, defaultMode: 0440, items: [{key: {{ .Values.secrets.mcpDatabase.key }}, path: database-url}]}
        - name: vault
          secret: {secretName: {{ .Values.secrets.mcpVaultKeyring.name }}, defaultMode: 0440, items: [{key: {{ .Values.secrets.mcpVaultKeyring.key }}, path: keyring.json}]}
        - name: server-tls
          secret:
            secretName: {{ .Values.secrets.mcpBrokerServerTls.name }}
            defaultMode: 0440
            items: [{key: {{ .Values.secrets.mcpBrokerServerTls.certificateKey }}, path: tls.crt}, {key: {{ .Values.secrets.mcpBrokerServerTls.privateKeyKey }}, path: tls.key}, {key: {{ .Values.secrets.mcpBrokerServerTls.caKey }}, path: client-ca.crt}]
        - name: gateway-tls
          secret:
            secretName: {{ .Values.secrets.mcpGatewayClientTls.name }}
            defaultMode: 0440
            items: [{key: {{ .Values.secrets.mcpGatewayClientTls.certificateKey }}, path: tls.crt}, {key: {{ .Values.secrets.mcpGatewayClientTls.privateKeyKey }}, path: tls.key}, {key: {{ .Values.secrets.mcpGatewayClientTls.caKey }}, path: server-ca.crt}]
        - name: backend-tls
          secret:
            secretName: {{ .Values.secrets.mcpBackendClientTls.name }}
            defaultMode: 0440
            items: [{key: {{ .Values.secrets.mcpBackendClientTls.certificateKey }}, path: tls.crt}, {key: {{ .Values.secrets.mcpBackendClientTls.privateKeyKey }}, path: tls.key}, {key: {{ .Values.secrets.mcpBackendClientTls.caKey }}, path: server-ca.crt}]
        - name: controller-tls
          secret:
            secretName: {{ .Values.secrets.controllerClientTls.name }}
            defaultMode: 0440
            items: [{key: {{ .Values.secrets.controllerClientTls.certificateKey }}, path: tls.crt}, {key: {{ .Values.secrets.controllerClientTls.privateKeyKey }}, path: tls.key}, {key: {{ .Values.secrets.controllerClientTls.caKey }}, path: server-ca.crt}]
{{ include "filebelt.tmpVolume" . | indent 8 }}
{{- end }}
{{- if .Values.mcp.runners.enabled }}
---
{{- $controllerReplicas := ternary 0 .Values.workloads.controller.replicas .Values.deployment.quiesced -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "filebelt.name" . }}-controller
  labels:
{{ include "filebelt.componentLabels" (dict "root" . "component" "controller") | indent 4 }}
spec:
  replicas: {{ $controllerReplicas }}
  minReadySeconds: {{ .Values.deployment.minReadySeconds }}
  progressDeadlineSeconds: 600
  revisionHistoryLimit: {{ .Values.deployment.revisionHistoryLimit }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: controller}
  template:
    metadata:
      labels:
{{ include "filebelt.componentLabels" (dict "root" . "component" "controller") | indent 8 }}
      annotations:
        checksum/config: {{ include "filebelt.renderedFilebeltConfiguration" . | sha256sum | quote }}
        checksum/secrets: {{ .Values.secrets.controllerServerTls.generation | sha256sum | quote }}
    spec:
      serviceAccountName: {{ include "filebelt.name" . }}-controller
      automountServiceAccountToken: true
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ .Values.workloads.controller.terminationGracePeriodSeconds }}
      securityContext:
{{ include "filebelt.podSecurityContext" . | indent 8 }}
      topologySpreadConstraints:
        - {maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: ScheduleAnyway, labelSelector: {matchLabels: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: controller}}}
        - {maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway, labelSelector: {matchLabels: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: controller}}}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: controller}
      containers:
        - name: controller
          image: {{ include "filebelt.image" (dict "root" . "role" "filebelt-controller") }}
          imagePullPolicy: IfNotPresent
          args: ["serve", "--config", "/etc/filebelt/filebelt.toml"]
          env:
            - name: FILEBELT_CONTROLLER_POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: FILEBELT_CONTROLLER_POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - {name: FILEBELT_RELEASE_NAME, value: {{ .Release.Name | quote }}}
            - {name: FILEBELT_MCP_BROKER_ADDRESS, value: {{ printf "%s-mcp-broker.%s.svc:8084" (include "filebelt.name" .) .Release.Namespace | quote }}}
            - {name: FILEBELT_MCP_BROKER_SERVER_NAME, value: {{ printf "%s-mcp-broker.%s.svc" (include "filebelt.name" .) .Release.Namespace | quote }}}
            - {name: FILEBELT_MCP_BROKER_CLIENT_TLS_SECRET, value: {{ .Values.secrets.runnerBrokerClientTls.name | quote }}}
            - {name: FILEBELT_MCP_GATEWAY_ADDRESS, value: {{ .Values.mcp.gateway.address | quote }}}
            - {name: FILEBELT_MCP_GATEWAY_SERVER_NAME, value: {{ .Values.mcp.gateway.serverName | quote }}}
            - {name: FILEBELT_MCP_GATEWAY_CLIENT_TLS_SECRET, value: {{ .Values.secrets.runnerGatewayClientTls.name | quote }}}
            - {name: FILEBELT_MCP_GATEWAY_EGRESS_PROFILE, value: {{ .Values.mcp.gateway.profile | quote }}}
            - {name: FILEBELT_MCP_RUNNER_SERVICE_ACCOUNT, value: {{ printf "%s-mcp-runner" (include "filebelt.name" .) | quote }}}
          ports:
            - {name: controller, containerPort: 8083, protocol: TCP}
            - {name: operations, containerPort: 9090, protocol: TCP}
          startupProbe: {httpGet: {path: /health/live, port: operations}, periodSeconds: 2, failureThreshold: 30}
          livenessProbe: {httpGet: {path: /health/live, port: operations}, periodSeconds: 10, timeoutSeconds: 2, failureThreshold: 3}
          readinessProbe: {httpGet: {path: /health/ready, port: operations}, periodSeconds: 5, timeoutSeconds: 2, failureThreshold: 3}
          securityContext:
{{ include "filebelt.containerSecurityContext" . | indent 12 }}
          resources:
{{ toYaml .Values.workloads.controller.resources | indent 12 }}
          volumeMounts:
            - {name: filebelt-config, mountPath: /etc/filebelt, readOnly: true}
            - {name: catalog, mountPath: /etc/filebelt/mcp/catalog, readOnly: true}
            - {name: trusted-root, mountPath: /etc/filebelt/mcp/trust, readOnly: true}
            - {name: bundles, mountPath: /etc/filebelt/mcp/bundles, readOnly: true}
            - {name: server-tls, mountPath: /run/secrets/controller-server-tls, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
{{ include "filebelt.filebeltConfigVolume" . | indent 8 }}
        - name: catalog
          configMap: {name: {{ .Values.mcp.runners.catalogConfigMap }}, defaultMode: 0444, items: [{key: {{ .Values.mcp.runners.catalogKey }}, path: catalog.json}]}
        - name: trusted-root
          configMap: {name: {{ .Values.mcp.runners.trustedRootConfigMap }}, defaultMode: 0444, items: [{key: {{ .Values.mcp.runners.trustedRootKey }}, path: trusted-root.json}]}
        - name: bundles
          configMap: {name: {{ .Values.mcp.runners.bundlesConfigMap }}, defaultMode: 0444}
        - name: server-tls
          secret:
            secretName: {{ .Values.secrets.controllerServerTls.name }}
            defaultMode: 0440
            items: [{key: {{ .Values.secrets.controllerServerTls.certificateKey }}, path: tls.crt}, {key: {{ .Values.secrets.controllerServerTls.privateKeyKey }}, path: tls.key}, {key: {{ .Values.secrets.controllerServerTls.caKey }}, path: client-ca.crt}]
{{ include "filebelt.tmpVolume" . | indent 8 }}
{{- end }}
