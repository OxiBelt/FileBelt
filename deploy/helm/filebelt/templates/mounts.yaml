{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- $mountsEnabled := or .Values.mounts.smb.enabled .Values.mounts.ftpFtps.enabled .Values.mounts.nfs.enabled -}}
{{- if $mountsEnabled }}
{{- $root := . -}}
{{- $tailstateMount := "/var/lib/tailscale" -}}
{{- $tailscaledImage := include "filebelt.image" (dict "root" . "role" "tailscaled") -}}
{{- $workloads := list (dict "name" "vfs" "role" "filebelt-vfs" "values" .Values.mounts.vfs) -}}
{{- if or .Values.mounts.smb.enabled .Values.mounts.ftpFtps.enabled -}}
{{- $workloads = append $workloads (dict "name" "headscale-sync" "role" "filebelt-headscale-sync" "values" .Values.mounts.headscaleSync) -}}
{{- end -}}
{{- range $workload := $workloads }}
{{- $isVfs := eq $workload.name "vfs" -}}
{{- $replicas := ternary 0 $workload.values.replicas $root.Values.deployment.quiesced -}}
{{- $secretChecksum := printf "%s:%s:%s" $root.Values.secrets.headscaleSyncDatabase.generation $root.Values.secrets.headscaleApiToken.generation $root.Values.secrets.headscaleServerCa.generation -}}
{{- if $isVfs -}}
{{- $secretChecksum = printf "%s:%s:%s:%s:%s:%s:%s" $root.Values.secrets.vfsDatabase.generation $root.Values.secrets.mountVaultKeyring.generation $root.Values.secrets.mountStorageCapabilityPrivateKey.generation $root.Values.secrets.mountStorageCapabilityPublicKeyset.generation $root.Values.secrets.vfsServerTls.generation $root.Values.secrets.vfsManagementServerTls.generation $root.Values.secrets.vfsIoClientTls.generation -}}
{{- if $root.Values.mounts.nfs.enabled -}}
{{- $secretChecksum = printf "%s:%s" $secretChecksum $root.Values.secrets.nfsHandleKeyring.generation -}}
{{- end -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "filebelt.name" $root }}-{{ $workload.name }}
  labels:
{{ include "filebelt.componentLabels" (dict "root" $root "component" $workload.name) | indent 4 }}
spec:
  replicas: {{ $replicas }}
  minReadySeconds: {{ $root.Values.deployment.minReadySeconds }}
  progressDeadlineSeconds: 600
  revisionHistoryLimit: {{ $root.Values.deployment.revisionHistoryLimit }}
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector:
    matchLabels: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ $root.Release.Name }}, app.kubernetes.io/component: {{ $workload.name }}}
  template:
    metadata:
      labels:
{{ include "filebelt.componentLabels" (dict "root" $root "component" $workload.name) | indent 8 }}
      annotations:
        checksum/config: {{ include "filebelt.renderedFilebeltConfiguration" $root | sha256sum | quote }}
        checksum/secrets: {{ $secretChecksum | sha256sum | quote }}
    spec:
      serviceAccountName: {{ include "filebelt.name" $root }}-{{ $workload.name }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 45
      securityContext:
{{ include "filebelt.podSecurityContext" $root | indent 8 }}
      containers:
        - name: {{ $workload.name }}
          image: {{ include "filebelt.image" (dict "root" $root "role" $workload.role) }}
          imagePullPolicy: IfNotPresent
          args: ["serve", "--config", "/etc/filebelt/filebelt.toml"]
          ports:
          {{- if $isVfs }}
            - {name: vfs, containerPort: 8087, protocol: TCP}
            - {name: management, containerPort: 8088, protocol: TCP}
          {{- end }}
            - {name: operations, containerPort: 9090, protocol: TCP}
          startupProbe: {httpGet: {path: /health/live, port: operations}, periodSeconds: 2, failureThreshold: 30}
          livenessProbe: {httpGet: {path: /health/live, port: operations}, periodSeconds: 10, timeoutSeconds: 2, failureThreshold: 3}
          readinessProbe: {httpGet: {path: /health/ready, port: operations}, periodSeconds: 5, timeoutSeconds: 2, failureThreshold: 3}
          securityContext:
{{ include "filebelt.containerSecurityContext" $root | indent 12 }}
          resources:
{{ toYaml $workload.values.resources | indent 12 }}
          volumeMounts:
            - {name: filebelt-config, mountPath: /etc/filebelt, readOnly: true}
            - {name: database, mountPath: /run/secrets/mount-database-url, subPath: database-url, readOnly: true}
          {{- if $isVfs }}
            - {name: vault, mountPath: /run/secrets/mount-vault-keyring.json, subPath: keyring.json, readOnly: true}
            - {name: mount-storage-capability-private, mountPath: /run/secrets/mount-storage-capability-private-key, subPath: private-key, readOnly: true}
            - {name: mount-storage-capability-public, mountPath: /run/secrets/mount-storage-capability-public-keyset, subPath: public-keyset, readOnly: true}
            - {name: vfs-server-tls, mountPath: /run/secrets/vfs-server-tls, readOnly: true}
            - {name: management-server-tls, mountPath: /run/secrets/vfs-management-server-tls, readOnly: true}
            - {name: io-client-tls, mountPath: /run/secrets/vfs-io-client-tls, readOnly: true}
            {{- if $root.Values.mounts.nfs.enabled }}
            - {name: nfs-handle-keyring, mountPath: /run/secrets/nfs-handle-keyring.json, subPath: keyring.json, readOnly: true}
            {{- end }}
          {{- else }}
            - {name: headscale-token, mountPath: /run/secrets/headscale-api-token, subPath: token, readOnly: true}
            - {name: headscale-ca, mountPath: /run/secrets/headscale-server-ca/ca.crt, subPath: ca.crt, readOnly: true}
          {{- end }}
            - {name: tmp, mountPath: /tmp}
      volumes:
{{ include "filebelt.filebeltConfigVolume" $root | indent 8 }}
        - name: database
          secret: {secretName: {{ ternary $root.Values.secrets.vfsDatabase.name $root.Values.secrets.headscaleSyncDatabase.name $isVfs }}, defaultMode: 0440, items: [{key: {{ ternary $root.Values.secrets.vfsDatabase.key $root.Values.secrets.headscaleSyncDatabase.key $isVfs }}, path: database-url}]}
{{- if $isVfs }}
        - name: vault
          secret: {secretName: {{ $root.Values.secrets.mountVaultKeyring.name }}, defaultMode: 0440, items: [{key: {{ $root.Values.secrets.mountVaultKeyring.key }}, path: keyring.json}]}
        - name: mount-storage-capability-private
          secret: {secretName: {{ $root.Values.secrets.mountStorageCapabilityPrivateKey.name }}, defaultMode: 0440, items: [{key: {{ $root.Values.secrets.mountStorageCapabilityPrivateKey.key }}, path: private-key}]}
        - name: mount-storage-capability-public
          secret: {secretName: {{ $root.Values.secrets.mountStorageCapabilityPublicKeyset.name }}, defaultMode: 0440, items: [{key: {{ $root.Values.secrets.mountStorageCapabilityPublicKeyset.key }}, path: public-keyset}]}
        - name: vfs-server-tls
          secret: {secretName: {{ $root.Values.secrets.vfsServerTls.name }}, defaultMode: 0440, items: [{key: {{ $root.Values.secrets.vfsServerTls.certificateKey }}, path: tls.crt}, {key: {{ $root.Values.secrets.vfsServerTls.privateKeyKey }}, path: tls.key}, {key: {{ $root.Values.secrets.vfsServerTls.caKey }}, path: client-ca.crt}]}
        - name: management-server-tls
          secret: {secretName: {{ $root.Values.secrets.vfsManagementServerTls.name }}, defaultMode: 0440, items: [{key: {{ $root.Values.secrets.vfsManagementServerTls.certificateKey }}, path: tls.crt}, {key: {{ $root.Values.secrets.vfsManagementServerTls.privateKeyKey }}, path: tls.key}, {key: {{ $root.Values.secrets.vfsManagementServerTls.caKey }}, path: client-ca.crt}]}
        - name: io-client-tls
          secret: {secretName: {{ $root.Values.secrets.vfsIoClientTls.name }}, defaultMode: 0440, items: [{key: {{ $root.Values.secrets.vfsIoClientTls.certificateKey }}, path: tls.crt}, {key: {{ $root.Values.secrets.vfsIoClientTls.privateKeyKey }}, path: tls.key}, {key: {{ $root.Values.secrets.vfsIoClientTls.caKey }}, path: server-ca.crt}]}
{{- if $root.Values.mounts.nfs.enabled }}
        - name: nfs-handle-keyring
          secret: {secretName: {{ $root.Values.secrets.nfsHandleKeyring.name }}, defaultMode: 0440, items: [{key: {{ $root.Values.secrets.nfsHandleKeyring.key }}, path: keyring.json}]}
{{- end }}
{{- else }}
        - name: headscale-token
          secret: {secretName: {{ $root.Values.secrets.headscaleApiToken.name }}, defaultMode: 0440, items: [{key: {{ $root.Values.secrets.headscaleApiToken.key }}, path: token}]}
        - name: headscale-ca
          secret: {secretName: {{ $root.Values.secrets.headscaleServerCa.name }}, defaultMode: 0440, items: [{key: {{ $root.Values.secrets.headscaleServerCa.key }}, path: ca.crt}]}
{{- end }}
{{ include "filebelt.tmpVolume" $root | indent 8 }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "filebelt.name" $root }}-vfs
  labels:
{{ include "filebelt.componentLabels" (dict "root" $root "component" "vfs") | indent 4 }}
spec:
  type: ClusterIP
  {{- if $root.Values.mounts.vfs.clusterIP }}
  clusterIP: {{ $root.Values.mounts.vfs.clusterIP | quote }}
  {{- end }}
  selector: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ $root.Release.Name }}, app.kubernetes.io/component: vfs}
  ports: [{name: vfs, port: 8087, targetPort: vfs, protocol: TCP}]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "filebelt.name" $root }}-vfs-management
  labels:
{{ include "filebelt.componentLabels" (dict "root" $root "component" "vfs") | indent 4 }}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ $root.Release.Name }}, app.kubernetes.io/component: vfs}
  ports: [{name: management, port: 8088, targetPort: management, protocol: TCP}]
---
{{- $gateways := list -}}
{{- if .Values.mounts.smb.enabled -}}
{{- $gateways = append $gateways (dict "name" "smb-gateway" "role" "filebelt-smb-gateway" "values" .Values.mounts.smb) -}}
{{- end -}}
{{- if .Values.mounts.ftpFtps.enabled -}}
{{- $gateways = append $gateways (dict "name" "ftp-ftps-gateway" "role" "filebelt-ftp-ftps-gateway" "values" .Values.mounts.ftpFtps) -}}
{{- end -}}
{{- range $gateway := $gateways }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "filebelt.name" $root }}-{{ $gateway.name }}
  labels:
{{ include "filebelt.componentLabels" (dict "root" $root "component" $gateway.name) | indent 4 }}
spec:
  serviceName: {{ include "filebelt.name" $root }}-{{ $gateway.name }}
  replicas: {{ ternary 0 1 $root.Values.deployment.quiesced }}
  podManagementPolicy: OrderedReady
  updateStrategy: {type: RollingUpdate}
  selector:
    matchLabels: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ $root.Release.Name }}, app.kubernetes.io/component: {{ $gateway.name }}}
  template:
    metadata:
      labels:
{{ include "filebelt.componentLabels" (dict "root" $root "component" $gateway.name) | indent 8 }}
      annotations:
        filebelt.dev/adapter-license: {{ (index $root.Values.images $gateway.role).license | quote }}
        filebelt.dev/adapter-source: {{ (index $root.Values.images $gateway.role).source | quote }}
        checksum/tailnet-auth: {{ $root.Values.mounts.tailnet.authKeySecret.generation | sha256sum | quote }}
    spec:
      serviceAccountName: {{ include "filebelt.name" $root }}-{{ $gateway.name }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
{{ include "filebelt.podSecurityContext" $root | indent 8 }}
      containers:
        - name: {{ $gateway.name }}
          image: {{ include "filebelt.image" (dict "root" $root "role" $gateway.role) }}
          imagePullPolicy: IfNotPresent
          ports:
          {{- if eq $gateway.name "smb-gateway" }}
            - {name: smb, containerPort: 445, protocol: TCP}
          {{- else }}
            - {name: ftps, containerPort: 2121, protocol: TCP}
            {{- range $index, $port := $root.Values.mounts.ftpFtps.passivePorts }}
            - {name: {{ printf "passive-%d" $index }}, containerPort: {{ $port }}, protocol: TCP}
            {{- end }}
          {{- end }}
          securityContext:
{{ include "filebelt.containerSecurityContext" $root | indent 12 }}
          resources:
{{ toYaml $gateway.values.resources | indent 12 }}
          volumeMounts:
            - {name: gateway-tmp, mountPath: /tmp}
        - name: tailscaled
          image: {{ $tailscaledImage }}
          imagePullPolicy: IfNotPresent
          env:
            - {name: TS_AUTHKEY, valueFrom: {secretKeyRef: {name: {{ $root.Values.mounts.tailnet.authKeySecret.name }}, key: {{ $root.Values.mounts.tailnet.authKeySecret.key }}}}}
            - {name: TS_LOGIN_SERVER, value: {{ $root.Values.mounts.tailnet.address | quote }}}
            - {name: TS_STATE_DIR, value: /var/lib/tailscale}
          securityContext:
{{ include "filebelt.tailscaledSecurityContext" $root | indent 12 }}
          resources:
{{ toYaml $gateway.values.resources | indent 12 }}
          volumeMounts:
            - {name: tailstate, mountPath: {{ $tailstateMount }}}
            - {name: tun, mountPath: /dev/net/tun}
            - {name: tailscale-tmp, mountPath: /tmp}
      volumes:
        - name: tailstate
          persistentVolumeClaim: {claimName: {{ $gateway.values.tailstateClaim }}}
        - name: tun
          hostPath: {path: /dev/net/tun, type: CharDevice}
        - {name: gateway-tmp, emptyDir: {sizeLimit: 32Mi}}
        - {name: tailscale-tmp, emptyDir: {sizeLimit: 32Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "filebelt.name" $root }}-{{ $gateway.name }}
  labels:
{{ include "filebelt.componentLabels" (dict "root" $root "component" $gateway.name) | indent 4 }}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ $root.Release.Name }}, app.kubernetes.io/component: {{ $gateway.name }}}
  ports:
  {{- if eq $gateway.name "smb-gateway" }}
    - {name: smb, port: 445, targetPort: smb, protocol: TCP}
  {{- else }}
    - {name: ftps, port: 2121, targetPort: ftps, protocol: TCP}
    {{- range $index, $port := $root.Values.mounts.ftpFtps.passivePorts }}
    - {name: {{ printf "passive-%d" $index }}, port: {{ $port }}, targetPort: {{ printf "passive-%d" $index }}, protocol: TCP}
    {{- end }}
  {{- end }}
---
{{- end }}
{{- if .Values.mounts.nfs.enabled }}
{{- $nfsImage := include "filebelt.image" (dict "root" . "role" "filebelt-nfs-gateway") -}}
{{- $relayImage := include "filebelt.image" (dict "root" . "role" "filebelt-nfs-relay") -}}
{{- $topologyGeneration := include "filebelt.nfsTopologyGeneration" . -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "filebelt.name" . }}-nfs-gateway
  labels:
{{ include "filebelt.componentLabels" (dict "root" . "component" "nfs-gateway") | indent 4 }}
spec:
  serviceName: {{ include "filebelt.name" . }}-nfs-gateway
  replicas: {{ ternary 0 1 .Values.deployment.quiesced }}
  podManagementPolicy: OrderedReady
  updateStrategy: {type: RollingUpdate}
  selector:
    matchLabels: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: nfs-gateway}
  template:
    metadata:
      labels:
{{ include "filebelt.componentLabels" (dict "root" . "component" "nfs-gateway") | indent 8 }}
        filebelt.dev/nfs-zone: backend
        filebelt.dev/nfs-topology-generation: {{ $topologyGeneration | quote }}
      annotations:
        filebelt.dev/adapter-license: {{ (index .Values.images "filebelt-nfs-gateway").license | quote }}
        filebelt.dev/adapter-source: {{ (index .Values.images "filebelt-nfs-gateway").source | quote }}
        filebelt.dev/gateway-uri-san: "spiffe://filebelt/nfs-gateway/vfs"
        checksum/secrets: {{ printf "%s:%s" .Values.secrets.nfsGaneshaKeytab.generation .Values.secrets.nfsBridgeVfsClientTls.generation | sha256sum | quote }}
    spec:
      serviceAccountName: {{ include "filebelt.name" . }}-nfs-gateway
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ .Values.mounts.nfs.terminationGracePeriodSeconds }}
      hostAliases:
        - ip: {{ .Values.mounts.vfs.clusterIP | quote }}
          hostnames: [{{ include "filebelt.nfsVfsHostname" . | quote }}]
      securityContext:
{{ include "filebelt.nfsPodSecurityContext" . | indent 8 }}
      containers:
        - name: ganesha
          image: {{ $nfsImage }}
          imagePullPolicy: IfNotPresent
          command:
{{ toYaml .Values.mounts.nfs.ganesha.command | indent 12 }}
          args:
{{ toYaml .Values.mounts.nfs.ganesha.args | indent 12 }}
          env:
            - {name: KRB5_KTNAME, value: /run/secrets/nfs-ganesha/ganesha.keytab}
          ports:
            - {name: nfs, containerPort: 2049, protocol: TCP}
          lifecycle:
            preStop:
              exec:
                command:
{{ toYaml .Values.mounts.nfs.ganesha.preStopCommand | indent 18 }}
          startupProbe:
            exec:
              command:
{{ toYaml .Values.mounts.nfs.ganesha.healthCommand | indent 16 }}
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            exec:
              command:
{{ toYaml .Values.mounts.nfs.ganesha.healthCommand | indent 16 }}
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
{{ toYaml .Values.mounts.nfs.ganesha.healthCommand | indent 16 }}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
{{ include "filebelt.nfsGaneshaSecurityContext" . | indent 12 }}
          resources:
{{ toYaml .Values.mounts.nfs.ganesha.resources | indent 12 }}
          volumeMounts:
            - {name: ganesha-config, mountPath: /etc/ganesha, readOnly: true}
            - {name: ganesha-keytab, mountPath: /run/secrets/nfs-ganesha/ganesha.keytab, subPath: ganesha.keytab, readOnly: true}
            - {name: recovery, mountPath: /var/lib/nfs/ganesha/recovery}
            - {name: bridge-socket, mountPath: /run/filebelt-nfs}
            - {name: ganesha-tmp, mountPath: /tmp}
        - name: bridge
          image: {{ $nfsImage }}
          imagePullPolicy: IfNotPresent
          command:
{{ toYaml .Values.mounts.nfs.bridge.command | indent 12 }}
          args:
{{ toYaml .Values.mounts.nfs.bridge.args | indent 12 }}
          env:
            - {name: FILEBELT_NFS_EXPECTED_VFS_HOSTNAME, value: {{ include "filebelt.nfsVfsHostname" . | quote }}}
          lifecycle:
            preStop:
              exec:
                command:
{{ toYaml .Values.mounts.nfs.bridge.preStopCommand | indent 18 }}
          startupProbe:
            exec:
              command:
{{ toYaml .Values.mounts.nfs.bridge.healthCommand | indent 16 }}
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            exec:
              command:
{{ toYaml .Values.mounts.nfs.bridge.healthCommand | indent 16 }}
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
{{ toYaml .Values.mounts.nfs.bridge.healthCommand | indent 16 }}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
{{ include "filebelt.nfsBridgeSecurityContext" . | indent 12 }}
          resources:
{{ toYaml .Values.mounts.nfs.bridge.resources | indent 12 }}
          volumeMounts:
            - {name: bridge-config, mountPath: /etc/filebelt-nfs, readOnly: true}
            - {name: bridge-vfs-client-tls, mountPath: /run/secrets/nfs-bridge-vfs-client-tls, readOnly: true}
            - {name: bridge-socket, mountPath: /run/filebelt-nfs}
            - {name: bridge-tmp, mountPath: /tmp}
      volumes:
        - name: ganesha-config
          configMap: {name: {{ .Values.mounts.nfs.ganesha.configMap.name }}, defaultMode: 0444, items: [{key: {{ .Values.mounts.nfs.ganesha.configMap.key }}, path: ganesha.conf}]}
        - name: bridge-config
          configMap: {name: {{ .Values.mounts.nfs.bridge.configMap.name }}, defaultMode: 0444, items: [{key: {{ .Values.mounts.nfs.bridge.configMap.key }}, path: bridge.toml}]}
        - name: ganesha-keytab
          secret: {secretName: {{ .Values.secrets.nfsGaneshaKeytab.name }}, defaultMode: 0440, items: [{key: {{ .Values.secrets.nfsGaneshaKeytab.key }}, path: ganesha.keytab}]}
        - name: bridge-vfs-client-tls
          secret: {secretName: {{ .Values.secrets.nfsBridgeVfsClientTls.name }}, defaultMode: 0440, items: [{key: {{ .Values.secrets.nfsBridgeVfsClientTls.certificateKey }}, path: tls.crt}, {key: {{ .Values.secrets.nfsBridgeVfsClientTls.privateKeyKey }}, path: tls.key}, {key: {{ .Values.secrets.nfsBridgeVfsClientTls.caKey }}, path: server-ca.crt}]}
        - name: recovery
          persistentVolumeClaim: {claimName: {{ .Values.mounts.nfs.recoveryClaim }}}
        - {name: bridge-socket, emptyDir: {medium: Memory, sizeLimit: 16Mi}}
        - {name: ganesha-tmp, emptyDir: {sizeLimit: 64Mi}}
        - {name: bridge-tmp, emptyDir: {sizeLimit: 32Mi}}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "filebelt.name" . }}-nfs-relay
  labels:
{{ include "filebelt.componentLabels" (dict "root" . "component" "nfs-relay") | indent 4 }}
spec:
  serviceName: {{ include "filebelt.name" . }}-nfs-gateway
  replicas: {{ ternary 0 1 .Values.deployment.quiesced }}
  podManagementPolicy: OrderedReady
  updateStrategy: {type: RollingUpdate}
  selector:
    matchLabels: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: nfs-relay}
  template:
    metadata:
      labels:
{{ include "filebelt.componentLabels" (dict "root" . "component" "nfs-relay") | indent 8 }}
        filebelt.dev/nfs-zone: relay
        filebelt.dev/nfs-topology-generation: {{ $topologyGeneration | quote }}
      annotations:
        checksum/tailnet-auth: {{ .Values.mounts.tailnet.authKeySecret.generation | sha256sum | quote }}
    spec:
      serviceAccountName: {{ include "filebelt.name" . }}-nfs-relay
      automountServiceAccountToken: false
      enableServiceLinks: false
      shareProcessNamespace: false
      hostNetwork: false
      hostPID: false
      hostIPC: false
      terminationGracePeriodSeconds: {{ .Values.mounts.nfs.terminationGracePeriodSeconds }}
      securityContext:
{{ include "filebelt.podSecurityContext" . | indent 8 }}
      containers:
        - name: relay
          image: {{ $relayImage }}
          imagePullPolicy: IfNotPresent
          args:
            - serve
            - --listen-address
            - 0.0.0.0:2049
            - --backend-address
            - {{ include "filebelt.nfsBackendAddress" . | quote }}
            - --operations-address
            - 0.0.0.0:9090
            - --max-connections
            - {{ .Values.mounts.nfs.relay.maxConnections | quote }}
            - --max-connections-per-source
            - {{ .Values.mounts.nfs.relay.maxConnectionsPerSource | quote }}
            - --connect-timeout-seconds
            - {{ .Values.mounts.nfs.relay.connectTimeoutSeconds | quote }}
            - --inactivity-timeout-seconds
            - {{ .Values.mounts.nfs.relay.inactivityTimeoutSeconds | quote }}
            - --drain-timeout-seconds
            - {{ .Values.mounts.nfs.relay.drainTimeoutSeconds | quote }}
          ports:
            - {name: nfs, containerPort: 2049, protocol: TCP}
            - {name: operations, containerPort: 9090, protocol: TCP}
          startupProbe: {httpGet: {path: /health/live, port: operations}, periodSeconds: 2, failureThreshold: 30}
          livenessProbe: {httpGet: {path: /health/live, port: operations}, periodSeconds: 10, timeoutSeconds: 2, failureThreshold: 3}
          readinessProbe: {httpGet: {path: /health/ready, port: operations}, periodSeconds: 5, timeoutSeconds: 2, failureThreshold: 3}
          securityContext:
{{ include "filebelt.containerSecurityContext" . | indent 12 }}
          resources:
{{ toYaml .Values.mounts.nfs.relay.resources | indent 12 }}
        - name: tailscaled
          image: {{ $tailscaledImage }}
          imagePullPolicy: IfNotPresent
          env:
            - {name: TS_AUTHKEY, valueFrom: {secretKeyRef: {name: {{ .Values.mounts.tailnet.authKeySecret.name }}, key: {{ .Values.mounts.tailnet.authKeySecret.key }}}}}
            - {name: TS_HOSTNAME, value: {{ printf "%s-nfs-gateway-0" (include "filebelt.name" .) | quote }}}
            - {name: TS_LOGIN_SERVER, value: {{ .Values.mounts.tailnet.address | quote }}}
            - {name: TS_STATE_DIR, value: /var/lib/tailscale}
          securityContext:
{{ include "filebelt.tailscaledSecurityContext" . | indent 12 }}
          resources:
{{ toYaml .Values.mounts.nfs.tailscaled.resources | indent 12 }}
          volumeMounts:
            - {name: tailstate, mountPath: {{ $tailstateMount }}}
            - {name: tun, mountPath: /dev/net/tun}
            - {name: tailscale-tmp, mountPath: /tmp}
      volumes:
        - name: tailstate
          persistentVolumeClaim: {claimName: {{ .Values.mounts.nfs.tailstateClaim }}}
        - name: tun
          hostPath: {path: /dev/net/tun, type: CharDevice}
        - {name: tailscale-tmp, emptyDir: {sizeLimit: 32Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "filebelt.name" . }}-nfs-gateway
  labels:
{{ include "filebelt.componentLabels" (dict "root" . "component" "nfs-gateway") | indent 4 }}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ .Release.Name }}, filebelt.dev/nfs-zone: relay, filebelt.dev/nfs-topology-generation: {{ $topologyGeneration | quote }}}
  ports: [{name: nfs, port: 2049, targetPort: nfs, protocol: TCP}]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "filebelt.name" . }}-nfs-backend
  labels:
{{ include "filebelt.componentLabels" (dict "root" . "component" "nfs-gateway") | indent 4 }}
spec:
  type: ClusterIP
  clusterIP: {{ .Values.mounts.nfs.backendClusterIP | quote }}
  selector: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ .Release.Name }}, filebelt.dev/nfs-zone: backend, filebelt.dev/nfs-topology-generation: {{ $topologyGeneration | quote }}}
  ports: [{name: nfs, port: 2049, targetPort: nfs, protocol: TCP}]
---
{{- end }}
{{- end }}
