{{- $root := . -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "filebelt.name" . }}-default-deny
  labels:
{{ include "filebelt.labels" . | indent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "filebelt.name" . }}-web-ingress
  labels:
{{ include "filebelt.componentLabels" (dict "root" . "component" "web") | indent 4 }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: web}
  policyTypes: [Ingress]
  ingress:
    - from:
{{ toYaml .Values.networkPolicy.publicIngress.from | indent 8 }}
      ports: [{port: https, protocol: TCP}]
    {{- if .Values.collaboration.webtransport.enabled }}
    - from:
{{ toYaml .Values.networkPolicy.publicIngress.from | indent 8 }}
      ports: [{port: http3, protocol: UDP}]
    {{- end }}
---
{{- range $component := list "api" "io" }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "filebelt.name" $root }}-{{ $component }}-ingress
  labels:
{{ include "filebelt.componentLabels" (dict "root" $root "component" $component) | indent 4 }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ $root.Release.Name }}, app.kubernetes.io/component: {{ $component }}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ $root.Release.Name }}, app.kubernetes.io/component: web}
        {{- if and $root.Values.mcp.enabled (has $component (list "api" "io")) }}
        - podSelector:
            matchLabels: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ $root.Release.Name }}, app.kubernetes.io/component: mcp-broker}
        {{- end }}
        {{- if and $root.Values.collaboration.enabled (eq $component "io") }}
        - podSelector:
            matchLabels: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ $root.Release.Name }}, app.kubernetes.io/component: collaboration}
        {{- end }}
        {{- if and $root.Values.mounts.enabled (eq $component "io") }}
        - podSelector:
            matchLabels: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ $root.Release.Name }}, app.kubernetes.io/component: vfs}
        {{- end }}
        {{- if and $root.Values.documents.enabled (eq $component "io") }}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ $root.Values.documents.integrationNamespace }}}
          podSelector:
            matchLabels: {app.kubernetes.io/name: filebelt-onlyoffice, app.kubernetes.io/component: onlyoffice-adapter}
        {{- end }}
      ports: [{port: {{ $component }}, protocol: TCP}]
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "filebelt.name" . }}-metrics-ingress
  labels:
{{ include "filebelt.labels" . | indent 4 }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ .Release.Name }}}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [web, api, io, maintenance{{ if .Values.collaboration.enabled }}, collaboration{{ end }}{{ if .Values.documents.enabled }}, document{{ end }}{{ if .Values.mcp.enabled }}, mcp-broker{{ end }}{{ if .Values.mcp.runners.enabled }}, controller{{ end }}]
  policyTypes: [Ingress]
  ingress:
    - from:
{{ toYaml .Values.networkPolicy.monitoring.from | indent 8 }}
      ports: [{port: 9090, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "filebelt.name" . }}-web-egress
  labels:
{{ include "filebelt.componentLabels" (dict "root" . "component" "web") | indent 4 }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: web}
  policyTypes: [Egress]
  egress:
    - to:
{{ toYaml .Values.networkPolicy.dns.to | indent 8 }}
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: api}
      ports: [{port: api, protocol: TCP}]
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: io}
      ports: [{port: io, protocol: TCP}]
    {{- if .Values.collaboration.enabled }}
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: collaboration}
      ports: [{port: collaboration-ws, protocol: TCP}]
    {{- if .Values.collaboration.webtransport.enabled }}
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: collaboration}
      ports: [{port: collaboration-wt, protocol: UDP}]
    {{- end }}
    {{- end }}
    {{- if .Values.documents.enabled }}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ .Values.documents.integrationNamespace }}}
          podSelector:
            matchLabels: {app.kubernetes.io/name: filebelt-onlyoffice, app.kubernetes.io/component: onlyoffice-adapter}
      ports: [{port: {{ .Values.documents.adapterPort }}, protocol: TCP}]
    {{- end }}
    {{- if .Values.networkPolicy.otlp.enabled }}
    - to:
{{ toYaml .Values.networkPolicy.otlp.to | indent 8 }}
      ports: [{port: {{ .Values.networkPolicy.otlp.port }}, protocol: TCP}]
    {{- end }}
---
{{- range $component := list "api" "io" "maintenance" }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "filebelt.name" $root }}-{{ $component }}-egress
  labels:
{{ include "filebelt.componentLabels" (dict "root" $root "component" $component) | indent 4 }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ $root.Release.Name }}, app.kubernetes.io/component: {{ $component }}}
  policyTypes: [Egress]
  egress:
    - to:
{{ toYaml $root.Values.networkPolicy.dns.to | indent 8 }}
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
{{ toYaml $root.Values.networkPolicy.postgres.to | indent 8 }}
      ports: [{port: {{ $root.Values.networkPolicy.postgres.port }}, protocol: TCP}]
    {{- if eq $component "api" }}
    - to:
{{ toYaml $root.Values.networkPolicy.oidcGateway.to | indent 8 }}
      ports: [{port: {{ $root.Values.networkPolicy.oidcGateway.port }}, protocol: TCP}]
    {{- if $root.Values.mcp.enabled }}
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ $root.Release.Name }}, app.kubernetes.io/component: mcp-broker}
      ports: [{port: mcp, protocol: TCP}]
    {{- end }}
    {{- if $root.Values.mounts.enabled }}
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ $root.Release.Name }}, app.kubernetes.io/component: vfs}
      ports: [{port: management, protocol: TCP}]
    {{- end }}
    {{- if $root.Values.documents.enabled }}
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ $root.Release.Name }}, app.kubernetes.io/component: document}
      ports: [{port: document-api, protocol: TCP}]
    {{- end }}
    {{- end }}
    {{- if and (eq $component "maintenance") $root.Values.networkPolicy.iggy.enabled }}
    - to:
{{ toYaml $root.Values.networkPolicy.iggy.to | indent 8 }}
      ports: [{port: {{ $root.Values.networkPolicy.iggy.port }}, protocol: TCP}]
    {{- end }}
    {{- if $root.Values.networkPolicy.otlp.enabled }}
    - to:
{{ toYaml $root.Values.networkPolicy.otlp.to | indent 8 }}
      ports: [{port: {{ $root.Values.networkPolicy.otlp.port }}, protocol: TCP}]
    {{- end }}
---
{{- end }}
{{- if .Values.collaboration.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "filebelt.name" . }}-collaboration-ingress
  labels:
{{ include "filebelt.componentLabels" (dict "root" . "component" "collaboration") | indent 4 }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: collaboration}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: web}
      ports: [{port: collaboration-ws, protocol: TCP}]
    {{- if .Values.collaboration.webtransport.enabled }}
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: web}
      ports: [{port: collaboration-wt, protocol: UDP}]
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "filebelt.name" . }}-collaboration-egress
  labels:
{{ include "filebelt.componentLabels" (dict "root" . "component" "collaboration") | indent 4 }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: collaboration}
  policyTypes: [Egress]
  egress:
    - to:
{{ toYaml .Values.networkPolicy.dns.to | indent 8 }}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - to:
{{ toYaml .Values.networkPolicy.postgres.to | indent 8 }}
      ports: [{port: {{ .Values.networkPolicy.postgres.port }}, protocol: TCP}]
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: io}
      ports: [{port: io, protocol: TCP}]
    {{- if .Values.networkPolicy.otlp.enabled }}
    - to:
{{ toYaml .Values.networkPolicy.otlp.to | indent 8 }}
      ports: [{port: {{ .Values.networkPolicy.otlp.port }}, protocol: TCP}]
    {{- end }}
---
{{- end }}
{{- if .Values.mcp.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "filebelt.name" . }}-mcp-broker-ingress
  labels:
{{ include "filebelt.componentLabels" (dict "root" . "component" "mcp-broker") | indent 4 }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: mcp-broker}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: api}
      ports: [{port: mcp, protocol: TCP}]
    {{- if .Values.mcp.runners.enabled }}
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ .Values.mcp.runners.namespace }}}
          podSelector:
            matchLabels: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: mcp-runner}
      ports: [{port: runner-relay, protocol: TCP}]
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "filebelt.name" . }}-mcp-broker-egress
  labels:
{{ include "filebelt.componentLabels" (dict "root" . "component" "mcp-broker") | indent 4 }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: mcp-broker}
  policyTypes: [Egress]
  egress:
    - to:
{{ toYaml .Values.networkPolicy.dns.to | indent 8 }}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - to:
{{ toYaml .Values.networkPolicy.postgres.to | indent 8 }}
      ports: [{port: {{ .Values.networkPolicy.postgres.port }}, protocol: TCP}]
    - to:
{{ toYaml .Values.networkPolicy.mcpGateway.to | indent 8 }}
      ports: [{port: {{ .Values.networkPolicy.mcpGateway.port }}, protocol: TCP}]
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: api}
      ports: [{port: api, protocol: TCP}]
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: io}
      ports: [{port: io, protocol: TCP}]
    {{- if .Values.mcp.runners.enabled }}
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: controller}
      ports: [{port: controller, protocol: TCP}]
    {{- end }}
    {{- if .Values.networkPolicy.otlp.enabled }}
    - to:
{{ toYaml .Values.networkPolicy.otlp.to | indent 8 }}
      ports: [{port: {{ .Values.networkPolicy.otlp.port }}, protocol: TCP}]
    {{- end }}
---
{{- end }}
{{- if .Values.mcp.runners.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "filebelt.name" . }}-mcp-runner-default-deny
  namespace: {{ .Values.mcp.runners.namespace | quote }}
  labels:
{{ include "filebelt.componentLabels" (dict "root" . "component" "mcp-runner") | indent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "filebelt.name" . }}-controller-ingress
  labels:
{{ include "filebelt.componentLabels" (dict "root" . "component" "controller") | indent 4 }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: controller}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: mcp-broker}
      ports: [{port: controller, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "filebelt.name" . }}-controller-egress
  labels:
{{ include "filebelt.componentLabels" (dict "root" . "component" "controller") | indent 4 }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: controller}
  policyTypes: [Egress]
  egress:
    - to:
{{ toYaml .Values.networkPolicy.dns.to | indent 8 }}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - to:
{{ toYaml .Values.networkPolicy.kubernetesApi.to | indent 8 }}
      ports: [{port: {{ .Values.networkPolicy.kubernetesApi.port }}, protocol: TCP}]
    {{- if .Values.networkPolicy.otlp.enabled }}
    - to:
{{ toYaml .Values.networkPolicy.otlp.to | indent 8 }}
      ports: [{port: {{ .Values.networkPolicy.otlp.port }}, protocol: TCP}]
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "filebelt.name" . }}-mcp-runner-egress
  namespace: {{ .Values.mcp.runners.namespace | quote }}
  labels:
{{ include "filebelt.componentLabels" (dict "root" . "component" "mcp-runner") | indent 4 }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: mcp-runner}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ .Release.Namespace }}}
          podSelector:
            matchLabels: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: mcp-broker}
      ports: [{port: runner-relay, protocol: TCP}]
    - to:
{{ toYaml .Values.networkPolicy.mcpGateway.to | indent 8 }}
      ports: [{port: {{ .Values.networkPolicy.mcpGateway.port }}, protocol: TCP}]
---
{{- end }}
{{- if ne .Values.operation.type "none" }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "filebelt.name" . }}-operation-egress
  labels:
{{ include "filebelt.componentLabels" (dict "root" . "component" "tools-operation") | indent 4 }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: tools-operation}
  policyTypes: [Egress]
  {{- if has .Values.operation.type (list "keys-audit" "storage-probe") }}
  egress: []
  {{- else }}
  egress:
    - to:
{{ toYaml .Values.networkPolicy.dns.to | indent 8 }}
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
{{ toYaml .Values.networkPolicy.postgres.to | indent 8 }}
      ports: [{port: {{ .Values.networkPolicy.postgres.port }}, protocol: TCP}]
  {{- end }}
{{- end }}
{{- if .Values.mounts.enabled }}
{{- $root := . -}}
{{- range $component := list "vfs" "headscale-sync" "smb-gateway" "ftp-ftps-gateway" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "filebelt.name" $root }}-{{ $component }}-egress
  labels:
{{ include "filebelt.componentLabels" (dict "root" $root "component" $component) | indent 4 }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ $root.Release.Name }}, app.kubernetes.io/component: {{ $component }}}
  policyTypes: [Egress]
  egress:
    - to:
{{ toYaml $root.Values.networkPolicy.dns.to | indent 8 }}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
{{- if ne $component "vfs" }}
    - to:
{{ toYaml $root.Values.networkPolicy.headscale.to | indent 8 }}
      ports: [{port: {{ $root.Values.networkPolicy.headscale.port }}, protocol: TCP}]
{{- end }}
{{- if or (eq $component "vfs") (eq $component "headscale-sync") }}
    - to:
{{ toYaml $root.Values.networkPolicy.postgres.to | indent 8 }}
      ports: [{port: {{ $root.Values.networkPolicy.postgres.port }}, protocol: TCP}]
{{- end }}
{{- if eq $component "vfs" }}
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ $root.Release.Name }}, app.kubernetes.io/component: io}
      ports: [{port: io, protocol: TCP}]
{{- end }}
{{- if or (eq $component "smb-gateway") (eq $component "ftp-ftps-gateway") }}
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ $root.Release.Name }}, app.kubernetes.io/component: vfs}
      ports: [{port: vfs, protocol: TCP}]
{{- end }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "filebelt.name" $root }}-vfs-ingress
  labels:
{{ include "filebelt.componentLabels" (dict "root" $root "component" "vfs") | indent 4 }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ $root.Release.Name }}, app.kubernetes.io/component: vfs}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ $root.Release.Name }}, app.kubernetes.io/component: smb-gateway}
        - podSelector:
            matchLabels: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ $root.Release.Name }}, app.kubernetes.io/component: ftp-ftps-gateway}
      ports: [{port: vfs, protocol: TCP}]
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ $root.Release.Name }}, app.kubernetes.io/component: api}
      ports: [{port: management, protocol: TCP}]
{{- range $gateway := list "smb-gateway" "ftp-ftps-gateway" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "filebelt.name" $root }}-{{ $gateway }}-ingress
  labels:
{{ include "filebelt.componentLabels" (dict "root" $root "component" $gateway) | indent 4 }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ $root.Release.Name }}, app.kubernetes.io/component: {{ $gateway }}}
  policyTypes: [Ingress]
  ingress:
    - from:
{{ toYaml $root.Values.networkPolicy.mountIngress.from | indent 8 }}
      ports:
        {{- if eq $gateway "smb-gateway" }}
        - {port: smb, protocol: TCP}
        {{- else }}
        - {port: ftps, protocol: TCP}
        {{- range $index, $_ := $root.Values.mounts.ftpFtps.passivePorts }}
        - {port: {{ printf "passive-%d" $index }}, protocol: TCP}
        {{- end }}
        {{- end }}
{{- end }}
{{- end }}
