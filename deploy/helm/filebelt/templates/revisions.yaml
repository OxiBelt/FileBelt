{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if .Values.revisions.enabled }}
{{- $quiescedReplicas := ternary 0 .Values.workloads.revision.replicas .Values.deployment.quiesced -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "filebelt.name" . }}-revision
  labels:
{{ include "filebelt.componentLabels" (dict "root" . "component" "revision-coordinator") | indent 4 }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "filebelt.name" . }}-revision
  labels:
{{ include "filebelt.componentLabels" (dict "root" . "component" "revision-coordinator") | indent 4 }}
spec:
  replicas: {{ $quiescedReplicas }}
  minReadySeconds: {{ .Values.deployment.minReadySeconds }}
  progressDeadlineSeconds: 600
  revisionHistoryLimit: {{ .Values.deployment.revisionHistoryLimit }}
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: revision-coordinator}
  template:
    metadata:
      labels:
{{ include "filebelt.componentLabels" (dict "root" . "component" "revision-coordinator") | indent 8 }}
      annotations:
        checksum/config: {{ include "filebelt.renderedFilebeltConfiguration" . | sha256sum | quote }}
        checksum/secrets: {{ printf "%s:%s:%s:%s:%s:%s:%s" .Values.secrets.revisionDatabase.generation .Values.secrets.revisionStorageCapabilityPrivateKey.generation .Values.secrets.revisionStorageCapabilityPublicKeyset.generation .Values.secrets.revisionServerTls.generation .Values.secrets.revisionAdapterClientTls.generation .Values.secrets.revisionIoClientTls.generation .Values.revisions.activation.compatibilityGate | sha256sum | quote }}
    spec:
      serviceAccountName: {{ include "filebelt.name" . }}-revision
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ .Values.workloads.revision.terminationGracePeriodSeconds }}
      securityContext:
{{ include "filebelt.podSecurityContext" . | indent 8 }}
      containers:
        - name: revision
          image: {{ include "filebelt.image" (dict "root" . "role" "filebelt-revision") }}
          imagePullPolicy: IfNotPresent
          args: ["serve", "--config", "/etc/filebelt/filebelt.toml"]
          ports:
            - {name: revision, containerPort: 8091, protocol: TCP}
            - {name: operations, containerPort: 9090, protocol: TCP}
          startupProbe: {httpGet: {path: /health/live, port: operations}, periodSeconds: 2, failureThreshold: 30}
          livenessProbe: {httpGet: {path: /health/live, port: operations}, periodSeconds: 10, timeoutSeconds: 2, failureThreshold: 3}
          readinessProbe: {httpGet: {path: /health/ready, port: operations}, periodSeconds: 5, timeoutSeconds: 2, failureThreshold: 3}
          securityContext:
{{ include "filebelt.containerSecurityContext" . | indent 12 }}
          resources:
{{ toYaml .Values.workloads.revision.resources | indent 12 }}
          volumeMounts:
            - {name: filebelt-config, mountPath: /etc/filebelt, readOnly: true}
            - {name: database, mountPath: /run/secrets/revision-database-url, subPath: database-url, readOnly: true}
            - {name: storage-capability-private, mountPath: /run/secrets/revision-storage-capability-private-key, subPath: private-key, readOnly: true}
            - {name: storage-capability-public, mountPath: /run/secrets/revision-storage-capability-public-keyset, subPath: public-keyset, readOnly: true}
            - {name: server-tls, mountPath: /run/secrets/revision-server-tls, readOnly: true}
            - {name: adapter-client-tls, mountPath: /run/secrets/revision-adapter-client-tls, readOnly: true}
            - {name: io-client-tls, mountPath: /run/secrets/revision-io-client-tls, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
{{ include "filebelt.filebeltConfigVolume" . | indent 8 }}
        - name: database
          secret: {secretName: {{ .Values.secrets.revisionDatabase.name }}, defaultMode: 0440, items: [{key: {{ .Values.secrets.revisionDatabase.key }}, path: database-url}]}
        - name: storage-capability-private
          secret: {secretName: {{ .Values.secrets.revisionStorageCapabilityPrivateKey.name }}, defaultMode: 0440, items: [{key: {{ .Values.secrets.revisionStorageCapabilityPrivateKey.key }}, path: private-key}]}
        - name: storage-capability-public
          secret: {secretName: {{ .Values.secrets.revisionStorageCapabilityPublicKeyset.name }}, defaultMode: 0440, items: [{key: {{ .Values.secrets.revisionStorageCapabilityPublicKeyset.key }}, path: public-keyset}]}
        - name: server-tls
          secret: {secretName: {{ .Values.secrets.revisionServerTls.name }}, defaultMode: 0440, items: [{key: {{ .Values.secrets.revisionServerTls.certificateKey }}, path: tls.crt}, {key: {{ .Values.secrets.revisionServerTls.privateKeyKey }}, path: tls.key}, {key: {{ .Values.secrets.revisionServerTls.caKey }}, path: client-ca.crt}]}
        - name: adapter-client-tls
          secret: {secretName: {{ .Values.secrets.revisionAdapterClientTls.name }}, defaultMode: 0440, items: [{key: {{ .Values.secrets.revisionAdapterClientTls.certificateKey }}, path: tls.crt}, {key: {{ .Values.secrets.revisionAdapterClientTls.privateKeyKey }}, path: tls.key}, {key: {{ .Values.secrets.revisionAdapterClientTls.caKey }}, path: server-ca.crt}]}
        - name: io-client-tls
          secret: {secretName: {{ .Values.secrets.revisionIoClientTls.name }}, defaultMode: 0440, items: [{key: {{ .Values.secrets.revisionIoClientTls.certificateKey }}, path: tls.crt}, {key: {{ .Values.secrets.revisionIoClientTls.privateKeyKey }}, path: tls.key}, {key: {{ .Values.secrets.revisionIoClientTls.caKey }}, path: server-ca.crt}]}
{{ include "filebelt.tmpVolume" . | indent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "filebelt.name" . }}-revision
  labels:
{{ include "filebelt.componentLabels" (dict "root" . "component" "revision-coordinator") | indent 4 }}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: revision-coordinator}
  ports:
    - {name: revision, port: 8091, targetPort: revision, protocol: TCP}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "filebelt.name" . }}-revision
  labels:
{{ include "filebelt.componentLabels" (dict "root" . "component" "revision-coordinator") | indent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: revision-coordinator}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "filebelt.name" . }}-revision-ingress
  labels:
{{ include "filebelt.componentLabels" (dict "root" . "component" "revision-coordinator") | indent 4 }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: revision-coordinator}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: api}
      ports: [{port: revision, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "filebelt.name" . }}-revision-egress
  labels:
{{ include "filebelt.componentLabels" (dict "root" . "component" "revision-coordinator") | indent 4 }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: revision-coordinator}
  policyTypes: [Egress]
  egress:
    - to:
{{ toYaml .Values.networkPolicy.dns.to | indent 8 }}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - to:
{{ toYaml .Values.networkPolicy.postgres.to | indent 8 }}
      ports: [{port: {{ .Values.networkPolicy.postgres.port }}, protocol: TCP}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ .Values.revisions.gitNamespace }}}
          podSelector:
            matchLabels: {app.kubernetes.io/name: filebelt-git, app.kubernetes.io/component: git-adapter}
      ports: [{port: {{ .Values.revisions.adapterPort }}, protocol: TCP}]
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: io}
      ports: [{port: io, protocol: TCP}]
    {{- if .Values.networkPolicy.otlp.enabled }}
    - to:
{{ toYaml .Values.networkPolicy.otlp.to | indent 8 }}
      ports: [{port: {{ .Values.networkPolicy.otlp.port }}, protocol: TCP}]
    {{- end }}
{{- end }}
