{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- $root := . -}}
{{- range $component := list "web" "api" "io" "maintenance" "tools" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "filebelt.name" $root }}-{{ $component }}
  labels:
{{ include "filebelt.componentLabels" (dict "root" $root "component" $component) | indent 4 }}
automountServiceAccountToken: false
---
{{- end }}
{{- if .Values.collaboration.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "filebelt.name" . }}-collaboration
  labels:
{{ include "filebelt.componentLabels" (dict "root" . "component" "collaboration") | indent 4 }}
automountServiceAccountToken: false
---
{{- end }}
{{- if .Values.mcp.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "filebelt.name" . }}-mcp-broker
  labels:
{{ include "filebelt.componentLabels" (dict "root" . "component" "mcp-broker") | indent 4 }}
automountServiceAccountToken: false
---
{{- end }}
{{- if .Values.mcp.runners.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "filebelt.name" . }}-controller
  labels:
{{ include "filebelt.componentLabels" (dict "root" . "component" "controller") | indent 4 }}
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "filebelt.name" . }}-mcp-runner
  namespace: {{ .Values.mcp.runners.namespace | quote }}
  labels:
{{ include "filebelt.componentLabels" (dict "root" . "component" "mcp-runner") | indent 4 }}
automountServiceAccountToken: false
{{- end }}
{{- if (or .Values.mounts.smb.enabled .Values.mounts.ftpFtps.enabled .Values.mounts.nfs.enabled) }}
{{- $mountComponents := list "vfs" -}}
{{- if (or .Values.mounts.smb.enabled .Values.mounts.ftpFtps.enabled) }}{{- $mountComponents = append $mountComponents "headscale-sync" -}}{{- end }}
{{- if .Values.mounts.smb.enabled }}{{- $mountComponents = append $mountComponents "smb-gateway" -}}{{- end }}
{{- if .Values.mounts.ftpFtps.enabled }}{{- $mountComponents = append $mountComponents "ftp-ftps-gateway" -}}{{- end }}
{{- if .Values.mounts.nfs.enabled }}{{- $mountComponents = append $mountComponents "nfs-gateway" -}}{{- end }}
{{- range $component := $mountComponents }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "filebelt.name" $ }}-{{ $component }}
  labels:
{{ include "filebelt.componentLabels" (dict "root" $ "component" $component) | indent 4 }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
