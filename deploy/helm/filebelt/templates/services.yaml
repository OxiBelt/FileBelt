{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- $root := . -}}
{{- range $service := list (dict "component" "web" "name" "web" "portName" "https" "port" 8443) (dict "component" "api" "name" "api" "portName" "api" "port" 8080) (dict "component" "io" "name" "worker-io" "portName" "io" "port" 8081) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "filebelt.name" $root }}-{{ $service.name }}
  labels:
{{ include "filebelt.componentLabels" (dict "root" $root "component" $service.component) | indent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: filebelt
    app.kubernetes.io/instance: {{ $root.Release.Name }}
    app.kubernetes.io/component: {{ $service.component }}
  ports:
    - name: {{ $service.portName }}
      port: {{ $service.port }}
      targetPort: {{ $service.portName }}
      protocol: TCP
    {{- if and (eq $service.component "web") $root.Values.collaboration.webtransport.enabled }}
    - {name: http3, port: 8443, targetPort: http3, protocol: UDP}
    {{- end }}
---
{{- end }}
{{- if .Values.collaboration.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "filebelt.name" . }}-collaboration
  labels:
{{ include "filebelt.componentLabels" (dict "root" . "component" "collaboration") | indent 4 }}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: collaboration}
  ports:
    - {name: collaboration-ws, port: 8085, targetPort: collaboration-ws, protocol: TCP}
    {{- if .Values.collaboration.webtransport.enabled }}
    - {name: collaboration-wt, port: 8086, targetPort: collaboration-wt, protocol: UDP}
    {{- end }}
---
{{- end }}
{{- if .Values.mcp.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "filebelt.name" . }}-mcp-broker
  labels:
{{ include "filebelt.componentLabels" (dict "root" . "component" "mcp-broker") | indent 4 }}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: mcp-broker}
  ports:
    - {name: mcp, port: 8082, targetPort: mcp, protocol: TCP}
    {{- if .Values.mcp.runners.enabled }}
    - {name: runner-relay, port: 8084, targetPort: runner-relay, protocol: TCP}
    {{- end }}
---
{{- end }}
{{- if .Values.mcp.runners.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "filebelt.name" . }}-controller
  labels:
{{ include "filebelt.componentLabels" (dict "root" . "component" "controller") | indent 4 }}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: filebelt, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: controller}
  ports: [{name: controller, port: 8083, targetPort: controller, protocol: TCP}]
---
{{- end }}
{{- $metricsComponents := list "web" "api" "io" "maintenance" -}}
{{- if .Values.collaboration.enabled }}{{- $metricsComponents = append $metricsComponents "collaboration" -}}{{- end }}
{{- if .Values.mcp.enabled }}{{- $metricsComponents = append $metricsComponents "mcp-broker" -}}{{- end }}
{{- if .Values.mcp.runners.enabled }}{{- $metricsComponents = append $metricsComponents "controller" -}}{{- end }}
{{- if .Values.mounts.nfs.enabled }}{{- $metricsComponents = append $metricsComponents "nfs-relay" -}}{{- end }}
{{- if .Values.revisions.enabled }}{{- $metricsComponents = append $metricsComponents "revision-coordinator" -}}{{- end }}
{{- range $component := $metricsComponents }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "filebelt.name" $root }}-{{ $component }}-metrics
  labels:
{{ include "filebelt.componentLabels" (dict "root" $root "component" $component) | indent 4 }}
    filebelt.dev/metrics: "true"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: filebelt
    app.kubernetes.io/instance: {{ $root.Release.Name }}
    app.kubernetes.io/component: {{ $component }}
  ports:
    - name: metrics
      port: 9090
      targetPort: {{ if eq $component "web" }}metrics{{ else }}operations{{ end }}
      protocol: TCP
---
{{- end }}
