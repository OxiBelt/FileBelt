  collaborationDatabase: {name: filebelt-collaboration-database, key: database-url, generation: "1"}
  collaborationServerTls: {name: filebelt-collaboration-server-tls, certificateKey: tls.crt, privateKeyKey: tls.key, caKey: client-ca.crt, generation: "1"}
  collaborationIoClientTls: {name: filebelt-collaboration-io-client-tls, certificateKey: tls.crt, privateKeyKey: tls.key, caKey: server-ca.crt, generation: "1"}
