mcp:
  enabled: false
  runners:
    enabled: false
    namespace: filebelt-mcp-runners
    catalogConfigMap: filebelt-mcp-runner-catalog
    catalogKey: catalog.json
    trustedRootConfigMap: filebelt-mcp-sigstore-trusted-root
    trustedRootKey: trusted-root.json
    bundlesConfigMap: filebelt-mcp-sigstore-bundles
  gateway:
    address: filebelt-mcp-egress.filebelt-egress.svc:8443
    serverName: filebelt-mcp-egress.filebelt-egress.svc
    profile: public-web

collaboration:
  enabled: false
  webtransport:
    enabled: false

# The Apache coordinator and separate AGPL adapter are opt-in and disabled by
# default. Install the adapter chart in the named integration namespace first.
documents:
  enabled: false
  integrationNamespace: filebelt-integrations
  adapterOrigin: https://filebelt-onlyoffice-adapter.filebelt-integrations.svc:8089
  adapterServerName: filebelt-onlyoffice-adapter.filebelt-integrations.svc
  adapterPort: 8089
  launchAction: https://filebelt-editor.example.invalid/onlyoffice/launch
  providerOrigin: https://documentserver.example.invalid

# Mount delivery is opt-in. FileBelt never creates gateway tailstate storage:
# each protocol gateway receives a distinct, operator-provisioned RWO claim.
mounts:
  enabled: false
  # Direct SMB/FTPS tailnet listeners require the node TUN device and NET_ADMIN;
  # userspace mode is intentionally unavailable because no proxy is configured.
  tailnet:
    kernelNetworking: true
  headscale:
    address: https://headscale.example.invalid:443
    apiUrl: https://headscale.example.invalid/
    oidcIssuer: https://issuer.example.invalid/
    syncSeconds: 15
    authKeySecret: {name: filebelt-tailnet-auth, key: authkey, generation: "1"}
  vfs:
    replicas: 2
    resources:
      requests: {cpu: 100m, memory: 128Mi, ephemeral-storage: 128Mi}
      limits: {cpu: "1", memory: 512Mi, ephemeral-storage: 512Mi}
  headscaleSync:
    replicas: 1
    resources:
      requests: {cpu: 100m, memory: 128Mi, ephemeral-storage: 128Mi}
      limits: {cpu: "1", memory: 512Mi, ephemeral-storage: 512Mi}
  smb:
    tailstateClaim: filebelt-smb-tailstate
    resources:
      requests: {cpu: 250m, memory: 256Mi, ephemeral-storage: 128Mi}
      limits: {cpu: "2", memory: 1Gi, ephemeral-storage: 512Mi}
  ftpFtps:
    tailstateClaim: filebelt-ftp-ftps-tailstate
    passivePorts: [30000, 30001]
    resources:
      requests: {cpu: 250m, memory: 256Mi, ephemeral-storage: 128Mi}
      limits: {cpu: "2", memory: 1Gi, ephemeral-storage: 512Mi}

networkPolicy:
  publicIngress:
    from:
      - namespaceSelector:
          matchLabels: {kubernetes.io/metadata.name: filebelt-ingress}
        podSelector:
          matchLabels: {app.kubernetes.io/name: filebelt-ingress}
  monitoring:
    from:
      - namespaceSelector:
          matchLabels: {kubernetes.io/metadata.name: monitoring}
        podSelector:
          matchLabels: {app.kubernetes.io/name: prometheus}
  dns:
    to:
      - namespaceSelector:
          matchLabels: {kubernetes.io/metadata.name: kube-system}
        podSelector:
          matchLabels: {k8s-app: kube-dns}
  postgres:
    port: 5432
    to:
      - namespaceSelector:
          matchLabels: {kubernetes.io/metadata.name: filebelt-data}
        podSelector:
          matchLabels: {app.kubernetes.io/name: filebelt-postgresql}
  oidcGateway:
    port: 8080
    to:
      - namespaceSelector:
          matchLabels: {kubernetes.io/metadata.name: filebelt-egress}
        podSelector:
          matchLabels: {app.kubernetes.io/name: filebelt-oidc-egress}
  mcpGateway:
    enabled: false
    port: 8443
    to:
      - namespaceSelector:
          matchLabels: {kubernetes.io/metadata.name: filebelt-egress}
        podSelector:
          matchLabels: {app.kubernetes.io/name: filebelt-mcp-egress}
  kubernetesApi:
    enabled: false
    port: 443
    to: []
  iggy:
    enabled: false
    port: 8090
    to: []
  otlp:
    enabled: false
    port: 4318
    to: []
  headscale:
    port: 443
    to: []
  mountIngress:
    from: []

monitoring:
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}
  prometheusRule:
    enabled: false
    labels: {}

# Exactly one explicit, non-hook Job may be rendered. operationId makes every
# execution name and evidence record unique and must be a UUID when type != none.
operation:
  type: none
  operationId: ""
  tenantSlugConfirmation: ""
  actorPrincipalId: ""
  payloadId: ""
  args: []
  checkpoint:
    secretName: ""
    key: checkpoint.json
