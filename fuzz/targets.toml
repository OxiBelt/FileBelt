# SPDX-License-Identifier: Apache-2.0

schema_version = 2
cargo_fuzz_version = "0.13.2"
libfuzzer_sys_version = "0.4.13"
stable_toolchain = "1.97.1"
asan_toolchain = "nightly-2026-08-04"
timeout_seconds = 10
rss_limit_mib = 3072
malloc_limit_mib = 512
smoke_runs = 256

[[target]]
name = "nfs_vfs_boundary"
max_input_bytes = 4096
seed_directory = "fuzz/seeds/nfs_vfs_boundary"

[[target]]
name = "mcp_runner_relay"
max_input_bytes = 131072
seed_directory = "fuzz/seeds/mcp_runner_relay"
dictionary = "fuzz/dictionaries/mcp_runner_relay.dict"

[[target]]
name = "collaboration_wire"
max_input_bytes = 262144
seed_directory = "fuzz/seeds/collaboration_wire"

[[quarantine]]
target = "collaboration_wire"
target_source = "fuzz/fuzz_targets/collaboration_wire.rs"
target_sha256 = "ade6705cb0a691a9c9e6d7779932ede34a7b127e50d95fc2eac0a081d2c26d8b"
status = "risk_accepted"
dependency_name = "yrs"
dependency_version = "0.27.3"
dependency_source = "registry+https://github.com/rust-lang/crates.io-index"
dependency_checksum = "9d3a728b1abffeca5b9e5319c5b81e04b73790cbdc1e342da8d91b440b3026cb"
tracker = "https://github.com/OxiBelt/FileBelt/issues/10"
review_required_on_change = true
clearance_requires = ["tracked_resolution", "dependency_identity_change", "private_validation"]

[[target]]
name = "revision_protocol"
max_input_bytes = 1048576
seed_directory = "fuzz/seeds/revision_protocol"

[[target]]
name = "runtime_config"
max_input_bytes = 65536
seed_directory = "fuzz/seeds/runtime_config"
dictionary = "fuzz/dictionaries/runtime_config.dict"
