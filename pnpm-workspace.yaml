# SPDX-License-Identifier: Apache-2.0

packages:
  - "devops"
  - "ui/*"

autoInstallPeers: false

peerDependencyRules:
  allowedVersions:
    "openapi-typescript@7.13.0>typescript": "6.0.3"

onlyBuiltDependencies: []

overrides:
  js-yaml: 4.3.1
  # officeparser pins a vulnerable PDF.js release; this audited compatible
  # override is required even though FileBelt's browser importer rejects PDFs.
  pdfjs-dist: 6.2.108
