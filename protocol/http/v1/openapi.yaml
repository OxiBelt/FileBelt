    post:
      operationId: createAdminMcpServiceInvocationGrant
      parameters:
        - $ref: "#/components/parameters/ServiceId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/FetchSite"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdminMcpServiceInvocationGrant"
      responses:
        "201":
          description: Maximum-thirty-day exact service invocation grant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMcpServiceInvocationGrant"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/admin/mcp/service-identities/{service_id}/invocation-grants/{service_grant_id}:
    delete:
      operationId: revokeAdminMcpServiceInvocationGrant
      parameters:
        - $ref: "#/components/parameters/ServiceId"
        - $ref: "#/components/parameters/ServiceGrantId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/FetchSite"
      responses:
