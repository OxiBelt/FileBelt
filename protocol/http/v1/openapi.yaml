          type: string
          minLength: 1
          maxLength: 256
        fingerprint:
          type: string
          pattern: "^[0-9a-f]{64}$"
    McpAttachmentBinding:
      type: object
      additionalProperties: false
      required: [drive_id, node_id, version_id, fields]
      properties:
        drive_id:
          $ref: "#/components/schemas/UuidV4"
        node_id:
          $ref: "#/components/schemas/UuidV4"
        version_id:
          $ref: "#/components/schemas/UuidV4"
        fields:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items:
            $ref: "#/components/schemas/McpAttachmentFieldBinding"
