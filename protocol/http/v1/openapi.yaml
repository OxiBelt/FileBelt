# SPDX-License-Identifier: Apache-2.0

openapi: 3.1.0
info:
  title: FileBelt HTTP API
  version: 1.0.0
  description: Phase 2 control-plane and capability-grant contract.
servers:
  - url: /
security:
  - sessionCookie: []
paths:
  /health/live:
    get:
      operationId: getLiveness
      security: []
      responses:
        "204":
          description: The process is live.
  /health/ready:
    get:
      operationId: getReadiness
      security: []
      responses:
        "204":
          description: The configured tenant and PostgreSQL are ready.
        "503":
          description: PostgreSQL is unavailable.
  /api/v1/auth/login:
    get:
      operationId: beginOidcLogin
      security: []
      parameters:
        - name: return_path
          in: query
          schema:
            type: string
            default: /
            maxLength: 2048
      responses:
        "303":
          description: Redirect to the configured OIDC issuer with PKCE, state, and nonce.
          headers:
            Location:
              schema:
                type: string
                format: uri
            Set-Cookie:
              description: Browser-bound, short-lived OIDC attempt correlation cookie.
              schema:
                type: string
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/auth/callback:
    get:
      operationId: completeOidcLogin
      security: []
      parameters:
        - name: code
          in: query
          schema:
            type: string
            maxLength: 4096
        - name: state
          in: query
          schema:
            type: string
            maxLength: 4096
        - name: error
          in: query
          schema:
            type: string
      responses:
        "303":
          description: Establish an opaque local session and redirect to the allowlisted local path.
          headers:
            Set-Cookie:
              schema:
                type: string
            X-FileBelt-Csrf:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/session:
    get:
      operationId: getCurrentSession
      responses:
        "200":
          description: Current session and response-delivered CSRF token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: revokeCurrentSession
      parameters:
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/FetchSite"
      responses:
        "204":
          description: Current session revoked and cookies expired.
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/sessions:
    get:
      operationId: listSessions
      responses:
        "200":
          description: Sessions for the authenticated user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionSummary"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/sessions/revoke-all:
    post:
      operationId: revokeAllSessions
      parameters:
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/FetchSite"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                keep_current:
                  type: boolean
                  default: false
      responses:
        "204":
          description: Sessions revoked. Recent OIDC authentication is required.
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/sessions/{session_id}:
    delete:
      operationId: revokeSession
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/FetchSite"
      responses:
        "204":
          description: Owned session revoked.
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/drives:
    get:
      operationId: listDrives
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: ACL-filtered drives visible to the authenticated principal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DrivePage"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/shared:
    get:
      operationId: listSharedNodes
      description: Lists directly shared node candidates that independently pass current READ_METADATA authorization. This view grants no ancestor navigation rights.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Paginated nodes shared with the authenticated principal and authorized under their current ACLs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodePage"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/drives/{drive_id}:
    get:
      operationId: getDrive
      parameters:
        - $ref: "#/components/parameters/DriveId"
      responses:
        "200":
          description: Drive metadata authorized with READ_METADATA.
          headers:
            ETag:
              $ref: "#/components/headers/GenerationEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Drive"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/drives/{drive_id}/nodes/{node_id}:
    get:
      operationId: getNode
      parameters:
        - $ref: "#/components/parameters/DriveId"
        - $ref: "#/components/parameters/NodeId"
      responses:
        "200":
          description: Node metadata authorized with READ_METADATA.
          headers:
            ETag:
              $ref: "#/components/headers/GenerationEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/drives/{drive_id}/nodes/{node_id}/children:
    get:
      operationId: listChildren
      parameters:
        - $ref: "#/components/parameters/DriveId"
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: ACL-filtered direct children authorized with LIST_CHILDREN and READ_METADATA.
          headers:
            ETag:
              $ref: "#/components/headers/GenerationEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodePage"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/drives/{drive_id}/nodes/{parent_id}/directories:
    post:
      operationId: createDirectory
      parameters:
        - $ref: "#/components/parameters/DriveId"
        - $ref: "#/components/parameters/ParentId"
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/FetchSite"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDirectory"
      responses:
        "201":
          description: Directory created with CREATE_CHILD.
          headers:
            ETag:
              $ref: "#/components/headers/GenerationEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/drives/{drive_id}/uploads:
    post:
      operationId: beginUpload
      parameters:
        - $ref: "#/components/parameters/DriveId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/FetchSite"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BeginUpload"
      responses:
        "201":
          description: Quota-reserved upload allocation. Byte grants are fetched separately.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadAllocation"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/uploads/{upload_id}:
    get:
      operationId: getUploadGrants
      parameters:
        - $ref: "#/components/parameters/UploadId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Fresh short-lived part and finalize capabilities for the owned open upload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadGrants"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/uploads/{upload_id}/commit:
    post:
      operationId: commitUpload
      parameters:
        - $ref: "#/components/parameters/UploadId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/FetchSite"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_fencing_token]
              properties:
                expected_fencing_token:
                  type: integer
                  format: int64
                  minimum: 1
      responses:
        "201":
          description: Immutable version committed and made the node head.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [node_id, version_id]
                properties:
                  node_id:
                    $ref: "#/components/schemas/UuidV4"
                  version_id:
                    $ref: "#/components/schemas/UuidV4"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/drives/{drive_id}/nodes/{node_id}/download-grants:
    post:
      operationId: createDownloadGrant
      parameters:
        - $ref: "#/components/parameters/DriveId"
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/FetchSite"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                version_id:
                  oneOf:
                    - $ref: "#/components/schemas/UuidV4"
                    - type: "null"
      responses:
        "201":
          description: Short-lived READ_CONTENT capability and path-scoped HttpOnly cookie.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadGrant"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/drives/{drive_id}/nodes/{node_id}/versions:
    get:
      operationId: listFileVersions
      parameters:
        - $ref: "#/components/parameters/DriveId"
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Immutable version history authorized against the current node ACL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionPage"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/drives/{drive_id}/nodes/{node_id}/versions/{version_id}/restore:
    post:
      operationId: restoreFileVersion
      description: Creates a new immutable head from the selected historical version; it never moves the head backward.
      parameters:
        - $ref: "#/components/parameters/DriveId"
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/VersionId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/FetchSite"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestoreVersion"
      responses:
        "201":
          description: Historical payload restored as a new head after CREATE_VERSION and WRITE_CONTENT authorization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileVersion"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/drives/{drive_id}/nodes/{node_id}/shares:
    get:
      operationId: listDirectShares
      parameters:
        - $ref: "#/components/parameters/DriveId"
        - $ref: "#/components/parameters/NodeId"
      responses:
        "200":
          description: Direct verified-email shares visible to a principal authorized with SHARE.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DirectShare"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createDirectShare
      description: The actor must hold SHARE and every action in the selected preset at one generation snapshot. Group and anonymous-link kinds are explicitly unsupported by this Phase 2 acceptance surface.
      parameters:
        - $ref: "#/components/parameters/DriveId"
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/FetchSite"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShare"
      responses:
        "201":
          description: Direct share bound to an already-linked principal resolved by current verified email.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectShare"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/drives/{drive_id}/nodes/{node_id}/shares/{principal_id}:
    delete:
      operationId: revokeDirectShare
      parameters:
        - $ref: "#/components/parameters/DriveId"
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/PrincipalId"
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/FetchSite"
      responses:
        "204":
          description: All entries in the target principal's direct share preset are revoked transactionally.
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/drives/{drive_id}/nodes/{node_id}/trash:
    post:
      operationId: trashNode
      parameters:
        - $ref: "#/components/parameters/DriveId"
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/FetchSite"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NamespaceMutation"
      responses:
        "200":
          description: Node moved to trash after DELETE authorization; original parent and name remain restorable.
          headers:
            ETag:
              $ref: "#/components/headers/GenerationEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/drives/{drive_id}/nodes/{node_id}/restore:
    post:
      operationId: restoreNode
      parameters:
        - $ref: "#/components/parameters/DriveId"
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/FetchSite"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NamespaceMutation"
      responses:
        "200":
          description: Trashed node restored after RESTORE authorization; live-name conflicts fail.
          headers:
            ETag:
              $ref: "#/components/headers/GenerationEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/drives/{drive_id}/trash:
    get:
      operationId: listTrash
      parameters:
        - $ref: "#/components/parameters/DriveId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Paginated trashed nodes, individually filtered with current READ_METADATA authorization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodePage"
        default:
          $ref: "#/components/responses/Problem"
  /io/v1/uploads/{upload_id}/parts/{part}:
    put:
      operationId: putUploadPart
      security:
        - capabilityHeader: []
        - capabilityCookie: []
      parameters:
        - $ref: "#/components/parameters/UploadId"
        - name: part
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
        - name: Content-Length
          in: header
          required: false
          description: When present, must equal the authoritative exact part size.
          schema:
            type: integer
            format: int64
            minimum: 0
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Part bytes and their BLAKE3 digest are durable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadPartReceipt"
        "401":
          $ref: "#/components/responses/CapabilityProblem"
        default:
          $ref: "#/components/responses/Problem"
  /io/v1/uploads/{upload_id}/finalize:
    post:
      operationId: finalizeUpload
      security:
        - capabilityHeader: []
        - capabilityCookie: []
      parameters:
        - $ref: "#/components/parameters/UploadId"
      responses:
        "200":
          description: Complete manifest finalized and durably recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinalizeReceipt"
        "401":
          $ref: "#/components/responses/CapabilityProblem"
        default:
          $ref: "#/components/responses/Problem"
  /io/v1/downloads/{grant_id}:
    get:
      operationId: downloadPayload
      security:
        - capabilityHeader: []
        - capabilityCookie: []
      parameters:
        - $ref: "#/components/parameters/GrantId"
        - $ref: "#/components/parameters/Range"
      responses:
        "200":
          $ref: "#/components/responses/FullDownload"
        "206":
          $ref: "#/components/responses/PartialDownload"
        "401":
          $ref: "#/components/responses/CapabilityProblem"
        "416":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    head:
      operationId: headPayload
      security:
        - capabilityHeader: []
        - capabilityCookie: []
      parameters:
        - $ref: "#/components/parameters/GrantId"
        - $ref: "#/components/parameters/Range"
      responses:
        "200":
          $ref: "#/components/responses/FullDownloadHeaders"
        "206":
          $ref: "#/components/responses/PartialDownloadHeaders"
        "401":
          $ref: "#/components/responses/CapabilityProblem"
        "416":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: filebelt_session
    capabilityHeader:
      type: http
      scheme: fbcap1
      description: "Send `Authorization: fbcap1 <base64url-envelope>`."
    capabilityCookie:
      type: apiKey
      in: cookie
      name: filebelt_capability
  parameters:
    DriveId:
      name: drive_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UuidV4"
    NodeId:
      name: node_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UuidV4"
    ParentId:
      name: parent_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UuidV4"
    UploadId:
      name: upload_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UuidV4"
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UuidV4"
    VersionId:
      name: version_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UuidV4"
    PrincipalId:
      name: principal_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UuidV4"
    GrantId:
      name: grant_id
      in: path
      required: true
      description: Must equal the signed `grant_id` capability claim.
      schema:
        $ref: "#/components/schemas/UuidV4"
    Range:
      name: Range
      in: header
      required: false
      description: One bytes range only; it must be contained by the signed inclusive range.
      schema:
        type: string
        pattern: "^bytes=([0-9]+-[0-9]*|-[0-9]+)$"
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    Csrf:
      name: X-FileBelt-Csrf
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 256
    Origin:
      name: Origin
      in: header
      required: true
      schema:
        type: string
        format: uri
    FetchSite:
      name: Sec-Fetch-Site
      in: header
      required: true
      schema:
        type: string
        const: same-origin
  headers:
    GenerationEtag:
      description: Opaque generation validator for this representation.
      schema:
        type: string
  responses:
    Problem:
      description: Stable FileBelt problem response.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    CapabilityProblem:
      description: Capability is missing, malformed, expired, or invalid.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            const: fbcap1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    FullDownload:
      description: Complete signed range, which may be the complete payload.
      headers:
        Accept-Ranges:
          schema:
            type: string
            const: bytes
        Content-Length:
          schema:
            type: integer
            format: int64
            minimum: 0
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
    PartialDownload:
      description: A single requested range contained by the signed range.
      headers:
        Accept-Ranges:
          schema:
            type: string
            const: bytes
        Content-Range:
          schema:
            type: string
        Content-Length:
          schema:
            type: integer
            format: int64
            minimum: 0
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
    FullDownloadHeaders:
      description: Complete signed-range headers without a body.
      headers:
        Accept-Ranges:
          schema:
            type: string
            const: bytes
        Content-Length:
          schema:
            type: integer
            format: int64
            minimum: 0
    PartialDownloadHeaders:
      description: Single-range headers without a body.
      headers:
        Accept-Ranges:
          schema:
            type: string
            const: bytes
        Content-Range:
          schema:
            type: string
        Content-Length:
          schema:
            type: integer
            format: int64
            minimum: 0
  schemas:
    UuidV4:
      type: string
      format: uuid
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
    Session:
      type: object
      additionalProperties: false
      required:
        - session_id
        - user_id
        - principal_id
        - display_name
        - verified_email
        - tenant_admin
        - reauthenticated_recently
        - csrf_token
      properties:
        session_id:
          $ref: "#/components/schemas/UuidV4"
        user_id:
          $ref: "#/components/schemas/UuidV4"
        principal_id:
          $ref: "#/components/schemas/UuidV4"
        display_name:
          type: string
        verified_email:
          oneOf:
            - type: string
              format: email
            - type: "null"
