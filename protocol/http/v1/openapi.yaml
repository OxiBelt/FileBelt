          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminMcpBlockRule"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createAdminMcpBlockRule
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/FetchSite"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdminMcpBlockRule"
      responses:
        "201":
          description: Global block applied to new and active invocations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMcpBlockRule"
