          items:
            $ref: "#/components/schemas/McpCapability"
        created_at:
          type: string
          format: date-time
    McpCapability:
      type: object
      additionalProperties: false
      required: [kind, name, title, description, fingerprint, read_only_hint, risk, state, input_schema]
      properties:
        kind:
          type: string
          enum: [resource, prompt, tool]
        name:
          type: string
          minLength: 1
          maxLength: 256
        title:
          oneOf:
            - type: string
              maxLength: 256
            - type: "null"
        description:
          oneOf:
            - type: string
              maxLength: 4096
            - type: "null"
        fingerprint:
          type: string
          pattern: "^[0-9a-f]{64}$"
        read_only_hint:
          oneOf:
            - type: boolean
            - type: "null"
        risk:
          type: string
          enum: [low, elevated, prohibited]
        state:
          type: string
          enum: [new, unchanged, changed, removed]
        input_schema:
          description: Untrusted, bounded JSON Schema displayed as text/tree only.
        output_schema:
          description: Optional untrusted, bounded JSON Schema displayed as text/tree only.
