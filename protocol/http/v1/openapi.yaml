          oneOf:
            - $ref: "#/components/schemas/McpSafeMedia"
            - type: "null"
        problem_code:
          oneOf:
            - type: string
              pattern: "^mcp\\.[a-z0-9_.-]+$"
            - type: "null"
    McpSemanticInput:
      type: object
      additionalProperties: false
