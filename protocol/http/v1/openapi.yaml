      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdminMcpTemplate"
      responses:
        "201":
          description: Disabled managed template.
          headers:
            ETag:
              $ref: "#/components/headers/GenerationEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMcpTemplate"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/admin/mcp/templates/{template_id}:
    get:
      operationId: getAdminMcpTemplate
      parameters:
        - $ref: "#/components/parameters/TemplateId"
      responses:
        "200":
          description: Managed template and redacted assignment counts.
          headers:
            ETag:
              $ref: "#/components/headers/GenerationEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMcpTemplate"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateAdminMcpTemplate
      parameters:
        - $ref: "#/components/parameters/TemplateId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/FetchSite"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdminMcpTemplate"
      responses:
        "200":
          description: Updated template; authority-affecting changes disable its activations.
          headers:
            ETag:
              $ref: "#/components/headers/GenerationEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMcpTemplate"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteAdminMcpTemplate
      parameters:
