# SPDX-License-Identifier: Apache-2.0

openapi: 3.1.0
info:
  title: FileBelt HTTP API
  version: 1.0.0
  description: Durable FileBelt control-plane, storage-grant, collaboration, and outbound MCP broker contract.
servers:
  - url: /
security:
  - sessionCookie: []
paths:
  /health/live:
    get:
      operationId: getLiveness
      security: []
      responses:
        "204":
          description: The process is live.
  /health/ready:
    get:
      operationId: getReadiness
      security: []
      responses:
        "204":
          description: The configured tenant and PostgreSQL are ready.
        "503":
          description: PostgreSQL is unavailable.
  /api/v1/auth/login:
    get:
      operationId: beginOidcLogin
      security: []
      parameters:
        - name: return_path
          in: query
          schema:
            type: string
            default: /
            maxLength: 2048
      responses:
        "303":
          description: Redirect to the configured OIDC issuer with PKCE, state, and nonce.
          headers:
            Location:
              schema:
                type: string
                format: uri
            Set-Cookie:
              description: Browser-bound, short-lived OIDC attempt correlation cookie.
              schema:
                type: string
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/auth/callback:
    get:
      operationId: completeOidcLogin
      security: []
      parameters:
        - name: code
          in: query
          schema:
            type: string
            maxLength: 4096
        - name: state
          in: query
          schema:
            type: string
            maxLength: 4096
        - name: error
          in: query
          schema:
            type: string
      responses:
        "303":
          description: Establish an opaque local session and redirect to the allowlisted local path.
          headers:
            Set-Cookie:
              schema:
                type: string
            X-FileBelt-Csrf:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/session:
    get:
      operationId: getCurrentSession
      responses:
        "200":
          description: Current session and response-delivered CSRF token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: revokeCurrentSession
      parameters:
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/FetchSite"
      responses:
        "204":
          description: Current session revoked and cookies expired.
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/sessions:
    get:
      operationId: listSessions
      responses:
        "200":
          description: Sessions for the authenticated user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionSummary"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/sessions/revoke-all:
    post:
      operationId: revokeAllSessions
      parameters:
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/FetchSite"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                keep_current:
                  type: boolean
                  default: false
      responses:
        "204":
          description: Sessions revoked. Recent OIDC authentication is required.
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/sessions/{session_id}:
    delete:
      operationId: revokeSession
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/FetchSite"
      responses:
        "204":
          description: Owned session revoked.
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/document-sessions:
    get:
      operationId: listOwnDocumentSessions
      description: Lists only document sessions owned by the authenticated principal. The list is provider-neutral and exposes no provider or browser connection information.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: The authenticated principal's document sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentSessionPage"
        default:
          $ref: "#/components/responses/DocumentSessionProblem"
  /api/v1/document-sessions/{document_session_id}:
    get:
      operationId: getOwnDocumentSession
      description: Returns a provider-neutral summary and participants for one session owned by the authenticated principal.
      parameters:
        - $ref: "#/components/parameters/DocumentSessionId"
      responses:
        "200":
          description: Current session summary and participant projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentSessionDetail"
        default:
          $ref: "#/components/responses/DocumentSessionProblem"
    delete:
      operationId: revokeOwnDocumentSession
      description: Revokes one session owned by the authenticated principal. It does not delete a file version.
      parameters:
        - $ref: "#/components/parameters/DocumentSessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/FetchSite"
      responses:
        "204":
          description: The owned session is revoked.
        default:
          $ref: "#/components/responses/DocumentSessionProblem"
  /api/v1/document-sessions/{document_session_id}/conflict-copy:
    post:
      operationId: createDocumentSessionConflictCopy
      description: Creates a separately named sibling from an active session's conflicted content. It requires ownership of the session, a conflict state, and CREATE_CHILD on the target parent; it never replaces the current head.
      parameters:
        - $ref: "#/components/parameters/DocumentSessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/FetchSite"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDocumentSessionConflictCopy"
      responses:
        "201":
          description: A new conflict-copy node and immutable version; the source head is unchanged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentSessionConflictCopy"
        default:
          $ref: "#/components/responses/DocumentSessionProblem"
  /api/v1/document-sessions/{document_session_id}/handoff:
    post:
      operationId: redeemDocumentSessionLaunch
      description: Issues an authenticated owner's fresh, one-use document-session launch handoff. The response is provider-neutral and must remain in memory; clients must not persist it, place it in a URL, or substitute a session identifier for the one-use grant. This deliberately does not support idempotent replay because a grant is secret material.
      parameters:
        - $ref: "#/components/parameters/DocumentSessionId"
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/FetchSite"
      responses:
        "201":
          description: One-use provider-neutral launch handoff. The opaque grant is not a FileBelt session credential.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentSessionLaunchHandoff"
        default:
          $ref: "#/components/responses/DocumentSessionProblem"
  /api/v1/mounts:
    get:
      operationId: getMountOverview
      description: Returns the authenticated principal's mount policies, redacted credentials, Headscale devices, recent sessions, and currently accessible drives.
      responses:
        "200":
          description: Current mount configuration and activity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MountOverview"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/mounts/policies/{protocol}:
    put:
      operationId: putMountPolicy
      description: Replaces one read-only protocol policy and revokes credentials and sessions issued under its previous generation. Write-enabled policies are reserved for a future release and are rejected.
      parameters:
        - $ref: "#/components/parameters/MountProtocol"
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/FetchSite"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutMountPolicy"
      responses:
        "200":
          description: Replaced policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MountPolicy"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/mounts/credentials:
    post:
      operationId: createMountCredential
      description: Creates a scoped, read-only mount credential with at most a seven-day lifetime after recent OIDC authentication. The plaintext password is returned exactly once. Write-enabled credentials are reserved for a future release and are rejected.
      parameters:
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/FetchSite"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMountCredential"
      responses:
        "201":
          description: One-time credential material. The password is never returned by subsequent reads.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedMountCredential"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/mounts/credentials/{credential_id}:
    delete:
      operationId: revokeMountCredential
      description: Revokes an owned mount credential and all sessions fenced by it after recent OIDC authentication.
      parameters:
        - $ref: "#/components/parameters/MountCredentialId"
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/FetchSite"
      responses:
        "204":
          description: Credential and its active sessions revoked.
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/drives:
    get:
      operationId: listDrives
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: ACL-filtered drives visible to the authenticated principal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DrivePage"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/shared:
    get:
      operationId: listSharedNodes
      description: Lists directly shared node candidates that independently pass current READ_METADATA authorization. This view grants no ancestor navigation rights.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Paginated nodes shared with the authenticated principal and authorized under their current ACLs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodePage"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/drives/{drive_id}:
    get:
      operationId: getDrive
      parameters:
        - $ref: "#/components/parameters/DriveId"
      responses:
        "200":
          description: Drive metadata authorized with READ_METADATA.
          headers:
            ETag:
              $ref: "#/components/headers/GenerationEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Drive"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/drives/{drive_id}/nodes/{node_id}:
    get:
      operationId: getNode
      parameters:
        - $ref: "#/components/parameters/DriveId"
        - $ref: "#/components/parameters/NodeId"
      responses:
        "200":
          description: Node metadata authorized with READ_METADATA.
          headers:
            ETag:
              $ref: "#/components/headers/GenerationEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/drives/{drive_id}/nodes/{node_id}/document-sessions:
    get:
      operationId: listDocumentSessionsForNode
      description: Lists sessions for this file only after fixed drive-owner authority or MANAGE_ACL authorization. This route exposes provider-neutral session and participant projections only.
      parameters:
        - $ref: "#/components/parameters/DriveId"
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: File-wide document-session activity available to the owner or MANAGE_ACL principal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentSessionPage"
        default:
          $ref: "#/components/responses/DocumentSessionProblem"
    post:
      operationId: createDocumentSession
      description: Creates a provider-neutral session for one exact immutable base version. All modes require READ_CONTENT and USE_EXTERNAL_EDITOR. COMMENT, REVIEW, and EDIT additionally require WRITE_CONTENT and CREATE_VERSION; COMMENT and REVIEW also require their matching stable Virtual ACL action.
      parameters:
        - $ref: "#/components/parameters/DriveId"
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/FetchSite"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDocumentSession"
      responses:
        "201":
          description: Session created against the exact base version. Provider admission remains a separate replaceable process boundary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentSessionDetail"
        default:
          $ref: "#/components/responses/DocumentSessionProblem"
  /api/v1/drives/{drive_id}/nodes/{node_id}/document-sessions/{document_session_id}:
    delete:
      operationId: forceCloseDocumentSession
      description: Force-closes one session for this file after fixed drive-owner authority or MANAGE_ACL authorization. It does not delete a file version or grant content authority to the actor.
      parameters:
        - $ref: "#/components/parameters/DriveId"
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/DocumentSessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/FetchSite"
      responses:
        "204":
          description: The targeted file session is force-closed.
        default:
          $ref: "#/components/responses/DocumentSessionProblem"
  /api/v1/drives/{drive_id}/nodes/{node_id}/collaboration:
    get:
      operationId: getCollaborationSummary
      description: Returns active Markdown collaboration state only to a principal currently authorized with READ_CONTENT and WRITE_CONTENT; collaboration has no spectator mode.
      parameters:
        - $ref: "#/components/parameters/DriveId"
        - $ref: "#/components/parameters/NodeId"
      responses:
        "200":
          description: "Current durable room summary. A missing active room is represented by `active: false`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollaborationSummary"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: discardCollaboration
      description: Discards the caller-authorized dirty collaboration state. It requires DELETE and WRITE_CONTENT and never changes an immutable file version.
      parameters:
        - $ref: "#/components/parameters/DriveId"
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/FetchSite"
      responses:
        "204":
          description: Dirty room state is fenced and scheduled for discard.
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/drives/{drive_id}/nodes/{node_id}/collaboration-grants:
    post:
      operationId: createCollaborationGrant
      description: Issues one opaque, one-use, first-Protobuf-frame grant valid for at most 60 seconds. Neither the grant nor a session credential appears in an endpoint URL.
      parameters:
        - $ref: "#/components/parameters/DriveId"
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/FetchSite"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCollaborationGrant"
      responses:
        "201":
          description: A no-store authorization grant and transport endpoints for one editing participant.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollaborationGrant"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/drives/{drive_id}/nodes/{node_id}/media-previews:
    post:
      operationId: createMediaPreview
      description: Admits a rebuildable, immutable-source media preview only after explicit user confirmation and READ_CONTENT plus TRANSCODE authorization. Adapter options and host paths are never accepted.
      parameters:
        - $ref: "#/components/parameters/DriveId"
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/FetchSite"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMediaPreview"
      responses:
        "202":
          description: The fenced preview request is durable and queued for an isolated controller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaPreview"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/drives/{drive_id}/nodes/{node_id}/media-previews/{preview_id}:
    get:
      operationId: getMediaPreview
      parameters:
        - $ref: "#/components/parameters/DriveId"
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/PreviewId"
      responses:
        "200":
          description: Current PostgreSQL-authoritative preview state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaPreview"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: cancelMediaPreview
      parameters:
        - $ref: "#/components/parameters/DriveId"
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/PreviewId"
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/FetchSite"
      responses:
        "200":
          description: Cancellation is durable; a running worker remains fenced from publication.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaPreview"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/admin/mounts/nfs:
    get:
      operationId: getNfsAdminOverview
      description: Returns the PostgreSQL-authoritative desired and gateway-applied NFS state for a recently reauthenticated tenant administrator.
      responses:
        "200":
          description: Current NFS feature, export, POSIX group, and exact principal projections.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NfsAdminOverview"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/admin/mounts/nfs/feature:
    put:
      operationId: transitionNfsFeature
      description: Advances the NFS feature through one generation-fenced staged transition. Unsafe state jumps fail closed.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/FetchSite"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NfsFeatureTransition"
      responses:
        "200":
          description: Feature state advanced by its expected generation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NfsFeature"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/admin/mounts/nfs/exports:
    post:
      operationId: registerNfsExport
      description: Registers one drive export in the disabled desired state. Registration does not expose the drive to NFS.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/FetchSite"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NfsExportRegistration"
      responses:
        "201":
          description: New disabled export registration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NfsExport"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/admin/mounts/nfs/exports/{drive_id}:
    put:
      operationId: transitionNfsExport
      description: Stages one generation-fenced desired export transition. Disabling requires an applied draining generation.
      parameters:
        - $ref: "#/components/parameters/DriveId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/FetchSite"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NfsExportTransition"
      responses:
        "200":
          description: Export desired state advanced by its expected generation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NfsExport"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/admin/mounts/nfs/posix-groups:
    post:
      operationId: registerNfsPosixGroup
      description: Registers one existing FileBelt group as a tenant-unique POSIX group projection.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/FetchSite"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NfsPosixGroupRegistration"
      responses:
        "201":
          description: New POSIX group projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NfsPosixGroup"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/admin/mounts/nfs/mappings:
    get:
      operationId: listNfsPrincipalMappings
      description: Lists exact RPCSEC_GSS principal projections for a recently reauthenticated tenant administrator.
      responses:
        "200":
          description: Active NFS principal projections.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NfsPrincipalMapping"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: upsertNfsPrincipalMapping
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/FetchSite"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertNfsPrincipalMapping"
      responses:
        "200":
          description: Existing mapping advanced by its expected generation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NfsPrincipalMapping"
        "201":
          description: New exact Kerberos principal mapping.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NfsPrincipalMapping"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/admin/mounts/nfs/mappings/{credential_id}:
    delete:
      operationId: revokeNfsPrincipalMapping
      parameters:
        - name: credential_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UuidV4"
        - name: expected_generation
          in: query
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/FetchSite"
      responses:
        "204":
          description: Mapping and active NFS sessions were revoked and generation-fenced.
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/drives/{drive_id}/nodes/{node_id}/markdown-import-intents:
    post:
      operationId: createMarkdownImportIntent
      description: Records the exact authorized source version and one new sibling target for a Markdown import. The returned intent can bind one later BeginUpload request only.
      parameters:
        - $ref: "#/components/parameters/DriveId"
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/IdempotencyKey"
