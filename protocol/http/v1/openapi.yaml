      type: object
      additionalProperties: false
      required: [source, target_json_pointer, encoding]
      properties:
        source:
          type: string
          enum: [content, basename, mime_type, size_bytes]
        target_json_pointer:
          type: string
          maxLength: 1024
          pattern: "^(?:/(?:[^~/]|~[01])*)*$"
        encoding:
          type: string
          enum: [native, utf8, base64]
    McpInvocationIntent:
      type: object
      additionalProperties: false
      required: [id, request_digest, expires_at, approval_required]
      properties:
        id:
          $ref: "#/components/schemas/UuidV4"
        request_digest:
          type: string
          pattern: "^[0-9a-f]{64}$"
        expires_at:
          type: string
          format: date-time
        approval_required:
          type: boolean
    McpInvocationEvent:
      type: object
      additionalProperties: false
      required: [event, invocation_id, sequence, created_at]
      properties:
        event:
          type: string
          enum: [started, progress, text, json, semantic, media, error, completed]
        invocation_id:
          $ref: "#/components/schemas/UuidV4"
        sequence:
          type: integer
          format: int64
          minimum: 0
        created_at:
          type: string
          format: date-time
        progress:
          oneOf:
            - type: number
              minimum: 0
              maximum: 1
            - type: "null"
        text:
          oneOf:
            - type: string
              maxLength: 1048576
            - type: "null"
        json:
          description: Bounded JSON rendered as a non-editable tree, never as HTML.
        semantic_output:
          oneOf:
            - $ref: "#/components/schemas/McpSemanticOutput"
            - type: "null"
          description: Route-specific semantic Markdown output with a UTF-8 byte cap of 2 MiB. It is rendered as data, not HTML.
