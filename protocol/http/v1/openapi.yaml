# SPDX-License-Identifier: Apache-2.0

openapi: 3.1.0
info:
  title: FileBelt HTTP API
  version: 1.0.0
  description: Durable FileBelt control-plane, storage-grant, collaboration, and outbound MCP broker contract.
servers:
  - url: /
security:
  - sessionCookie: []
paths:
  /health/live:
    get:
      operationId: getLiveness
      security: []
      responses:
        "204":
          description: The process is live.
  /health/ready:
    get:
      operationId: getReadiness
      security: []
      responses:
        "204":
          description: The configured tenant and PostgreSQL are ready.
        "503":
          description: PostgreSQL is unavailable.
  /api/v1/auth/login:
    get:
      operationId: beginOidcLogin
      security: []
      parameters:
        - name: return_path
          in: query
          schema:
            type: string
            default: /
            maxLength: 2048
      responses:
        "303":
          description: Redirect to the configured OIDC issuer with PKCE, state, and nonce.
          headers:
            Location:
              schema:
                type: string
                format: uri
            Set-Cookie:
              description: Browser-bound, short-lived OIDC attempt correlation cookie.
              schema:
                type: string
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/auth/callback:
    get:
      operationId: completeOidcLogin
      security: []
      parameters:
        - name: code
          in: query
          schema:
            type: string
            maxLength: 4096
        - name: state
          in: query
          schema:
            type: string
            maxLength: 4096
        - name: error
          in: query
          schema:
            type: string
      responses:
        "303":
          description: Establish an opaque local session and redirect to the allowlisted local path.
          headers:
            Set-Cookie:
              schema:
                type: string
            X-FileBelt-Csrf:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/session:
    get:
      operationId: getCurrentSession
      responses:
        "200":
          description: Current session and response-delivered CSRF token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: revokeCurrentSession
      parameters:
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/FetchSite"
      responses:
        "204":
          description: Current session revoked and cookies expired.
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/sessions:
    get:
      operationId: listSessions
      responses:
        "200":
          description: Sessions for the authenticated user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionSummary"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/sessions/revoke-all:
    post:
      operationId: revokeAllSessions
      parameters:
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/FetchSite"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                keep_current:
                  type: boolean
                  default: false
      responses:
        "204":
          description: Sessions revoked. Recent OIDC authentication is required.
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/sessions/{session_id}:
    delete:
      operationId: revokeSession
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/FetchSite"
      responses:
        "204":
          description: Owned session revoked.
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/drives:
    get:
      operationId: listDrives
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: ACL-filtered drives visible to the authenticated principal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DrivePage"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/shared:
    get:
      operationId: listSharedNodes
      description: Lists directly shared node candidates that independently pass current READ_METADATA authorization. This view grants no ancestor navigation rights.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Paginated nodes shared with the authenticated principal and authorized under their current ACLs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodePage"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/drives/{drive_id}:
    get:
      operationId: getDrive
      parameters:
        - $ref: "#/components/parameters/DriveId"
      responses:
        "200":
          description: Drive metadata authorized with READ_METADATA.
          headers:
            ETag:
              $ref: "#/components/headers/GenerationEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Drive"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/drives/{drive_id}/nodes/{node_id}:
    get:
      operationId: getNode
      parameters:
        - $ref: "#/components/parameters/DriveId"
        - $ref: "#/components/parameters/NodeId"
      responses:
        "200":
          description: Node metadata authorized with READ_METADATA.
          headers:
            ETag:
              $ref: "#/components/headers/GenerationEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/drives/{drive_id}/nodes/{node_id}/collaboration:
    get:
      operationId: getCollaborationSummary
      description: Returns active Markdown collaboration state only to a principal currently authorized with READ_CONTENT and WRITE_CONTENT; collaboration has no spectator mode.
      parameters:
        - $ref: "#/components/parameters/DriveId"
        - $ref: "#/components/parameters/NodeId"
      responses:
        "200":
          description: "Current durable room summary. A missing active room is represented by `active: false`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollaborationSummary"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: discardCollaboration
      description: Discards the caller-authorized dirty collaboration state. It requires DELETE and WRITE_CONTENT and never changes an immutable file version.
      parameters:
        - $ref: "#/components/parameters/DriveId"
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/FetchSite"
      responses:
        "204":
          description: Dirty room state is fenced and scheduled for discard.
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/drives/{drive_id}/nodes/{node_id}/collaboration-grants:
    post:
      operationId: createCollaborationGrant
      description: Issues one opaque, one-use, first-Protobuf-frame grant valid for at most 60 seconds. Neither the grant nor a session credential appears in an endpoint URL.
      parameters:
        - $ref: "#/components/parameters/DriveId"
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/FetchSite"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCollaborationGrant"
      responses:
        "201":
          description: A no-store authorization grant and transport endpoints for one editing participant.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollaborationGrant"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/drives/{drive_id}/nodes/{node_id}/markdown-import-intents:
    post:
      operationId: createMarkdownImportIntent
      description: Records the exact authorized source version and one new sibling target for a Markdown import. The returned intent can bind one later BeginUpload request only.
      parameters:
        - $ref: "#/components/parameters/DriveId"
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/FetchSite"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMarkdownImportIntent"
      responses:
        "201":
          description: Exact, short-lived import intent. Authorization is revalidated when it is consumed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarkdownImportIntent"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/drives/{drive_id}/nodes/{node_id}/children:
    get:
      operationId: listChildren
      parameters:
        - $ref: "#/components/parameters/DriveId"
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: ACL-filtered direct children authorized with LIST_CHILDREN and READ_METADATA.
          headers:
            ETag:
              $ref: "#/components/headers/GenerationEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodePage"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/drives/{drive_id}/nodes/{parent_id}/directories:
    post:
      operationId: createDirectory
      parameters:
        - $ref: "#/components/parameters/DriveId"
        - $ref: "#/components/parameters/ParentId"
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/FetchSite"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDirectory"
      responses:
        "201":
          description: Directory created with CREATE_CHILD.
          headers:
            ETag:
              $ref: "#/components/headers/GenerationEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/drives/{drive_id}/uploads:
    post:
      operationId: beginUpload
      parameters:
        - $ref: "#/components/parameters/DriveId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/FetchSite"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BeginUpload"
      responses:
        "201":
          description: Quota-reserved upload allocation. Byte grants are fetched separately.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadAllocation"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/uploads/{upload_id}:
    get:
      operationId: getUploadGrants
      parameters:
        - $ref: "#/components/parameters/UploadId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Fresh short-lived part and finalize capabilities for the owned open upload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadGrants"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/uploads/{upload_id}/commit:
    post:
      operationId: commitUpload
      parameters:
        - $ref: "#/components/parameters/UploadId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/FetchSite"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_fencing_token]
              properties:
                expected_fencing_token:
                  type: integer
                  format: int64
                  minimum: 1
      responses:
        "201":
          description: Immutable version committed and made the node head.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [node_id, version_id]
                properties:
                  node_id:
                    $ref: "#/components/schemas/UuidV4"
                  version_id:
                    $ref: "#/components/schemas/UuidV4"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/drives/{drive_id}/nodes/{node_id}/download-grants:
    post:
      operationId: createDownloadGrant
      parameters:
        - $ref: "#/components/parameters/DriveId"
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/FetchSite"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                version_id:
                  oneOf:
                    - $ref: "#/components/schemas/UuidV4"
                    - type: "null"
      responses:
        "201":
          description: Short-lived READ_CONTENT capability and path-scoped HttpOnly cookie.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadGrant"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/drives/{drive_id}/nodes/{node_id}/versions:
    get:
      operationId: listFileVersions
      parameters:
        - $ref: "#/components/parameters/DriveId"
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Immutable version history authorized against the current node ACL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionPage"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/drives/{drive_id}/nodes/{node_id}/versions/{version_id}/restore:
    post:
      operationId: restoreFileVersion
      description: Creates a new immutable head from the selected historical version; it never moves the head backward.
      parameters:
        - $ref: "#/components/parameters/DriveId"
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/VersionId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/FetchSite"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestoreVersion"
      responses:
        "201":
          description: Historical payload restored as a new head after CREATE_VERSION and WRITE_CONTENT authorization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileVersion"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/drives/{drive_id}/nodes/{node_id}/shares:
    get:
      operationId: listDirectShares
      parameters:
        - $ref: "#/components/parameters/DriveId"
        - $ref: "#/components/parameters/NodeId"
      responses:
        "200":
          description: Direct verified-email shares visible to a principal authorized with SHARE.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DirectShare"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createDirectShare
      description: The actor must hold SHARE and every action in the selected preset at one generation snapshot. Group and anonymous-link kinds are explicitly unsupported by this Phase 2 acceptance surface.
      parameters:
        - $ref: "#/components/parameters/DriveId"
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/FetchSite"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShare"
      responses:
        "201":
          description: Direct share bound to an already-linked principal resolved by current verified email.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectShare"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/drives/{drive_id}/nodes/{node_id}/shares/{principal_id}:
    delete:
      operationId: revokeDirectShare
      parameters:
        - $ref: "#/components/parameters/DriveId"
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/PrincipalId"
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/FetchSite"
      responses:
        "204":
          description: All entries in the target principal's direct share preset are revoked transactionally.
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/drives/{drive_id}/nodes/{node_id}/trash:
    post:
      operationId: trashNode
      parameters:
        - $ref: "#/components/parameters/DriveId"
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/FetchSite"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NamespaceMutation"
      responses:
        "200":
          description: Node moved to trash after DELETE authorization; original parent and name remain restorable.
          headers:
            ETag:
              $ref: "#/components/headers/GenerationEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/drives/{drive_id}/nodes/{node_id}/restore:
    post:
      operationId: restoreNode
      parameters:
        - $ref: "#/components/parameters/DriveId"
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/FetchSite"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NamespaceMutation"
      responses:
        "200":
          description: Trashed node restored after RESTORE authorization; live-name conflicts fail.
          headers:
            ETag:
              $ref: "#/components/headers/GenerationEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/drives/{drive_id}/trash:
    get:
      operationId: listTrash
      parameters:
        - $ref: "#/components/parameters/DriveId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Paginated trashed nodes, individually filtered with current READ_METADATA authorization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodePage"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/mcp/registrations:
    get:
      operationId: listMcpRegistrations
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Personal and assigned managed registrations visible to the current principal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpRegistrationPage"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createMcpRegistration
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/FetchSite"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMcpRegistration"
      responses:
        "201":
          description: Disabled personal registration.
          headers:
            ETag:
              $ref: "#/components/headers/GenerationEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpRegistration"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/mcp/registrations/import:
    post:
      operationId: importMcpRegistration
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/FetchSite"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpRegistrationExport"
      responses:
        "201":
          description: Disabled registration imported without credentials, approvals, or grants.
          headers:
            ETag:
              $ref: "#/components/headers/GenerationEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpRegistration"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/mcp/registrations/{registration_id}:
    get:
      operationId: getMcpRegistration
      parameters:
        - $ref: "#/components/parameters/RegistrationId"
      responses:
        "200":
          description: Redacted registration configuration and state.
          headers:
            ETag:
              $ref: "#/components/headers/GenerationEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpRegistration"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateMcpRegistration
      parameters:
        - $ref: "#/components/parameters/RegistrationId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/FetchSite"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMcpRegistration"
      responses:
        "200":
          description: Updated registration. Authority-affecting changes leave it disabled.
          headers:
            ETag:
              $ref: "#/components/headers/GenerationEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpRegistration"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteMcpRegistration
      parameters:
        - $ref: "#/components/parameters/RegistrationId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/FetchSite"
      responses:
        "202":
          description: Registration disabled immediately and queued for bounded credential revocation and erasure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpDeletionStatus"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/mcp/registrations/{registration_id}/export:
    get:
      operationId: exportMcpRegistration
      parameters:
        - $ref: "#/components/parameters/RegistrationId"
      responses:
        "200":
          description: Portable registration configuration without credentials, grants, approvals, or activity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpRegistrationExport"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/mcp/registrations/{registration_id}/test:
    post:
      operationId: testMcpRegistration
      parameters:
        - $ref: "#/components/parameters/RegistrationId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/FetchSite"
      responses:
        "200":
          description: Bounded transport and authentication test result with no upstream response body.
          headers:
            ETag:
              $ref: "#/components/headers/GenerationEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpTestResult"
        default:
          $ref: "#/components/responses/Problem"
