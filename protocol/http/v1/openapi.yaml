        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdminMcpServiceIdentity"
      responses:
        "201":
          description: Suspended service principal awaiting grants.
          headers:
            ETag:
              $ref: "#/components/headers/GenerationEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMcpServiceIdentity"
