          $ref: "#/components/responses/CapabilityProblem"
        default:
          $ref: "#/components/responses/Problem"
  /io/v1/downloads/{grant_id}:
    get:
      operationId: downloadPayload
      security:
        - capabilityHeader: []
        - capabilityCookie: []
      parameters:
        - $ref: "#/components/parameters/GrantId"
        - $ref: "#/components/parameters/Range"
      responses:
        "200":
          $ref: "#/components/responses/FullDownload"
        "206":
          $ref: "#/components/responses/PartialDownload"
        "401":
          $ref: "#/components/responses/CapabilityProblem"
        "416":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    head:
      operationId: headPayload
      security:
        - capabilityHeader: []
        - capabilityCookie: []
      parameters:
        - $ref: "#/components/parameters/GrantId"
        - $ref: "#/components/parameters/Range"
      responses:
        "200":
          $ref: "#/components/responses/FullDownloadHeaders"
        "206":
          $ref: "#/components/responses/PartialDownloadHeaders"
        "401":
          $ref: "#/components/responses/CapabilityProblem"
        "416":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: filebelt_session
    capabilityHeader:
      type: http
      scheme: fbcap1
      description: "Send `Authorization: fbcap1 <base64url-envelope>`."
    capabilityCookie:
      type: apiKey
      in: cookie
      name: filebelt_capability
  parameters:
    DriveId:
      name: drive_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UuidV4"
    NodeId:
      name: node_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UuidV4"
    ParentId:
      name: parent_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UuidV4"
    UploadId:
      name: upload_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UuidV4"
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UuidV4"
    VersionId:
      name: version_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UuidV4"
    PrincipalId:
      name: principal_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UuidV4"
    GrantId:
      name: grant_id
      in: path
      required: true
      description: Must equal the signed `grant_id` capability claim.
      schema:
        $ref: "#/components/schemas/UuidV4"
    RegistrationId:
      name: registration_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UuidV4"
    ApprovalId:
      name: approval_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UuidV4"
    IntentId:
      name: intent_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UuidV4"
    InvocationId:
      name: invocation_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UuidV4"
    McpGrantId:
      name: mcp_grant_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UuidV4"
    TemplateId:
      name: template_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UuidV4"
    ServiceId:
      name: service_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UuidV4"
    ServiceGrantId:
      name: service_grant_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UuidV4"
    BlockRuleId:
      name: block_rule_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UuidV4"
    Range:
      name: Range
      in: header
      required: false
      description: One bytes range only; it must be contained by the signed inclusive range.
      schema:
        type: string
        pattern: "^bytes=([0-9]+-[0-9]*|-[0-9]+)$"
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Exact opaque generation ETag from the most recent representation.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    Csrf:
      name: X-FileBelt-Csrf
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 256
    Origin:
      name: Origin
      in: header
      required: true
      schema:
        type: string
        format: uri
    FetchSite:
      name: Sec-Fetch-Site
      in: header
      required: true
      schema:
        type: string
        const: same-origin
  headers:
    GenerationEtag:
      description: Opaque generation validator for this representation.
      schema:
        type: string
  responses:
    Problem:
      description: Stable FileBelt problem response.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    CapabilityProblem:
      description: Capability is missing, malformed, expired, or invalid.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            const: fbcap1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    FullDownload:
      description: Complete signed range, which may be the complete payload.
      headers:
        Accept-Ranges:
          schema:
            type: string
            const: bytes
        Content-Length:
          schema:
            type: integer
            format: int64
            minimum: 0
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
    PartialDownload:
      description: A single requested range contained by the signed range.
      headers:
        Accept-Ranges:
          schema:
            type: string
            const: bytes
        Content-Range:
          schema:
            type: string
        Content-Length:
          schema:
            type: integer
            format: int64
            minimum: 0
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
    FullDownloadHeaders:
      description: Complete signed-range headers without a body.
      headers:
        Accept-Ranges:
          schema:
            type: string
            const: bytes
        Content-Length:
          schema:
            type: integer
            format: int64
            minimum: 0
    PartialDownloadHeaders:
      description: Single-range headers without a body.
      headers:
        Accept-Ranges:
          schema:
            type: string
            const: bytes
        Content-Range:
          schema:
            type: string
        Content-Length:
          schema:
            type: integer
            format: int64
            minimum: 0
  schemas:
    UuidV4:
      type: string
      format: uuid
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
    MediaType:
      type: string
      minLength: 1
      maxLength: 255
      pattern: "^[A-Za-z0-9!#$&^_.+-]+/[A-Za-z0-9!#$&^_.+-]+(?:;[A-Za-z0-9!#$&^_.+\u002d= ]+)?$"
      description: A normalized media type. Values exposed on Node or FileVersion are trusted server-derived metadata; request values are declarations only.
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          maxLength: 128
          pattern: "^[a-z][a-z0-9]*(?:\\.[a-z0-9_-]+)+$"
          description: Stable dotted FileBelt reason code. MCP failures use the `mcp.*` namespace.
    Session:
      type: object
      additionalProperties: false
      required:
        - session_id
        - user_id
        - principal_id
        - display_name
        - verified_email
        - tenant_admin
        - reauthenticated_recently
        - csrf_token
      properties:
        session_id:
          $ref: "#/components/schemas/UuidV4"
        user_id:
          $ref: "#/components/schemas/UuidV4"
        principal_id:
          $ref: "#/components/schemas/UuidV4"
        display_name:
          type: string
        verified_email:
          oneOf:
            - type: string
              format: email
            - type: "null"
        tenant_admin:
          type: boolean
        reauthenticated_recently:
          type: boolean
        csrf_token:
          type: string
          x-sensitive: true
    SessionSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - current
        - created_at
        - last_seen_at
        - idle_expires_at
        - absolute_expires_at
        - revoked
      properties:
        id:
          $ref: "#/components/schemas/UuidV4"
        current:
          type: boolean
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        idle_expires_at:
          type: string
          format: date-time
        absolute_expires_at:
          type: string
          format: date-time
        revoked:
          type: boolean
        user_agent:
          oneOf:
            - type: string
            - type: "null"
    Drive:
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - display_name
        - owner_display_name
        - root_id
        - namespace_generation
        - acl_generation
        - quota_bytes
        - used_physical_bytes
        - reserved_bytes
      properties:
        id:
          $ref: "#/components/schemas/UuidV4"
        kind:
          type: string
          enum: [private, shared]
        display_name:
          type: string
        owner_display_name:
          type: string
        root_id:
          $ref: "#/components/schemas/UuidV4"
        namespace_generation:
          type: integer
          format: int64
          minimum: 1
        acl_generation:
          type: integer
          format: int64
          minimum: 1
        quota_bytes:
          type: integer
          format: int64
          minimum: 0
        used_physical_bytes:
          type: integer
          format: int64
          minimum: 0
        reserved_bytes:
          type: integer
          format: int64
          minimum: 0
    DrivePage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Drive"
        next_cursor:
          oneOf:
            - type: string
            - type: "null"
    Node:
      type: object
      additionalProperties: false
      required:
        - id
        - drive_id
        - parent_id
        - kind
        - display_name
        - head_version_id
        - namespace_generation
        - acl_generation
        - trashed
        - updated_at
        - size_bytes
        - version_ordinal
        - head_media_type
      properties:
        id:
          $ref: "#/components/schemas/UuidV4"
        drive_id:
          $ref: "#/components/schemas/UuidV4"
        parent_id:
          oneOf:
            - $ref: "#/components/schemas/UuidV4"
            - type: "null"
        kind:
          type: string
          enum: [file, directory]
        display_name:
          type: string
        head_version_id:
          oneOf:
            - $ref: "#/components/schemas/UuidV4"
            - type: "null"
        namespace_generation:
          type: integer
          format: int64
          minimum: 1
        acl_generation:
          type: integer
          format: int64
          minimum: 1
        trashed:
          type: boolean
        updated_at:
          type: string
          format: date-time
        size_bytes:
          oneOf:
            - type: integer
              format: int64
              minimum: 0
            - type: "null"
        version_ordinal:
          oneOf:
            - type: integer
              format: int64
              minimum: 1
            - type: "null"
        head_media_type:
          oneOf:
            - $ref: "#/components/schemas/MediaType"
            - type: "null"
    NodePage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Node"
        next_cursor:
          oneOf:
            - type: string
            - type: "null"
    CollaborationSummary:
      type: object
      additionalProperties: false
      required: [active, room_id, codec, room_epoch, durable_sequence, base_version_id, current_head_version_id, dirty_expires_at, warning_at, frozen]
      properties:
        active:
          type: boolean
        room_id:
          oneOf:
            - $ref: "#/components/schemas/UuidV4"
            - type: "null"
        codec:
          oneOf:
            - type: string
              const: yjs-v1
            - type: "null"
        room_epoch:
          oneOf:
            - type: integer
              format: int64
              minimum: 1
            - type: "null"
        durable_sequence:
          oneOf:
            - type: integer
              format: int64
              minimum: 0
            - type: "null"
        base_version_id:
          oneOf:
            - $ref: "#/components/schemas/UuidV4"
            - type: "null"
        current_head_version_id:
          oneOf:
            - $ref: "#/components/schemas/UuidV4"
            - type: "null"
        dirty_expires_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        warning_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        frozen:
          type: boolean
    CreateCollaborationGrant:
      type: object
      additionalProperties: false
      required: [transport, client_id, presence_mode]
      properties:
        transport:
          type: string
          enum: [websocket]
          description: Phase 5 uses WebSocket. WebTransport remains reserved until its runtime and deployment boundary receive a separate review.
        client_id:
          $ref: "#/components/schemas/UuidV4"
        presence_mode:
          type: string
          enum: [pseudonym, display_name]
          description: Pseudonyms are generated by FileBelt; display names come from the authenticated profile. Clients cannot supply collaborator labels.
    CollaborationEndpoint:
      type: object
      additionalProperties: false
      required: [transport, url]
      properties:
        transport:
          type: string
          enum: [websocket]
        url:
          type: string
          format: uri
          description: Endpoint only; it contains neither authorization material nor session credentials.
    CollaborationGrant:
      type: object
      additionalProperties: false
      required: [grant_id, authorization, expires_at, codec, protocol_version, presence_label, room, endpoints]
      properties:
        grant_id:
          $ref: "#/components/schemas/UuidV4"
        authorization:
          type: string
          x-sensitive: true
          description: Opaque one-use value sent only in the first CollaborationFrame Authenticate message.
        expires_at:
          type: string
          format: date-time
        codec:
          type: string
          const: yjs-v1
        protocol_version:
          type: integer
          minimum: 1
          maximum: 1
        presence_label:
          type: string
          minLength: 1
          maxLength: 120
          description: Server-derived privacy-safe label bound into the one-use grant.
        room:
          $ref: "#/components/schemas/CollaborationSummary"
        endpoints:
          type: array
          minItems: 1
          maxItems: 2
          items:
            $ref: "#/components/schemas/CollaborationEndpoint"
    CreateMarkdownImportIntent:
      type: object
      additionalProperties: false
      required: [source_version_id, target_name]
      properties:
        source_version_id:
          $ref: "#/components/schemas/UuidV4"
        target_name:
          type: string
          minLength: 1
          maxLength: 255
          description: Display name for a new file sibling of the source node. Existing nodes are never import targets.
        target_media_type:
          type: string
          const: text/markdown
    MarkdownImportIntent:
      type: object
      additionalProperties: false
      required: [id, source_drive_id, source_node_id, source_version_id, target_parent_id, target_name, target_media_type, expires_at]
      properties:
        id:
          $ref: "#/components/schemas/UuidV4"
        source_drive_id:
          $ref: "#/components/schemas/UuidV4"
        source_node_id:
          $ref: "#/components/schemas/UuidV4"
        source_version_id:
          $ref: "#/components/schemas/UuidV4"
        target_parent_id:
          $ref: "#/components/schemas/UuidV4"
        target_name:
          type: string
        target_media_type:
          type: string
          const: text/markdown
        expires_at:
          type: string
          format: date-time
    VersionProvenance:
      type: object
      additionalProperties: false
      required: [origin, source_version_id, creator_display_name, mcp_assisted]
      properties:
        origin:
          type: string
          enum: [upload, markdown_save, collaboration_checkpoint, import, restore]
        source_version_id:
          oneOf:
            - $ref: "#/components/schemas/UuidV4"
            - type: "null"
        creator_display_name:
          type: string
          minLength: 1
          maxLength: 120
        mcp_assisted:
          type: boolean
    FileVersion:
      type: object
      additionalProperties: false
      required:
        - id
        - node_id
        - ordinal
        - size_bytes
        - created_by
        - restored_from_version_id
        - created_at
        - current
        - media_type
        - provenance
      properties:
        id:
          $ref: "#/components/schemas/UuidV4"
        node_id:
          $ref: "#/components/schemas/UuidV4"
        ordinal:
          type: integer
          format: int64
          minimum: 1
        size_bytes:
          type: integer
          format: int64
          minimum: 0
        created_by:
          $ref: "#/components/schemas/UuidV4"
        restored_from_version_id:
          oneOf:
            - $ref: "#/components/schemas/UuidV4"
            - type: "null"
        created_at:
          type: string
          format: date-time
        current:
          type: boolean
        media_type:
          $ref: "#/components/schemas/MediaType"
        provenance:
          $ref: "#/components/schemas/VersionProvenance"
    VersionPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FileVersion"
        next_cursor:
          oneOf:
            - type: string
            - type: "null"
    RestoreVersion:
      type: object
      additionalProperties: false
      required: [expected_head_version_id]
      properties:
        expected_head_version_id:
          $ref: "#/components/schemas/UuidV4"
    CreateShare:
      type: object
      additionalProperties: false
      required: [kind, verified_email, preset, inheritance]
      properties:
        kind:
          type: string
          enum: [direct, group, link]
          description: Only `direct` is implemented; `group` and `link` fail with `share.kind_unsupported`.
        verified_email:
          oneOf:
            - type: string
              format: email
              maxLength: 320
            - type: "null"
        preset:
          type: string
          enum: [viewer, contributor, manager]
        inheritance:
          type: string
          enum: [self, self_and_descendants]
    DirectShare:
      type: object
      additionalProperties: false
      required:
        - kind
        - principal_id
        - display_name
        - verified_email
        - preset
        - inheritance
        - created_at
      properties:
        kind:
          type: string
          const: direct
        principal_id:
          $ref: "#/components/schemas/UuidV4"
        display_name:
          type: string
        verified_email:
          type: string
          format: email
        preset:
          type: string
          enum: [viewer, contributor, manager]
        inheritance:
          type: string
          enum: [self, self_and_descendants]
        created_at:
          type: string
          format: date-time
    NamespaceMutation:
      type: object
      additionalProperties: false
      required: [expected_namespace_generation]
      properties:
        expected_namespace_generation:
          type: integer
          format: int64
          minimum: 1
    CreateDirectory:
      type: object
      additionalProperties: false
      required: [name, expected_parent_generation]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        expected_parent_generation:
          type: integer
          format: int64
          minimum: 1
    BeginUpload:
      type: object
      additionalProperties: false
      required: [parent_id, name, declared_size_bytes]
      properties:
        parent_id:
          $ref: "#/components/schemas/UuidV4"
        node_id:
          oneOf:
            - $ref: "#/components/schemas/UuidV4"
            - type: "null"
        expected_head_version_id:
          oneOf:
            - $ref: "#/components/schemas/UuidV4"
            - type: "null"
        expected_parent_generation:
          oneOf:
            - type: integer
              format: int64
              minimum: 1
            - type: "null"
        name:
          type: string
          minLength: 1
          maxLength: 255
        declared_size_bytes:
          type: integer
          format: int64
          minimum: 0
        declared_media_type:
          oneOf:
            - $ref: "#/components/schemas/MediaType"
            - type: "null"
          description: Caller declaration only. The committed media type is trusted only after server validation of finalized bytes.
        collaboration_checkpoint_id:
          oneOf:
            - $ref: "#/components/schemas/UuidV4"
            - type: "null"
          description: Durable collaboration checkpoint to consume for this immutable version. It is bound to this node and expected head.
        import_intent_id:
          oneOf:
            - $ref: "#/components/schemas/UuidV4"
            - type: "null"
          description: Exact one-use Markdown import intent. It cannot be combined with a collaboration checkpoint.
    UploadAllocation:
      type: object
      additionalProperties: false
      required:
        - upload_id
        - drive_id
        - parent_id
        - node_id
        - payload_id
        - declared_size_bytes
        - chunk_size_bytes
        - part_count
        - fencing_token
        - state
        - grants_url
      properties:
        upload_id:
          $ref: "#/components/schemas/UuidV4"
        drive_id:
          $ref: "#/components/schemas/UuidV4"
        parent_id:
          $ref: "#/components/schemas/UuidV4"
        node_id:
          oneOf:
            - $ref: "#/components/schemas/UuidV4"
            - type: "null"
        payload_id:
          $ref: "#/components/schemas/UuidV4"
        declared_size_bytes:
          type: integer
          format: int64
          minimum: 0
        chunk_size_bytes:
          type: integer
          minimum: 1
        part_count:
          type: integer
          minimum: 1
        fencing_token:
          type: integer
          format: int64
          minimum: 1
        state:
          type: string
          enum: [open, finalizing, finalized, committed, aborted, expired]
        grants_url:
          type: string
    ByteGrant:
      type: object
      additionalProperties: false
      required: [method, path, authorization_scheme, authorization, expires_at]
      properties:
        method:
          type: string
          enum: [PUT, POST]
        path:
          type: string
        authorization_scheme:
          type: string
          const: fbcap1
        authorization:
          type: string
          x-sensitive: true
        expires_at:
          type: string
          format: date-time
    UploadGrants:
      type: object
      additionalProperties: false
      required: [upload, parts, next_cursor, finalize]
      properties:
        upload:
          $ref: "#/components/schemas/UploadAllocation"
        parts:
          type: array
          items:
            $ref: "#/components/schemas/ByteGrant"
        next_cursor:
          oneOf:
            - type: string
            - type: "null"
        finalize:
          $ref: "#/components/schemas/ByteGrant"
    DownloadGrant:
      type: object
      additionalProperties: false
      required:
        - grant_id
        - method
        - path
        - authorization_scheme
        - authorization
        - expires_at
        - size_bytes
      properties:
        grant_id:
          $ref: "#/components/schemas/UuidV4"
        method:
          type: string
