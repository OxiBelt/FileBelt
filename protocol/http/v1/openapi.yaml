          $ref: "#/components/responses/Problem"
  /api/v1/admin/mcp/service-identities/{service_id}:
    patch:
      operationId: updateAdminMcpServiceIdentity
      parameters:
        - $ref: "#/components/parameters/ServiceId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/FetchSite"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdminMcpServiceIdentity"
      responses:
        "200":
          description: Updated service state or identity binding.
          headers:
