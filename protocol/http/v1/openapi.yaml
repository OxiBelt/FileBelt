      properties:
        id:
          $ref: "#/components/schemas/UuidV4"
        intent_id:
          $ref: "#/components/schemas/UuidV4"
        scope:
          type: string
          enum: [once, session]
        registration_id:
          $ref: "#/components/schemas/UuidV4"
        capability_fingerprint:
          type: string
          pattern: "^[0-9a-f]{64}$"
        application_id:
          type: string
