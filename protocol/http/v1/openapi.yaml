        - $ref: "#/components/parameters/ApprovalId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/FetchSite"
      responses:
        "204":
          description: Approval revoked.
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/mcp/activity:
    get:
      operationId: listMcpActivity
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Redacted MCP activity visible to the current principal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpActivityPage"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/mcp/invocation-intents:
    post:
      operationId: createMcpInvocationIntent
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/FetchSite"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpInvocationRequest"
      responses:
        "201":
          description: Five-minute intent storing only the keyed digest of the exact request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpInvocationIntent"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/mcp/invocation-intents/{intent_id}/approval:
    post:
      operationId: approveMcpInvocationIntent
      description: Creates an approval from the server-held exact request digest; the browser never supplies or derives keyed digests.
      parameters:
        - $ref: "#/components/parameters/IntentId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/FetchSite"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveMcpInvocationIntent"
      responses:
        "201":
          description: Explicit approval bound to this exact intent, session, application, capability, arguments, and attachments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpApproval"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/mcp/invocation-intents/{intent_id}/stream:
    post:
      operationId: streamMcpInvocation
      parameters:
        - $ref: "#/components/parameters/IntentId"
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/FetchSite"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpInvocationRequest"
      responses:
        "200":
          description: Bounded line-delimited invocation events; disconnect cancels and results are never replayed.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/x-ndjson:
              schema:
                type: string
                description: Each line is one McpInvocationEvent JSON value.
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/mcp/invocations/{invocation_id}:
    delete:
      operationId: cancelMcpInvocation
      parameters:
        - $ref: "#/components/parameters/InvocationId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/FetchSite"
      responses:
        "204":
          description: Cancellation recorded; execution and upstream transfer are terminated.
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/drives/{drive_id}/nodes/{node_id}/mcp-grants:
    get:
      operationId: listMcpDataGrants
      parameters:
        - $ref: "#/components/parameters/DriveId"
        - $ref: "#/components/parameters/NodeId"
      responses:
        "200":
          description: Active self-node MCP grants the current principal may inspect.
          headers:
            ETag:
              $ref: "#/components/headers/GenerationEtag"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/McpDataGrant"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createMcpDataGrant
      parameters:
        - $ref: "#/components/parameters/DriveId"
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/FetchSite"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMcpDataGrant"
      responses:
        "201":
          description: Strictly attenuated, self-node-only MCP data grant.
          headers:
            ETag:
              $ref: "#/components/headers/GenerationEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpDataGrant"
        "503":
          description: MCP data-grant admission is blocked until the tenant descendant-share repair is verified and activated. The Problem code is `mcp.data_grant.remediation_in_progress`.
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter60"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/drives/{drive_id}/nodes/{node_id}/mcp-grants/{mcp_grant_id}:
    delete:
      operationId: revokeMcpDataGrant
      parameters:
        - $ref: "#/components/parameters/DriveId"
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/McpGrantId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/FetchSite"
      responses:
        "204":
          description: MCP data grant revoked.
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/admin/mcp/templates:
    get:
      operationId: listAdminMcpTemplates
      parameters:
