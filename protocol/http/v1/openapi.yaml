          $ref: "#/components/responses/Problem"
  /api/v1/admin/mcp/block-rules/{block_rule_id}:
    delete:
      operationId: deleteAdminMcpBlockRule
      parameters:
        - $ref: "#/components/parameters/BlockRuleId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/FetchSite"
      responses:
        "204":
          description: Global block removed; affected registrations remain disabled pending explicit review.
        default:
          $ref: "#/components/responses/Problem"
  /io/v1/uploads/{upload_id}/parts/{part}:
    put:
      operationId: putUploadPart
      security:
        - capabilityHeader: []
        - capabilityCookie: []
      parameters:
        - $ref: "#/components/parameters/UploadId"
        - name: part
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
        - name: Content-Length
          in: header
          required: false
          description: When present, must equal the authoritative exact part size.
          schema:
            type: integer
            format: int64
            minimum: 0
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Part bytes and their BLAKE3 digest are durable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadPartReceipt"
        "401":
          $ref: "#/components/responses/CapabilityProblem"
        default:
          $ref: "#/components/responses/Problem"
  /io/v1/uploads/{upload_id}/finalize:
    post:
      operationId: finalizeUpload
      security:
        - capabilityHeader: []
        - capabilityCookie: []
      parameters:
        - $ref: "#/components/parameters/UploadId"
      responses:
        "200":
          description: Complete manifest finalized and durably recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinalizeReceipt"
        "401":
          $ref: "#/components/responses/CapabilityProblem"
        default:
          $ref: "#/components/responses/Problem"
  /io/v1/downloads/{grant_id}:
    get:
      operationId: downloadPayload
      security:
        - capabilityHeader: []
        - capabilityCookie: []
      parameters:
        - $ref: "#/components/parameters/GrantId"
        - $ref: "#/components/parameters/Range"
      responses:
        "200":
          $ref: "#/components/responses/FullDownload"
        "206":
          $ref: "#/components/responses/PartialDownload"
        "401":
          $ref: "#/components/responses/CapabilityProblem"
        "416":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    head:
      operationId: headPayload
      security:
        - capabilityHeader: []
        - capabilityCookie: []
      parameters:
        - $ref: "#/components/parameters/GrantId"
        - $ref: "#/components/parameters/Range"
      responses:
        "200":
          $ref: "#/components/responses/FullDownloadHeaders"
        "206":
          $ref: "#/components/responses/PartialDownloadHeaders"
        "401":
          $ref: "#/components/responses/CapabilityProblem"
        "416":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: filebelt_session
    capabilityHeader:
      type: http
      scheme: fbcap1
      description: "Send `Authorization: fbcap1 <base64url-envelope>`."
    capabilityCookie:
      type: apiKey
      in: cookie
      name: filebelt_capability
  parameters:
    DriveId:
      name: drive_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UuidV4"
    NodeId:
      name: node_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UuidV4"
    PreviewId:
      name: preview_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UuidV4"
    ParentId:
      name: parent_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UuidV4"
    UploadId:
      name: upload_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UuidV4"
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UuidV4"
    DocumentSessionId:
      name: document_session_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UuidV4"
    MountProtocol:
      name: protocol
      in: path
      required: true
      schema:
        type: string
        enum: [smb, ftps]
    MountCredentialId:
      name: credential_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UuidV4"
    VersionId:
      name: version_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UuidV4"
    PrincipalId:
      name: principal_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UuidV4"
    GrantId:
      name: grant_id
      in: path
      required: true
      description: Must equal the signed `grant_id` capability claim.
      schema:
        $ref: "#/components/schemas/UuidV4"
    RegistrationId:
      name: registration_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UuidV4"
    ApprovalId:
      name: approval_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UuidV4"
    IntentId:
      name: intent_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UuidV4"
    InvocationId:
      name: invocation_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UuidV4"
    McpGrantId:
      name: mcp_grant_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UuidV4"
    TemplateId:
      name: template_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UuidV4"
    ServiceId:
      name: service_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UuidV4"
    ServiceGrantId:
      name: service_grant_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UuidV4"
    BlockRuleId:
      name: block_rule_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UuidV4"
    Range:
      name: Range
      in: header
      required: false
      description: One bytes range only; it must be contained by the signed inclusive range.
      schema:
        type: string
        pattern: "^bytes=([0-9]+-[0-9]*|-[0-9]+)$"
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Exact opaque generation ETag from the most recent representation.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    Csrf:
      name: X-FileBelt-Csrf
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 256
    Origin:
      name: Origin
      in: header
      required: true
      schema:
        type: string
        format: uri
    FetchSite:
      name: Sec-Fetch-Site
      in: header
      required: true
      schema:
        type: string
        const: same-origin
  headers:
    GenerationEtag:
      description: Opaque generation validator for this representation.
      schema:
        type: string
    RetryAfter60:
      description: The tenant-wide security admission gate is rechecked after 60 seconds; clients must not retry earlier.
      schema:
        type: string
        const: "60"
  responses:
    Problem:
      description: Stable FileBelt problem response.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    DocumentSessionProblem:
      description: Stable provider-neutral document-session problem response.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/DocumentSessionProblem"
    CapabilityProblem:
      description: Capability is missing, malformed, expired, or invalid.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            const: fbcap1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    FullDownload:
      description: Complete signed range, which may be the complete payload.
      headers:
        Accept-Ranges:
          schema:
            type: string
            const: bytes
        Content-Length:
          schema:
            type: integer
            format: int64
            minimum: 0
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
    PartialDownload:
      description: A single requested range contained by the signed range.
      headers:
        Accept-Ranges:
          schema:
            type: string
            const: bytes
        Content-Range:
          schema:
            type: string
        Content-Length:
          schema:
            type: integer
            format: int64
            minimum: 0
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
    FullDownloadHeaders:
      description: Complete signed-range headers without a body.
      headers:
        Accept-Ranges:
          schema:
            type: string
            const: bytes
        Content-Length:
          schema:
            type: integer
            format: int64
            minimum: 0
    PartialDownloadHeaders:
      description: Single-range headers without a body.
      headers:
        Accept-Ranges:
          schema:
            type: string
            const: bytes
        Content-Range:
          schema:
            type: string
        Content-Length:
          schema:
            type: integer
            format: int64
            minimum: 0
  schemas:
    UuidV4:
      type: string
      format: uuid
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
    MediaType:
      type: string
      minLength: 1
      maxLength: 255
      pattern: "^[A-Za-z0-9!#$&^_.+-]+/[A-Za-z0-9!#$&^_.+-]+(?:;[A-Za-z0-9!#$&^_.+\u002d= ]+)?$"
      description: A normalized media type. Values exposed on Node or FileVersion are trusted server-derived metadata; request values are declarations only.
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          maxLength: 128
          pattern: "^[a-z][a-z0-9]*(?:\\.[a-z0-9_-]+)+$"
          description: Stable dotted FileBelt reason code. MCP failures use the `mcp.*` namespace.
    DocumentSessionProblem:
      type: object
      additionalProperties: false
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          maxLength: 128
          pattern: "^[a-z][a-z0-9]*(?:\\.[a-z0-9_-]+)+$"
          description: Stable dotted FileBelt reason code. Provider-specific error details are never exposed here.
    Session:
      type: object
      additionalProperties: false
      required:
        - session_id
        - user_id
        - principal_id
        - display_name
        - verified_email
        - tenant_admin
        - reauthenticated_recently
        - csrf_token
      properties:
        session_id:
          $ref: "#/components/schemas/UuidV4"
        user_id:
          $ref: "#/components/schemas/UuidV4"
        principal_id:
          $ref: "#/components/schemas/UuidV4"
        display_name:
          type: string
        verified_email:
          oneOf:
            - type: string
              format: email
            - type: "null"
        tenant_admin:
          type: boolean
        reauthenticated_recently:
          type: boolean
        csrf_token:
          type: string
          x-sensitive: true
    SessionSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - current
        - created_at
        - last_seen_at
        - idle_expires_at
        - absolute_expires_at
        - revoked
      properties:
        id:
          $ref: "#/components/schemas/UuidV4"
        current:
          type: boolean
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        idle_expires_at:
          type: string
          format: date-time
        absolute_expires_at:
          type: string
          format: date-time
        revoked:
          type: boolean
        user_agent:
          oneOf:
            - type: string
            - type: "null"
    MountOverview:
      type: object
      additionalProperties: false
      required: [policies, credentials, devices, sessions, drives]
      properties:
        policies:
          type: array
          items:
            $ref: "#/components/schemas/MountPolicy"
        credentials:
          type: array
          items:
            $ref: "#/components/schemas/MountCredential"
        devices:
          type: array
          items:
            $ref: "#/components/schemas/MountDevice"
        sessions:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/MountSession"
        drives:
          type: array
          items:
            $ref: "#/components/schemas/Drive"
    MountPolicy:
      type: object
      additionalProperties: false
      required: [protocol, enabled, read_only, allowed_drive_ids, authorization_generation, revision, updated_at]
      properties:
        protocol:
          type: string
          enum: [smb, ftps]
        enabled:
          type: boolean
        read_only:
          type: boolean
        allowed_drive_ids:
          type: array
          maxItems: 256
          uniqueItems: true
          items:
            $ref: "#/components/schemas/UuidV4"
        authorization_generation:
          type: integer
          format: int64
          minimum: 1
        revision:
          type: integer
          format: int64
          minimum: 1
        updated_at:
          type: string
          format: date-time
    PutMountPolicy:
      type: object
      additionalProperties: false
      required: [enabled, read_only, allowed_drive_ids]
      properties:
        enabled:
          type: boolean
        read_only:
          type: boolean
          const: true
        allowed_drive_ids:
          type: array
          maxItems: 256
          uniqueItems: true
          items:
            $ref: "#/components/schemas/UuidV4"
    MountCredential:
      type: object
      additionalProperties: false
      required: [id, principal_id, protocol, username, verifier_kind, credential_generation, authorization_generation, read_only, allowed_drive_ids, bound_device_id, created_at, last_used_at, expires_at, revoked_at]
      properties:
        id:
          $ref: "#/components/schemas/UuidV4"
        principal_id:
          $ref: "#/components/schemas/UuidV4"
        protocol:
          type: string
          enum: [smb, ftps]
        username:
          type: string
          minLength: 16
          maxLength: 96
        verifier_kind:
          type: string
          enum: [ntlm_verifier, hmac_sha256]
        credential_generation:
          type: integer
          format: int64
          minimum: 1
        authorization_generation:
          type: integer
          format: int64
          minimum: 1
        read_only:
          type: boolean
        allowed_drive_ids:
          type: array
          maxItems: 256
          uniqueItems: true
          items:
            $ref: "#/components/schemas/UuidV4"
        bound_device_id:
          oneOf:
            - $ref: "#/components/schemas/UuidV4"
            - type: "null"
        created_at:
          type: string
          format: date-time
        last_used_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        expires_at:
          type: string
          format: date-time
        revoked_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
    CreateMountCredential:
      type: object
      additionalProperties: false
      required: [protocol, read_only, allowed_drive_ids, bound_device_id, expires_at]
      properties:
        protocol:
          type: string
          enum: [smb, ftps]
        read_only:
          type: boolean
          const: true
        allowed_drive_ids:
          type: array
          minItems: 1
          maxItems: 256
          uniqueItems: true
          items:
            $ref: "#/components/schemas/UuidV4"
        bound_device_id:
          oneOf:
            - $ref: "#/components/schemas/UuidV4"
            - type: "null"
        expires_at:
          type: string
          format: date-time
    CreatedMountCredential:
      type: object
      additionalProperties: false
      required: [credential_id, protocol, username, password, expires_at]
      properties:
        credential_id:
          $ref: "#/components/schemas/UuidV4"
        protocol:
          type: string
          enum: [smb, ftps]
        username:
          type: string
        password:
          type: string
          writeOnly: true
          x-sensitive: true
        expires_at:
          type: string
          format: date-time
    MountDevice:
      type: object
      additionalProperties: false
      required: [id, principal_id, headscale_node_id, display_name, tailnet_addresses, node_tags, capability_version, ownership_generation, observed_at, revoked_at]
      properties:
        id:
          $ref: "#/components/schemas/UuidV4"
        principal_id:
          $ref: "#/components/schemas/UuidV4"
        headscale_node_id:
          type: string
        display_name:
          type: string
        tailnet_addresses:
          type: array
          items:
            type: string
        node_tags:
          type: array
          items:
            type: string
        capability_version:
          type: string
          const: headscale-0.29.3
        ownership_generation:
          type: integer
          format: int64
          minimum: 1
        observed_at:
          type: string
          format: date-time
        revoked_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
    MountSession:
      type: object
      additionalProperties: false
      required: [id, protocol, gateway_id, source_address, state, created_at, last_activity_at, idle_expires_at, absolute_expires_at, close_reason]
      properties:
        id:
          $ref: "#/components/schemas/UuidV4"
        protocol:
          type: string
          enum: [smb, ftps]
        gateway_id:
          type: string
        source_address:
          type: string
        state:
          type: string
          enum: [active, draining, closed, revoked]
        created_at:
          type: string
          format: date-time
        last_activity_at:
          type: string
          format: date-time
        idle_expires_at:
          type: string
          format: date-time
        absolute_expires_at:
          type: string
          format: date-time
        close_reason:
          oneOf:
            - type: string
            - type: "null"
    Drive:
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - display_name
        - owner_display_name
        - root_id
        - namespace_generation
        - acl_generation
        - quota_bytes
        - used_physical_bytes
        - reserved_bytes
      properties:
        id:
          $ref: "#/components/schemas/UuidV4"
        kind:
          type: string
          enum: [private, shared]
        display_name:
          type: string
        owner_display_name:
          type: string
        root_id:
          $ref: "#/components/schemas/UuidV4"
        namespace_generation:
          type: integer
          format: int64
          minimum: 1
        acl_generation:
          type: integer
          format: int64
          minimum: 1
        quota_bytes:
          type: integer
          format: int64
          minimum: 0
        used_physical_bytes:
          type: integer
          format: int64
          minimum: 0
        reserved_bytes:
          type: integer
          format: int64
          minimum: 0
    DrivePage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Drive"
        next_cursor:
          oneOf:
            - type: string
            - type: "null"
    Node:
      type: object
      additionalProperties: false
      required:
        - id
        - drive_id
        - parent_id
        - kind
        - display_name
        - head_version_id
        - namespace_generation
        - acl_generation
        - trashed
        - updated_at
        - size_bytes
        - version_ordinal
        - head_media_type
      properties:
        id:
          $ref: "#/components/schemas/UuidV4"
        drive_id:
          $ref: "#/components/schemas/UuidV4"
        parent_id:
          oneOf:
            - $ref: "#/components/schemas/UuidV4"
            - type: "null"
        kind:
          type: string
          enum: [file, directory]
        display_name:
          type: string
        head_version_id:
          oneOf:
            - $ref: "#/components/schemas/UuidV4"
            - type: "null"
        namespace_generation:
          type: integer
          format: int64
          minimum: 1
        acl_generation:
          type: integer
          format: int64
          minimum: 1
        trashed:
          type: boolean
        updated_at:
          type: string
          format: date-time
        size_bytes:
          oneOf:
            - type: integer
              format: int64
              minimum: 0
            - type: "null"
        version_ordinal:
          oneOf:
            - type: integer
              format: int64
              minimum: 1
            - type: "null"
        head_media_type:
          oneOf:
            - $ref: "#/components/schemas/MediaType"
            - type: "null"
    NodePage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Node"
        next_cursor:
          oneOf:
            - type: string
            - type: "null"
    CreateDocumentSession:
      type: object
      additionalProperties: false
      required: [base_version_id, mode]
      properties:
        base_version_id:
          $ref: "#/components/schemas/UuidV4"
        mode:
          type: string
          enum: [view, comment, review, edit]
          description: View requires READ_CONTENT and USE_EXTERNAL_EDITOR. Comment, review, and edit are mutating modes and also require WRITE_CONTENT and CREATE_VERSION; comment and review require COMMENT and REVIEW respectively.
    DocumentSessionSummary:
      type: object
      additionalProperties: false
      required: [id, drive_id, node_id, base_version_id, mode, state, created_at, last_activity_at, expires_at, closed_at, conflict_head_version_id, participant_count]
      properties:
        id:
          $ref: "#/components/schemas/UuidV4"
        drive_id:
          $ref: "#/components/schemas/UuidV4"
        node_id:
          $ref: "#/components/schemas/UuidV4"
        base_version_id:
          $ref: "#/components/schemas/UuidV4"
        mode:
          type: string
          enum: [view, comment, review, edit]
        state:
          type: string
          enum: [active, conflicted, revoked, closed, expired]
        created_at:
          type: string
          format: date-time
        last_activity_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        closed_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        conflict_head_version_id:
          oneOf:
            - $ref: "#/components/schemas/UuidV4"
            - type: "null"
        participant_count:
          type: integer
          minimum: 0
    DocumentSessionParticipant:
      type: object
      additionalProperties: false
      required: [principal_id, display_name, mode, active, joined_at, last_activity_at]
      properties:
        principal_id:
          $ref: "#/components/schemas/UuidV4"
        display_name:
          type: string
          minLength: 1
          maxLength: 120
        mode:
          type: string
          enum: [view, comment, review, edit]
        active:
          type: boolean
        joined_at:
          type: string
          format: date-time
        last_activity_at:
          type: string
          format: date-time
    DocumentSessionDetail:
      type: object
      additionalProperties: false
      required: [session, participants, provider_origin]
      properties:
        session:
          $ref: "#/components/schemas/DocumentSessionSummary"
        participants:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/DocumentSessionParticipant"
        provider_origin:
          type: string
          format: uri
          description: Exact non-secret operator-configured external document-provider HTTPS origin disclosed before a fresh handoff. It is never request-controlled.
    DocumentSessionPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DocumentSessionSummary"
        next_cursor:
          oneOf:
            - type: string
            - type: "null"
    CreateDocumentSessionConflictCopy:
      type: object
      additionalProperties: false
      required: [target_parent_id, target_name, expected_parent_generation]
      properties:
        target_parent_id:
          $ref: "#/components/schemas/UuidV4"
        target_name:
          type: string
          minLength: 1
          maxLength: 255
        expected_parent_generation:
          type: integer
          format: int64
          minimum: 1
    DocumentSessionConflictCopy:
      type: object
      additionalProperties: false
      required: [node, version]
      properties:
        node:
          $ref: "#/components/schemas/Node"
        version:
          $ref: "#/components/schemas/FileVersion"
    DocumentSessionLaunchHandoff:
      type: object
      additionalProperties: false
      required: [session_id, action, grant, expires_at]
      properties:
        session_id:
          $ref: "#/components/schemas/UuidV4"
        action:
          type: string
          format: uri
          description: The fixed operator-configured isolated editor HTTPS form action. It is valid only with the corresponding one-use grant, is never selected by a provider or request, and must not share a hostname with FileBelt or the provider.
        grant:
          type: string
          minLength: 32
          maxLength: 4096
          writeOnly: true
          description: An opaque, one-use launch grant. Clients must keep it in memory and submit it by POST only.
        expires_at:
          type: string
          format: date-time
    CollaborationSummary:
      type: object
      additionalProperties: false
      required: [active, room_id, codec, room_epoch, durable_sequence, base_version_id, current_head_version_id, dirty_expires_at, warning_at, frozen]
      properties:
        active:
          type: boolean
        room_id:
          oneOf:
            - $ref: "#/components/schemas/UuidV4"
            - type: "null"
        codec:
          oneOf:
            - type: string
              const: yjs-v1
            - type: "null"
        room_epoch:
          oneOf:
            - type: integer
              format: int64
              minimum: 1
            - type: "null"
        durable_sequence:
          oneOf:
            - type: integer
              format: int64
              minimum: 0
            - type: "null"
        base_version_id:
          oneOf:
            - $ref: "#/components/schemas/UuidV4"
            - type: "null"
        current_head_version_id:
          oneOf:
            - $ref: "#/components/schemas/UuidV4"
            - type: "null"
        dirty_expires_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        warning_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        frozen:
          type: boolean
    CreateCollaborationGrant:
      type: object
      additionalProperties: false
      required: [transport, client_id, presence_mode]
      properties:
        transport:
          type: string
          enum: [websocket, webtransport]
          description: Selects one reviewed collaboration transport. WebTransport is advertised only when its same-origin Kubernetes route is enabled.
        client_id:
          $ref: "#/components/schemas/UuidV4"
        presence_mode:
          type: string
          enum: [pseudonym, display_name]
          description: Pseudonyms are generated by FileBelt; display names come from the authenticated profile. Clients cannot supply collaborator labels.
    CollaborationEndpoint:
      type: object
      additionalProperties: false
      required: [transport, url]
      properties:
        transport:
          type: string
          enum: [websocket, webtransport]
        url:
          type: string
          format: uri
          description: Endpoint only; it contains neither authorization material nor session credentials.
    CollaborationGrant:
      type: object
      additionalProperties: false
      required: [grant_id, authorization, expires_at, codec, protocol_version, presence_label, room, endpoints]
      properties:
        grant_id:
          $ref: "#/components/schemas/UuidV4"
        authorization:
          type: string
          x-sensitive: true
          description: Opaque one-use value sent only in the first CollaborationFrame Authenticate message.
        expires_at:
          type: string
          format: date-time
        codec:
          type: string
          const: yjs-v1
        protocol_version:
          type: integer
          minimum: 1
          maximum: 1
        presence_label:
          type: string
          minLength: 1
          maxLength: 120
          description: Server-derived privacy-safe label bound into the one-use grant.
        room:
          $ref: "#/components/schemas/CollaborationSummary"
        endpoints:
          type: array
          minItems: 1
          maxItems: 2
          items:
            $ref: "#/components/schemas/CollaborationEndpoint"
    CreateMediaPreview:
      type: object
      additionalProperties: false
      required: [source_version_id, video_codecs, audio_codec, explicit_user_confirmation]
      properties:
        source_version_id:
          $ref: "#/components/schemas/UuidV4"
        video_codecs:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items:
            type: string
            enum: [av1, vp9]
        audio_codec:
          type: string
          const: opus
        explicit_user_confirmation:
          type: boolean
          const: true
    MediaPreview:
      type: object
      additionalProperties: false
      required: [id, drive_id, node_id, source_version_id, state, attempt_count, job_epoch]
      properties:
        id:
          $ref: "#/components/schemas/UuidV4"
        drive_id:
          $ref: "#/components/schemas/UuidV4"
        node_id:
          $ref: "#/components/schemas/UuidV4"
        source_version_id:
          $ref: "#/components/schemas/UuidV4"
        state:
          type: string
          enum: [requested, running, verifying, ready, failed, quarantined, cancelled, evicting, evicted]
        attempt_count:
          type: integer
          minimum: 0
          maximum: 3
        job_epoch:
          type: integer
          format: int64
          minimum: 0
    UpsertNfsPrincipalMapping:
      type: object
      additionalProperties: false
      required: [principal_id, kerberos_principal, projected_uid, projected_gid, allowed_drive_ids]
      properties:
        principal_id:
          $ref: "#/components/schemas/UuidV4"
        kerberos_principal:
          type: string
          minLength: 3
          maxLength: 512
          pattern: '^[^\s@]+@[^\s@]+$'
        projected_uid:
          type: integer
          format: int64
          minimum: 1
          maximum: 4294967294
          not:
            const: 65534
        projected_gid:
          type: integer
          format: int64
          minimum: 1
          maximum: 4294967294
          not:
            const: 65534
        allowed_drive_ids:
          type: array
          minItems: 1
          maxItems: 256
          uniqueItems: true
          items:
            $ref: "#/components/schemas/UuidV4"
        expected_generation:
          oneOf:
            - type: integer
              format: int64
              minimum: 1
            - type: "null"
    NfsPrincipalMapping:
      type: object
      additionalProperties: false
      required: [kerberos_principal, principal_id, credential_id, projected_uid, projected_gid, generation]
      properties:
        kerberos_principal:
          type: string
        principal_id:
          $ref: "#/components/schemas/UuidV4"
        credential_id:
          $ref: "#/components/schemas/UuidV4"
        projected_uid:
          type: integer
          format: int64
          minimum: 1
          maximum: 4294967294
          not:
            const: 65534
        projected_gid:
