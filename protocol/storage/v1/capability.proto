syntax = "proto3";

package filebelt.storage.v1;

// A capability is signed over the exact deterministic encoding of these claims.
message CapabilityClaims {
  string capability_id = 1;
  string audience = 2;
  CapabilityOperation operation = 3;
  string tenant_id = 4;
  string principal_id = 5;
  string session_id = 6;
  string resource_id = 7;
  string upload_id = 8;
  string payload_id = 9;
  uint64 part_number = 10;
  uint64 range_start = 11;
  uint64 range_end = 12;
  uint64 resource_acl_generation = 13;
  uint64 membership_generation = 14;
  uint64 namespace_generation = 15;
  uint64 fencing_token = 16;
  bytes nonce = 17;
  int64 issued_at_unix_seconds = 18;
  int64 expires_at_unix_seconds = 19;
  uint64 drive_acl_generation = 20;
  string grant_id = 21;
}

enum CapabilityOperation {
  CAPABILITY_OPERATION_UNSPECIFIED = 0;
  CAPABILITY_OPERATION_UPLOAD_PART = 1;
  CAPABILITY_OPERATION_FINALIZE_UPLOAD = 2;
  CAPABILITY_OPERATION_DOWNLOAD = 3;
  CAPABILITY_OPERATION_DELETE_PAYLOAD = 4;
  CAPABILITY_OPERATION_SCRUB_PAYLOAD = 5;
  CAPABILITY_OPERATION_WRITE_COLLABORATION_OBJECT = 6;
  CAPABILITY_OPERATION_FINALIZE_COLLABORATION_OBJECT = 7;
  CAPABILITY_OPERATION_READ_COLLABORATION_OBJECT = 8;
  // Read one immutable source version while an external document session is
  // active. The claims bind the exact version through payload_id and grant_id.
  CAPABILITY_OPERATION_READ_DOCUMENT_VERSION = 9;
  // Write one whole-object staging revision. The claims bind one revision
  // through grant_id and may not be reused for another revision.
  CAPABILITY_OPERATION_WRITE_DOCUMENT_REVISION = 10;
  // Finalize that same whole-object staging revision after its digest has been
  // verified by the I/O worker.
  CAPABILITY_OPERATION_FINALIZE_DOCUMENT_REVISION = 11;
}

message SignedCapability {
  uint32 key_generation = 1;
  bytes claims = 2;
  bytes signature = 3;
}

// Mount capabilities are intentionally a distinct fbcap2 envelope. They bind
// an adapter operation to one mount session, credential generation, Virtual
// ACL projection, gateway epoch, and optional immutable version/write session.
message MountCapabilityClaims {
  string capability_id = 1;
  string audience = 2;
  MountCapabilityOperation operation = 3;
  string tenant_id = 4;
  string principal_id = 5;
  string mount_session_id = 6;
  string credential_id = 7;
  string drive_id = 8;
  string resource_id = 9;
  string version_id = 10;
  string write_session_id = 11;
  uint64 range_start = 12;
  uint64 range_end = 13;
  uint64 credential_generation = 14;
  uint64 authorization_generation = 15;
  uint64 membership_generation = 16;
  uint64 drive_acl_generation = 17;
  uint64 namespace_generation = 18;
  uint64 resource_acl_generation = 19;
  uint64 gateway_epoch = 20;
  uint64 fencing_token = 21;
  bytes nonce = 22;
  int64 issued_at_unix_seconds = 23;
  int64 expires_at_unix_seconds = 24;
  string grant_id = 25;
  // Exact BLAKE3 digest of the WriteData request body. This is present only
  // for WRITE_DATA so a retried capability cannot authorize different bytes.
  bytes content_blake3 = 26;
}

enum MountCapabilityOperation {
  MOUNT_CAPABILITY_OPERATION_UNSPECIFIED = 0;
  MOUNT_CAPABILITY_OPERATION_READ = 1;
  // Legacy multiplexed write authority. New issuers and workers must reject
  // this value because its unsigned HTTP mode could substitute sparse
  // operations after signing.
  MOUNT_CAPABILITY_OPERATION_WRITE = 2 [deprecated = true];
  MOUNT_CAPABILITY_OPERATION_FLUSH = 3;
  MOUNT_CAPABILITY_OPERATION_FINALIZE = 4;
  MOUNT_CAPABILITY_OPERATION_ABORT = 5;
  MOUNT_CAPABILITY_OPERATION_DELETE_STAGING = 6;
  MOUNT_CAPABILITY_OPERATION_WRITE_DATA = 7;
  MOUNT_CAPABILITY_OPERATION_DEALLOCATE = 8;
  MOUNT_CAPABILITY_OPERATION_ALLOCATE = 9;
  MOUNT_CAPABILITY_OPERATION_SEEK_DATA = 10;
  MOUNT_CAPABILITY_OPERATION_SEEK_HOLE = 11;
}

message SignedMountCapability {
  uint32 key_generation = 1;
  bytes claims = 2;
  bytes signature = 3;
}
