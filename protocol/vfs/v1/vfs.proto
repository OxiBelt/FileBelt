syntax = "proto3";

package filebelt.vfs.v1;

// Protocol-neutral request envelope shared by mount adapters. No field carries
// a host path, host POSIX authority, SMB object, FTP daemon type, or payload
// locator; projected POSIX values remain compatibility metadata only.
message VfsRequest {
  uint32 protocol_version = 1;
  string request_id = 2;
  string tenant_id = 3;
  MountProtocol protocol = 4;
  string gateway_id = 5;
  uint64 gateway_epoch = 6;
  string session_id = 7;
  uint64 credential_generation = 8;
  uint64 authorization_generation = 9;
  NfsRequestContext nfs_context = 10;

  oneof operation {
    AuthenticateRequest authenticate = 20;
    ListRequest list = 21;
    StatRequest stat = 22;
    OpenRequest open = 23;
    ReadRequest read = 24;
    WriteRequest write = 25;
    FlushRequest flush = 26;
    CommitRequest commit = 27;
    CloseRequest close = 28;
    CreateRequest create = 29;
    MkdirRequest mkdir = 30;
    RenameRequest rename = 31;
    RemoveRequest remove = 32;
    SetAttributesRequest set_attributes = 33;
    LockRequest lock = 34;
    UnlockRequest unlock = 35;
    LeaseAcknowledgeRequest lease_acknowledge = 36;
    AllocatePassivePortRequest allocate_passive_port = 37;
    HeartbeatRequest heartbeat = 38;
    EndSessionRequest end_session = 39;
    GatewayHelloRequest gateway_hello = 40;
    NfsAuthenticateRequest nfs_authenticate = 41;
    GetXattrRequest get_xattr = 42;
    SetXattrRequest set_xattr = 43;
    ListXattrRequest list_xattr = 44;
    RemoveXattrRequest remove_xattr = 45;
    ReadlinkRequest readlink = 46;
    SymlinkRequest symlink = 47;
    SparseWriteRequest sparse_write = 48;
    ReclaimRequest reclaim = 49;
    OpenUnlinkedRequest open_unlinked = 50;
    ResolveHandleRequest resolve_handle = 51;
    ExportRootRequest export_root = 52;
    LookupRequest lookup = 53;
    AccessRequest access = 54;
    FilesystemInfoRequest filesystem_info = 55;
    GetAclRequest get_acl = 56;
    SetAclRequest set_acl = 57;
    SparseControlRequest sparse_control = 58;
    GatewayDrainRequest gateway_drain = 59;
    GatewayReconcileRequest gateway_reconcile = 60;
    TestLockRequest test_lock = 61;
  }
}

enum MountProtocol {
  MOUNT_PROTOCOL_UNSPECIFIED = 0;
  MOUNT_PROTOCOL_SMB = 1;
  MOUNT_PROTOCOL_FTPS = 2;
  MOUNT_PROTOCOL_NFS = 3;
}

enum AuthenticationScheme {
  AUTHENTICATION_SCHEME_UNSPECIFIED = 0;
  AUTHENTICATION_SCHEME_NTLMV2_RESPONSE = 1;
  // The ephemeral password is transported only inside the mTLS VFS request.
  // Core verifies it against an encrypted HMAC-derived verifier and never
  // persists it. The stable wire name describes the verifier, not a proof
  // computed by the gateway.
  AUTHENTICATION_SCHEME_PASSWORD_HMAC_SHA256 = 2;
}

message AuthenticateRequest {
  string username = 1;
  AuthenticationScheme scheme = 2;
  bytes exchange = 3;
  bytes channel_binding = 4;
  string source_address = 5;
  string device_id = 6;
}

message ListRequest {
  string drive_id = 1;
  string directory_id = 2;
  string cursor = 3;
  uint32 limit = 4;
  bytes directory_handle = 5;
}

message StatRequest {
  string drive_id = 1;
  string resource_id = 2;
  bytes persistent_handle = 3;
}

message OpenRequest {
  string drive_id = 1;
  string resource_id = 2;
  string expected_version_id = 3;
  repeated VfsAction requested_actions = 4;
  bool share_read = 5;
  bool share_write = 6;
  bool share_delete = 7;
  bytes persistent_handle = 8;
}

message ReadRequest {
  string handle_id = 1;
  uint64 offset = 2;
  uint64 length = 3;
}

message WriteRequest {
  string handle_id = 1;
  string write_session_id = 2;
  uint64 fencing_token = 3;
  uint64 offset = 4;
  bytes data = 5;
}

message FlushRequest {
  string handle_id = 1;
  string write_session_id = 2;
  uint64 fencing_token = 3;
}

message CommitRequest {
  string handle_id = 1;
  string write_session_id = 2;
  uint64 fencing_token = 3;
  string expected_head_version_id = 4;
}

message CloseRequest {
  string handle_id = 1;
}

message CreateRequest {
  string drive_id = 1;
  string parent_id = 2;
  string display_name = 3;
  uint64 expected_parent_generation = 4;
  repeated VfsAction requested_actions = 5;
  bytes parent_handle = 6;
  // Core applies 0644 when omitted. Special bits and client-supplied
  // ownership are never part of this operation.
  optional uint32 mode = 7;
}

message MkdirRequest {
  string drive_id = 1;
  string parent_id = 2;
  string display_name = 3;
  uint64 expected_parent_generation = 4;
  bytes parent_handle = 5;
  // Core applies 0755 when omitted. Special bits and client-supplied
  // ownership are never part of this operation.
  optional uint32 mode = 6;
}

message RenameRequest {
  string drive_id = 1;
  string resource_id = 2;
  string target_parent_id = 3;
  string target_display_name = 4;
  uint64 expected_namespace_generation = 5;
  bytes resource_handle = 6;
  bytes target_parent_handle = 7;
}

message RemoveRequest {
  string drive_id = 1;
  string resource_id = 2;
  uint64 expected_namespace_generation = 3;
  bool recursive = 4;
  bytes persistent_handle = 5;
}

message SetAttributesRequest {
  string drive_id = 1;
  string resource_id = 2;
  optional int64 modified_at_unix_seconds = 3;
  optional int64 accessed_at_unix_seconds = 4;
  optional bool read_only = 5;
  optional uint64 size_bytes = 6;
  optional uint32 mode = 7;
  optional uint64 projected_uid = 8;
  optional uint64 projected_gid = 9;
  optional string owner_name = 10;
  optional string group_name = 11;
  bytes persistent_handle = 12;
}

message LockRequest {
  string handle_id = 1;
  string owner_key = 2;
  uint64 offset = 3;
  uint64 length = 4;
  bool exclusive = 5;
  // A range extending through the current and every future EOF has no finite
  // length. Exactly one of `to_eof` or a non-zero finite `length` is valid.
  bool to_eof = 6;
}

// A read-only conflict query. It never acquires or releases a lock and must
// not be implemented as a Lock/Unlock pair.
message TestLockRequest {
  string handle_id = 1;
  string owner_key = 2;
  uint64 offset = 3;
  uint64 length = 4;
  bool exclusive = 5;
  bool to_eof = 6;
}

message UnlockRequest {
  string handle_id = 1;
  string lock_id = 2;
}

message LeaseAcknowledgeRequest {
  string handle_id = 1;
  string lease_id = 2;
  uint64 fencing_token = 3;
  LeaseState state = 4;
}

message AllocatePassivePortRequest {
  string source_address = 1;
  bytes binding_digest = 2;
}

message HeartbeatRequest {}

message EndSessionRequest {
  string reason_code = 1;
}

message GatewayHelloRequest {
  string shard_key = 1;
  string tenant_slug = 2;
  string boot_id = 3;
  NfsGatewayCompatibility nfs_compatibility = 4;
}

message GatewayDrainRequest {
  string boot_id = 1;
}

// A gateway sends this only after it has atomically installed and read back
// the complete desired export manifest returned by GatewayHello. Core accepts
// the acknowledgement only for the same live boot, epoch, and authority
// generations; partial application is never representable.
message GatewayReconcileRequest {
  string boot_id = 1;
  uint64 feature_generation = 2;
  uint64 export_generation = 3;
  bytes manifest_digest = 4;
  repeated NfsAppliedExport applied_exports = 5;
}

message NfsAppliedExport {
  uint64 export_id = 1;
  uint64 generation = 2;
  bytes root_handle_digest = 3;
}

message NfsGatewayCompatibility {
  uint32 minimum_protocol_version = 1;
  uint32 maximum_protocol_version = 2;
  repeated NfsGatewayFeature features = 3;
  string release_revision = 4;
  uint32 config_format = 5;
  uint32 authority_schema_revision = 6;
}

enum NfsGatewayFeature {
  NFS_GATEWAY_FEATURE_UNSPECIFIED = 0;
  NFS_GATEWAY_FEATURE_RPCSEC_GSS_PRIVACY = 1;
  NFS_GATEWAY_FEATURE_PERSISTENT_HANDLES = 2;
  NFS_GATEWAY_FEATURE_NFS4_ACL = 3;
  NFS_GATEWAY_FEATURE_SPARSE_FILES = 4;
  NFS_GATEWAY_FEATURE_XATTR = 5;
  NFS_GATEWAY_FEATURE_SYMLINK = 6;
}

// RPCSEC_GSS is authenticated by NFS-Ganesha. The FSAL/bridge forwards only
// its validated principal and a bounded binding digest; it never serializes a
// Kerberos ticket, keytab, AUTH_SYS UID/GID, or host identity to Core.
message NfsAuthenticateRequest {
  string kerberos_principal = 1;
  bytes gss_binding_digest = 2;
  // This is the immediate NFS transport peer. A relay peer address is
  // non-authoritative observability and conservative session-reuse input only.
  string source_address = 3;
  RpcsecGssProtection protection = 4;
  int64 context_expires_at_unix_seconds = 5;
}

enum RpcsecGssProtection {
  RPCSEC_GSS_PROTECTION_UNSPECIFIED = 0;
  RPCSEC_GSS_PROTECTION_PRIVACY = 1;
}

// Core consumes the NFSv4.1 slot/sequence tuple with the authenticated GSS
// binding. Only mutation callbacks carry request_digest; read-only callbacks
// must leave it empty.
message NfsRequestContext {
  bytes gss_binding_digest = 1;
  string client_id = 2;
  string nfs_session_id = 3;
  uint32 slot_id = 4;
  uint64 sequence_id = 5;
  uint32 operation_index = 6;
  bytes request_digest = 7;
}

message GetXattrRequest {
  string drive_id = 1;
  string resource_id = 2;
  string name = 3;
  bytes persistent_handle = 4;
}

message SetXattrRequest {
  string drive_id = 1;
  string resource_id = 2;
  string name = 3;
  bytes value = 4;
  bool create_only = 5;
  bool replace_only = 6;
  bytes persistent_handle = 7;
}

message ListXattrRequest {
  string drive_id = 1;
  string resource_id = 2;
  bytes persistent_handle = 3;
}

message RemoveXattrRequest {
  string drive_id = 1;
  string resource_id = 2;
  string name = 3;
  bytes persistent_handle = 4;
}

message ReadlinkRequest {
  string drive_id = 1;
  string resource_id = 2;
  bytes persistent_handle = 3;
}

message SymlinkRequest {
  string drive_id = 1;
  string parent_id = 2;
  string display_name = 3;
  string target = 4;
  uint64 expected_parent_generation = 5;
  bytes parent_handle = 6;
  // Core applies 0777 when omitted. Special bits and client-supplied
  // ownership are never part of this operation.
  optional uint32 mode = 7;
}

// Sparse extents are explicit so an all-zero range is never inferred from a
// transport truncation. The final `CommitRequest` remains the only version
// publication boundary.
message SparseWriteRequest {
  string handle_id = 1;
  string write_session_id = 2;
  uint64 fencing_token = 3;
  uint64 offset = 4;
  uint64 length = 5;
  bytes data = 6;
  bool hole = 7;
}

message ReclaimRequest {
  string client_id = 1;
  string state_id = 2;
  uint64 gateway_epoch = 3;
}

message OpenUnlinkedRequest {
  string handle_id = 1;
  string write_session_id = 2;
  uint64 fencing_token = 3;
}

message ResolveHandleRequest {
  bytes persistent_handle = 1;
}

message ExportRootRequest {
  uint64 export_id = 1;
}

message LookupRequest {
  bytes parent_handle = 1;
  string display_name = 2;
}

message AccessRequest {
  bytes persistent_handle = 1;
  repeated VfsAction requested_actions = 2;
}

message FilesystemInfoRequest {
  uint64 export_id = 1;
}

message GetAclRequest {
  bytes persistent_handle = 1;
}

message SetAclRequest {
  bytes persistent_handle = 1;
  VfsAcl acl = 2;
  uint64 expected_acl_generation = 3;
}

message SparseControlRequest {
  string handle_id = 1;
  SparseControlKind kind = 2;
  uint64 offset = 3;
  uint64 length = 4;
}

enum SparseControlKind {
  SPARSE_CONTROL_KIND_UNSPECIFIED = 0;
  SPARSE_CONTROL_KIND_SEEK_DATA = 1;
  SPARSE_CONTROL_KIND_SEEK_HOLE = 2;
  SPARSE_CONTROL_KIND_ALLOCATE = 3;
  SPARSE_CONTROL_KIND_DEALLOCATE = 4;
}

enum VfsAction {
  VFS_ACTION_UNSPECIFIED = 0;
  VFS_ACTION_READ_METADATA = 1;
  VFS_ACTION_READ_CONTENT = 2;
  VFS_ACTION_CREATE_CHILD = 3;
  VFS_ACTION_WRITE_CONTENT = 4;
  VFS_ACTION_DELETE = 5;
  VFS_ACTION_RENAME = 6;
  VFS_ACTION_MOVE = 7;
  VFS_ACTION_WRITE_METADATA = 8;
  VFS_ACTION_MANAGE_LOCK = 9;
  VFS_ACTION_LIST_CHILDREN = 10;
  VFS_ACTION_TRAVERSE = 11;
  VFS_ACTION_MANAGE_ACL = 12;
}

enum LeaseState {
  LEASE_STATE_UNSPECIFIED = 0;
  LEASE_STATE_GRANTED = 1;
  LEASE_STATE_BREAKING = 2;
  LEASE_STATE_BROKEN = 3;
  LEASE_STATE_RELEASED = 4;
}

message VfsResponse {
  uint32 protocol_version = 1;
  string request_id = 2;
  VfsError error = 3;
  string reason_code = 4;
  string session_id = 5;
  string handle_id = 6;
  string write_session_id = 7;
  string lock_id = 8;
  string lease_id = 9;
  string version_id = 10;
  uint64 credential_generation = 11;
  uint64 authorization_generation = 12;
  uint64 fencing_token = 13;
  uint32 passive_port = 14;
  bytes data = 15;
  NodeAttributes attributes = 16;
  repeated DirectoryEntry entries = 17;
  string next_cursor = 18;
  uint64 gateway_epoch = 19;
  bytes xattr_value = 20;
  repeated string xattr_names = 21;
  string symlink_target = 22;
  string state_id = 23;
  string resource_id = 24;
  bytes persistent_handle = 25;
  uint64 export_id = 26;
  NfsGatewayHelloResponse nfs_gateway_hello = 27;
  FilesystemInfo filesystem_info = 28;
  VfsAcl acl = 29;
  uint64 sparse_offset = 30;
  bool end_of_file = 31;
  repeated VfsAction allowed_actions = 32;
  NfsSessionProjection nfs_session_projection = 33;
  // A successful TestLock sets this only when a conflict exists. A mutating
  // Lock may also include it with VFS_ERROR_LOCK_CONFLICT.
  LockConflict lock_conflict = 34;
}

message LockConflict {
  uint64 offset = 1;
  uint64 length = 2;
  bool exclusive = 3;
  bool to_eof = 4;
}

message DirectoryEntry {
  string resource_id = 1;
  string display_name = 2;
  NodeAttributes attributes = 3;
  bytes persistent_handle = 4;
}

message NodeAttributes {
  NodeKind kind = 1;
  uint64 size_bytes = 2;
  string head_version_id = 3;
  uint64 namespace_generation = 4;
  uint64 acl_generation = 5;
  int64 modified_at_unix_seconds = 6;
  bool read_only = 7;
  uint32 mode = 8;
  uint64 projected_uid = 9;
  uint64 projected_gid = 10;
  uint32 link_count = 11;
  bool sparse = 12;
  int64 accessed_at_unix_seconds = 13;
  int64 created_at_unix_seconds = 14;
  int64 changed_at_unix_seconds = 15;
  string owner_name = 16;
  string group_name = 17;
}

enum NodeKind {
  NODE_KIND_UNSPECIFIED = 0;
  NODE_KIND_FILE = 1;
  NODE_KIND_DIRECTORY = 2;
  NODE_KIND_SYMLINK = 3;
}

message NfsGatewayHelloResponse {
  string tenant_id = 1;
  uint64 feature_generation = 2;
  uint64 export_generation = 3;
  uint32 lease_seconds = 4;
  repeated NfsExportManifestEntry active_exports = 5;
}

message NfsExportManifestEntry {
  uint64 export_id = 1;
  string drive_id = 2;
  string export_path = 3;
  uint64 generation = 4;
  bytes root_handle = 5;
  bool read_only = 6;
}

// Core selects this immutable projection while authenticating an NFS session.
// The gateway uses it only to construct the Ganesha credential; numeric IDs
// and POSIX names never replace the session fence or Virtual ACL checks.
message NfsSessionProjection {
  string posix_name = 1;
  string primary_group_name = 2;
  uint64 projected_uid = 3;
  uint64 projected_gid = 4;
  uint64 mapping_generation = 5;
  uint64 feature_generation = 6;
  int64 absolute_expires_at_unix_seconds = 7;
  repeated uint64 allowed_export_ids = 8;
}

message FilesystemInfo {
  uint64 total_bytes = 1;
  uint64 free_bytes = 2;
  uint64 available_bytes = 3;
  uint64 total_files = 4;
  uint64 free_files = 5;
  uint64 maximum_file_size = 6;
  uint32 maximum_name_bytes = 7;
  uint32 preferred_io_bytes = 8;
  bool supports_sparse_files = 9;
  bool supports_acl = 10;
  bool supports_xattr = 11;
}

message VfsAcl {
  AclRepresentation representation = 1;
  uint64 generation = 2;
  repeated VfsAclEntry entries = 3;
}

enum AclRepresentation {
  ACL_REPRESENTATION_UNSPECIFIED = 0;
  ACL_REPRESENTATION_TAGGED = 1;
  ACL_REPRESENTATION_SYNTHESIZED = 2;
}

message VfsAclEntry {
  AclEntryType entry_type = 1;
  AclPrincipalKind principal_kind = 2;
  string principal = 3;
  repeated VfsAction actions = 4;
  AclInheritance inheritance = 5;
  bool inherited = 6;
}

enum AclEntryType {
  ACL_ENTRY_TYPE_UNSPECIFIED = 0;
  ACL_ENTRY_TYPE_ALLOW = 1;
  ACL_ENTRY_TYPE_DENY = 2;
}

enum AclPrincipalKind {
  ACL_PRINCIPAL_KIND_UNSPECIFIED = 0;
  ACL_PRINCIPAL_KIND_OWNER = 1;
  ACL_PRINCIPAL_KIND_OWNER_GROUP = 2;
  ACL_PRINCIPAL_KIND_EVERYONE = 3;
  ACL_PRINCIPAL_KIND_NAMED_USER = 4;
  ACL_PRINCIPAL_KIND_NAMED_GROUP = 5;
}

enum AclInheritance {
  ACL_INHERITANCE_UNSPECIFIED = 0;
  ACL_INHERITANCE_THIS_RESOURCE = 1;
  ACL_INHERITANCE_CHILDREN = 2;
  ACL_INHERITANCE_DESCENDANTS = 3;
}

// Stable errors are intentionally smaller than any adapter-native status set.
// Adapters own the reviewed mapping to NTSTATUS or FTP reply codes.
enum VfsError {
  VFS_ERROR_UNSPECIFIED = 0;
  VFS_ERROR_OK = 1;
  VFS_ERROR_INVALID_REQUEST = 2;
  VFS_ERROR_UNAUTHENTICATED = 3;
  VFS_ERROR_ACCESS_DENIED = 4;
  VFS_ERROR_NOT_FOUND = 5;
  VFS_ERROR_ALREADY_EXISTS = 6;
  VFS_ERROR_NOT_DIRECTORY = 7;
  VFS_ERROR_IS_DIRECTORY = 8;
  VFS_ERROR_DIRECTORY_NOT_EMPTY = 9;
  VFS_ERROR_NAME_INVALID = 10;
  VFS_ERROR_CONFLICT = 11;
  VFS_ERROR_STALE_GENERATION = 12;
  VFS_ERROR_LOCK_CONFLICT = 13;
  VFS_ERROR_LEASE_BREAK_REQUIRED = 14;
  VFS_ERROR_QUOTA_EXCEEDED = 15;
  VFS_ERROR_STORAGE_UNAVAILABLE = 16;
  VFS_ERROR_RATE_LIMITED = 17;
  VFS_ERROR_NOT_SUPPORTED = 18;
  VFS_ERROR_UNAVAILABLE = 19;
}
