
# cargo-vet audits file

[criteria.filebelt-constrained-deployment]
description = """
The crate is acceptable in FileBelt's deployed dependency graph only under the
documented call-path, feature, and input constraints in its audit note. This
criterion does not certify generic safe-to-deploy use.
"""
implies = "safe-to-run"

[[audits.arc-swap]]
who = "OpenAI Codex"
criteria = "safe-to-deploy"
version = "1.9.2"
notes = "Reviewed complete checksum-matched source and the default feature. It has no build script or ambient I/O. Its raw-pointer debt and reference-count paths preserve ownership through the sealed standard Arc/Rc implementations; FileBelt reaches it only through Yrs using standard Arc values, not a custom unsafe RefCnt implementation. Contention can affect availability but does not provide an untrusted memory-safety or authority boundary bypass."

[[audits.async-lock]]
who = "OpenAI Codex"
criteria = "safe-to-deploy"
version = "3.4.2"
notes = "Reviewed complete checksum-matched source with the default std feature. It has no build script, filesystem, network, or process authority. Its UnsafeCell, guard lifetime, and atomic reader/writer transitions keep mutation behind acquired locks; misuse-capable raw operations are internal or explicitly unsafe. An untrusted workload can cause ordinary lock contention but cannot obtain a second mutable reference through the safe API."

[[audits.cmpv2]]
who = "OpenAI Codex"
criteria = "safe-to-deploy"
version = "0.2.0"
notes = "Reviewed complete checksum-matched source. The safe DER message types preserve reader length and tag checks, contain no build script or ambient I/O, and the CRMF dependency is separately constrained because FileBelt never reaches its encoding API."

[[audits.cms]]
who = "OpenAI Codex"
criteria = "safe-to-deploy"
version = "0.2.3"
notes = "Reviewed complete checksum-matched source. It is safe DER/CMS structure parsing with bounded-reader enforcement, no build script, no unsafe code, and no ambient I/O; cryptographic verification remains the caller's responsibility."

[[audits.crmf]]
who = "OpenAI Codex"
criteria = "filebelt-constrained-deployment"
version = "0.2.0"
notes = "Reviewed complete checksum-matched source. EncKeyWithIdChoice::tag recursively calls itself for GeneralName and can stack overflow if that public variant is encoded. FileBelt reaches CRMF only through dormant Sigstore TSA type dependencies, disallows TSA bundles, and never calls CRMF decoding or encoding."

[[audits.defmt]]
who = "OpenAI Codex"
criteria = "safe-to-deploy"
version = "1.1.1"
notes = "Reviewed complete checksum-matched source. It is lock-only for FileBelt targets; the build script copies a packaged linker script only to OUT_DIR, and runtime unsafe code implements the documented embedded logger ABI with input-bounded encoding."

[[audits.defmt-macros]]
who = "OpenAI Codex"
criteria = "safe-to-deploy"
version = "1.1.1"
notes = "Reviewed complete checksum-matched proc-macro source. It is lock-only, reads compiler tokens and Cargo logging variables only, performs no filesystem, network, or process access, and generated unsafe calls preserve defmt's logger contract."

[[audits.defmt-parser]]
who = "OpenAI Codex"
criteria = "safe-to-deploy"
version = "1.0.0"
notes = "Reviewed complete checksum-matched source. It is lock-only pure safe compile-time parsing with work proportional to trusted format strings; malformed huge indices can affect compilation but no runtime input reaches it."

[[audits.der_derive]]
who = "OpenAI Codex"
criteria = "safe-to-deploy"
version = "0.7.3"
notes = "Reviewed complete checksum-matched proc-macro source. It forbids unsafe code, has no ambient I/O, and generated decoders preserve DER reader nesting, length checks, and unknown-choice rejection."

[[audits.dtoa]]
who = "OpenAI Codex"
criteria = "safe-to-deploy"
version = "1.0.11"
notes = "Reviewed complete checksum-matched source. Formatting uses a fixed 25-byte buffer with bounds derived from IEEE-754 inputs, has no build script or ambient I/O, and FileBelt reaches it only through metrics formatting."

[[audits.flagset]]
who = "OpenAI Codex"
criteria = "safe-to-deploy"
version = "0.4.7"
notes = "Reviewed complete checksum-matched no_std source. It has no build script or ambient I/O; unsafe construction documents the valid-bit precondition, while macro-generated and DER-decoded uses satisfy it through static declarations and checked construction."

[[audits.jiff-tzdb]]
who = "OpenAI Codex"
criteria = "safe-to-deploy"
version = "0.1.8"
notes = "Reviewed complete checksum-matched no_std source and embedded TZDB 2026c. All 598 case-insensitively sorted names and byte ranges were validated against the exact 202414-byte blob; the crate has no build script, unsafe code, or ambient I/O."

[[audits.jiff-tzdb-platform]]
who = "OpenAI Codex"
criteria = "safe-to-deploy"
