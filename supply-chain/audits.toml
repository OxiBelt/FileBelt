[[audits.opentelemetry_sdk]]
who = "OpenAI Codex"
criteria = "safe-to-deploy"
version = "0.31.0"
notes = "Reviewed complete checksum-matched source. It uses OS-random identifiers and a dedicated bounded batch thread without unsafe code or a build script; FileBelt caps the queue at 1024, batch at 256, delay at five seconds, and HTTP at three seconds."

[[audits.opentelemetry_sdk]]
who = "OpenAI Codex"
criteria = "safe-to-deploy"
version = "0.32.1"
notes = "Reviewed complete checksum-matched source with the resolved trace and metrics features. The W3C Baggage propagator rejects headers above 8192 bytes before parsing and caps extraction at 64 members, fixing GHSA-w9wp-h8wv-79jx; FileBelt installs no inbound propagator. The crate has no build script or unsafe code, uses OS-random trace identifiers and bounded synchronous batch channels, and FileBelt caps the queue at 1024, batch at 256, delay at five seconds, and HTTP at three seconds."

[[audits.portable-atomic-util]]
who = "OpenAI Codex"
criteria = "safe-to-deploy"
version = "0.2.7"
notes = "Reviewed complete checksum-matched source, build script, and std-derived Arc, Weak, and RawWaker unsafe contracts. It is target-only for platforms without pointer atomics and is absent from FileBelt's Linux amd64, arm64, and riscv64 builds."

[[audits.prometheus-client]]
who = "OpenAI Codex"
criteria = "safe-to-deploy"
version = "0.24.0"
notes = "Reviewed complete checksum-matched source and selected empty default features. It forbids unsafe code and has no runtime I/O; the protobuf build path is unselected, FileBelt labels are bounded and static, and FileBelt does not use exemplars."

[[audits.prometheus-client-derive-encode]]
who = "OpenAI Codex"
criteria = "safe-to-deploy"
