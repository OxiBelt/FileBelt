[[audits.tracing-opentelemetry]]
who = "OpenAI Codex"
criteria = "safe-to-deploy"
version = "0.33.0"
notes = "Reviewed complete checksum-matched source with default metrics and tracing-log features disabled. TypeId-checked downcast_raw implementations return only valid self/function pointers or delegate to the inner layer, preserving subscriber lifetimes. The crate has no build script or ambient filesystem, process, or network I/O."

[[audits.tracing-serde]]
who = "OpenAI Codex"
criteria = "safe-to-deploy"
version = "0.2.0"
notes = "Reviewed complete checksum-matched source. It performs pure caller-driven tracing metadata and field serialization with no unsafe code, build script, or ambient I/O."

[[audits.tungstenite]]
who = "OpenAI Codex"
criteria = "safe-to-deploy"
version = "0.29.0"
notes = "Reviewed complete checksum-matched source with the locked handshake features. It has no build script. UTF-8 unchecked conversions follow validation of the retained byte prefix, and masking uses alignment-safe slices; protocol input is length-checked before frame allocation and state transitions reject invalid handshakes. Stream I/O is supplied by the caller and carries no ambient credentials or authority."

[[audits.x509-cert]]
who = "OpenAI Codex"
criteria = "safe-to-deploy"
version = "0.2.5"
notes = "Reviewed complete checksum-matched DER certificate and extension types. Safe decoders retain length and tag checks, the crate has no build script or ambient I/O, and signature and trust decisions remain explicit caller operations."

[[audits.x509-tsp]]
who = "OpenAI Codex"
criteria = "safe-to-deploy"
version = "0.1.0"
notes = "Reviewed complete checksum-matched safe DER timestamp-protocol structures. It has no build script, unsafe code, or ambient I/O; FileBelt rejects TSA material, so its CMP/CRMF dependency path is compiled but never reached."

[[audits.yrs]]
who = "OpenAI Codex"
criteria = "safe-to-deploy"
version = "0.27.3"
notes = "Reviewed complete checksum-matched source with default features only; sync and weak features are unselected. It has no build script or ambient I/O. The CRDT's pointer, interior-mutability, and transaction unsafe blocks retain ownership in document/block-store lifetimes, while decoder unchecked UTF-8 follows validated wire-string reads. FileBelt additionally bounds each yjs-v1 group to 2 MiB and chunk to 256 KiB, serializes durable ordering through fenced PostgreSQL manifests, and does not expose Yrs raw-pointer APIs to untrusted callers."
