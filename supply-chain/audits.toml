who = "OpenAI Codex"
criteria = "safe-to-deploy"
version = "0.29.0"
notes = "Reviewed complete checksum-matched source with default connect, handshake, and stream features. It has no build script or unsafe code. Network connections are opened only through explicit caller-supplied Tokio streams or the optional connect API; FileBelt uses the Axum WebSocket server path behind OxiBelt. Framing and protocol parsing delegate to the separately audited Tungstenite crate."

