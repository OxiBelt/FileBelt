
# cargo-vet audits file

[criteria.filebelt-constrained-deployment]
description = """
The crate is acceptable in FileBelt's deployed dependency graph only under the
documented call-path, feature, and input constraints in its audit note. This
criterion does not certify generic safe-to-deploy use.
"""
implies = "safe-to-run"

[[audits.arbitrary]]
who = "OpenAI Codex"
criteria = "safe-to-run"
version = "1.4.2"
notes = "Reviewed complete checksum-matched source with the default feature set; the derive feature and its proc macro are unselected. It has no build script or ambient filesystem, network, environment, or process access. Input consumption is bounded by the supplied slice. Array initialization tracks and drops exactly the initialized prefix on error, UTF-8 unchecked construction follows a successful validation prefix, and CString unchecked construction follows removal of every NUL byte. Caller-invalid empty ranges and ratios can panic as documented, but libfuzzer-sys uses only the byte-slice target form in FileBelt. This dependency is test-only and never enters a deployed graph."

[[audits.arc-swap]]
who = "OpenAI Codex"
criteria = "safe-to-deploy"
version = "1.9.2"
notes = "Reviewed complete checksum-matched source and the default feature. It has no build script or ambient I/O. Its raw-pointer debt and reference-count paths preserve ownership through the sealed standard Arc/Rc implementations; FileBelt reaches it only through Yrs using standard Arc values, not a custom unsafe RefCnt implementation. Contention can affect availability but does not provide an untrusted memory-safety or authority boundary bypass."

[[audits.async-lock]]
who = "OpenAI Codex"
criteria = "safe-to-deploy"
version = "3.4.2"
notes = "Reviewed complete checksum-matched source with the default std feature. It has no build script, filesystem, network, or process authority. Its UnsafeCell, guard lifetime, and atomic reader/writer transitions keep mutation behind acquired locks; misuse-capable raw operations are internal or explicitly unsafe. An untrusted workload can cause ordinary lock contention but cannot obtain a second mutable reference through the safe API."

