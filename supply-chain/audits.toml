[[audits.reqwest]]
who = "OpenAI Codex"
criteria = "safe-to-deploy"
version = "0.13.4"
notes = "Reviewed complete checksum-matched source with blocking, form, json, and rustls-no-provider selected across the OTLP and Sigstore graph; default system-proxy, decompression, streaming, and cookie features are absent. Blocking buffer-initialization and connector ReadBuf unsafe preserve their initialized-byte invariants. Although the feature compiles the platform verifier, FileBelt's OTLP client injects an AWS-LC Rustls configuration containing only embedded WebPKI roots plus the optional operator CA, disables proxies and redirects, and applies a three-second timeout; FileBelt does not instantiate Sigstore's online clients."

[[audits.rmcp]]
who = "OpenAI Codex"
criteria = "safe-to-deploy"
version = "3.1.1"
notes = "Reviewed complete checksum-matched source with default features disabled. FileBelt uses bounded model response types only and the crate has no runtime unsafe code. Its build script can set core.hooksPath only in a special vendored repository layout, which is absent from the registry layout and FileBelt builds."

[[audits.ryu-js]]
who = "OpenAI Codex"
criteria = "safe-to-deploy"
version = "1.0.3"
notes = "Reviewed complete checksum-matched formatting source. It uses fixed-size buffers and sealed IEEE-754 traits with no build script, allocation, or ambient I/O; FileBelt does not directly call its documented unsafe raw-buffer APIs."

[[audits.serde_json_canonicalizer]]
who = "OpenAI Codex"
criteria = "safe-to-deploy"
version = "0.3.2"
notes = "Reviewed complete checksum-matched source. It recursively buffers and sorts input and casts integers through binary64, so FileBelt's sole wrapper recursively rejects integers outside the I-JSON safe range before every security-sensitive canonicalization; direct arbitrary-Value use is prohibited."

[[audits.sigstore-bundle]]
who = "OpenAI Codex"
criteria = "safe-to-deploy"
version = "0.11.0"
notes = "Reviewed complete checksum-matched source. It is safe structural bundle parsing with no build script or ambient I/O; FileBelt applies a four-MiB outer bound, rejects TSA material, and validates the exact Rekor entry and identity before use."

[[audits.sigstore-crypto]]
who = "OpenAI Codex"
criteria = "safe-to-deploy"
version = "0.11.0"
notes = "Reviewed complete checksum-matched source and cryptographic dispatch. Algorithm and key parsing are explicit, verification errors fail closed, unsafe code is absent, and the crate has no build script or ambient I/O."

[[audits.sigstore-merkle]]
who = "OpenAI Codex"
criteria = "safe-to-deploy"
version = "0.11.0"
notes = "Reviewed complete checksum-matched source. Inclusion verification uses checked tree arithmetic and fixed cryptographic hashes over caller-provided bounded data, with no unsafe code, build script, or ambient I/O."

[[audits.sigstore-rekor]]
who = "OpenAI Codex"
criteria = "safe-to-deploy"
version = "0.11.0"
notes = "Reviewed complete checksum-matched source. Offline Rekor body, promise, and proof verification binds log ID, body, index, and integrated time and fails closed; online client paths are not instantiated by FileBelt."

[[audits.sigstore-trust-root]]
who = "OpenAI Codex"
criteria = "safe-to-deploy"
version = "0.11.0"
notes = "Reviewed complete checksum-matched source as a trust-root parser and selector. It has no unsafe code or build script; FileBelt does not rely on its pooled validity selection and instead requires one explicitly bounded authority per purpose and checks the authenticated time itself."

[[audits.sigstore-tsa]]
who = "OpenAI Codex"
criteria = "safe-to-deploy"
version = "0.11.0"
notes = "Reviewed complete checksum-matched source. Timestamp parsing and signature verification fail closed when supplied correctly associated roots; FileBelt rejects all TSA material before calling the verifier, and online timestamp clients are not instantiated."

[[audits.sigstore-types]]
who = "OpenAI Codex"
criteria = "safe-to-deploy"
version = "0.11.0"
notes = "Reviewed complete checksum-matched generated and handwritten types. They contain no unsafe code, build script, or ambient I/O; FileBelt bounds documents before decoding and validates cardinality, identity, digest, and time semantics separately."

[[audits.sigstore-verify]]
who = "OpenAI Codex"
criteria = "filebelt-constrained-deployment"
version = "0.11.0"
notes = "Reviewed complete checksum-matched defaults-off source. Generic authority pools do not associate every validFor window with the selected Fulcio, CT, or TSA material. FileBelt's only caller requires one bounded Fulcio, Rekor, and CT authority, no TSA, one authenticated Rekor v1 event with the exact log ID, and the selected integrated time inside all three windows."

[[audits.smallstr]]
who = "OpenAI Codex"
criteria = "safe-to-deploy"
version = "0.3.1"
notes = "Reviewed complete checksum-matched source with the union feature selected by Yrs. It has no build script or ambient I/O. Unsafe UTF-8, slice, and union operations remain behind checked string construction and character-boundary calculations; the two unchecked public constructors require an explicit unsafe caller contract and are not used by FileBelt."

[[audits.tls_codec]]
who = "OpenAI Codex"
criteria = "safe-to-deploy"
version = "0.4.2"
notes = "Reviewed complete checksum-matched source. It has no unsafe code, build script, or ambient I/O. Generic Read byte-vector decoders can allocate a declared u32 length, while FileBelt's Sigstore SCT path uses slice decoding only after the four-MiB bundle bound."

[[audits.tls_codec_derive]]
who = "OpenAI Codex"
