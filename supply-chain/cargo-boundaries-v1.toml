schema_version = 1

[repository]
production_source_roots = [
  "source/src",
  "source/apps",
  "source/crates",
  "adapters",
]
excluded_source_roots = [
  "protocol/generated/rust",
  "tests",
  "fuzz",
  "tests/unsafe-harness",
]
apache_manifest_roots = [
  "source/Cargo.toml",
  "source/apps",
  "source/crates",
]
adapter_root = "adapters"
# Adding an adapter manifest requires an explicit, license-reviewed registration.
registered_adapter_manifests = [
  "adapters/ftp-ftps/Cargo.toml",
  "adapters/onlyoffice/Cargo.toml",
  "adapters/smb/Cargo.toml",
]

