# Rust paths use identifier spelling, so Cargo package hyphens become underscores.
[[source_boundaries]]
label = "Apache packages cannot import adapter implementation namespaces"
packages = [
  "filebelt",
  "filebelt-api",
  "filebelt-authz",
  "filebelt-build-identity",
  "filebelt-collaboration",
  "filebelt-collaboration-protocol",
  "filebelt-control-protocol",
  "filebelt-controller",
  "filebelt-database",
  "filebelt-deployment-diagnostics",
  "filebelt-document",
  "filebelt-document-protocol",
  "filebelt-domain",
  "filebelt-events-protocol",
  "filebelt-headscale-sync",
  "filebelt-mcp-broker",
  "filebelt-mcp-policy",
  "filebelt-media-controller",
  "filebelt-runtime",
  "filebelt-secret-vault",
  "filebelt-storage",
  "filebelt-storage-protocol",
  "filebelt-vfs-protocol",
  "filebelt-vfs",
  "filebelt-worker-io",
  "filebelt-worker-maintenance",
  "filebeltctl",
]
forbidden_paths = ["adapters"]

[[source_boundaries]]
label = "domain and authorization remain infrastructure independent"
packages = ["filebelt-authz", "filebelt-domain"]
forbidden_paths = [
  "async_std",
  "axum",
  "diesel",
  "http",
  "http_body",
  "hyper",
  "iggy",
  "k8s_openapi",
  "kube",
  "oauth2",
  "openidconnect",
  "postgres",
  "reqwest",
  "rusqlite",
  "smol",
  "sqlx",
  "std::fs",
  "std::net",
  "std::process",
  "tokio",
  "tokio_postgres",
  "tower",
]

[[source_boundaries]]
label = "database repository cannot depend on authorization or applications"
packages = ["filebelt-database"]
forbidden_paths = [
  "filebelt_api",
  "filebelt_authz",
  "filebelt_controller",
  "filebelt_document",
  "filebelt_mcp_broker",
  "filebelt_media_controller",
  "filebelt_worker_io",
  "filebelt_worker_maintenance",
  "filebeltctl",
]

[[source_boundaries]]
label = "API cannot absorb storage mechanics or workers"
packages = ["filebelt-api"]
forbidden_paths = [
  "filebelt_storage",
  "filebelt_worker_io",
  "filebelt_worker_maintenance",
]

[[source_boundaries]]
label = "workers and collaboration cannot absorb API authentication or sessions"
packages = [
  "filebelt-collaboration",
  "filebelt-worker-io",
  "filebelt-worker-maintenance",
]
forbidden_paths = [
  "filebelt_api",
  "filebelt_authz",
  "oauth2",
  "openidconnect",
]

[[source_boundaries]]
label = "protocol packages remain transport and persistence neutral"
packages = [
  "filebelt-document-protocol",
  "filebelt-collaboration-protocol",
  "filebelt-events-protocol",
  "filebelt-storage-protocol",
  "filebelt-vfs-protocol",
]
forbidden_paths = [
  "iggy",
  "k8s_openapi",
  "kube",
  "sqlx",
  "std::fs",
]

[[source_boundaries]]
label = "ONLYOFFICE adapter remains outside core and adapter implementations"
packages = ["filebelt-onlyoffice-adapter"]
forbidden_paths = [
  "filebelt_api",
  "filebelt_authz",
  "filebelt_control_protocol",
  "filebelt_database",
  "filebelt_document",
  "filebelt_ftp_ftps_gateway",
  "filebelt_smb_bridge",
  "filebelt_runtime",
  "filebelt_storage",
  "filebelt_vfs",
  "filebelt_worker_io",
  "filebelt_worker_maintenance",
]

