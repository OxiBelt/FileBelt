
# cargo-vet config file

[cargo-vet]
version = "0.10"

[imports.bytecode-alliance]
url = "https://raw.githubusercontent.com/bytecodealliance/wasmtime/main/supply-chain/audits.toml"

[imports.embark-studios]
url = "https://raw.githubusercontent.com/EmbarkStudios/rust-ecosystem/main/audits.toml"

[imports.google]
url = "https://raw.githubusercontent.com/google/supply-chain/main/audits.toml"

[imports.isrg]
url = "https://raw.githubusercontent.com/divviup/libprio-rs/main/supply-chain/audits.toml"

[imports.mozilla]
url = "https://raw.githubusercontent.com/mozilla/supply-chain/main/audits.toml"

[imports.oxibelt]
url = "https://raw.githubusercontent.com/OxiBelt/OxiBelt/main/supply-chain/audits.toml"

[imports.zcash]
url = "https://raw.githubusercontent.com/zcash/rust-ecosystem/main/supply-chain/audits.toml"

[policy."cmpv2:0.2.0"]
dependency-criteria = { crmf = "filebelt-constrained-deployment" }
notes = "The CRMF encoding surface with the known GeneralName recursion is unreachable from FileBelt's no-TSA controller path."

[policy."crmf:0.2.0"]
notes = "The constrained criterion applies only to dormant CRMF code; its direct dependencies retain the standard deployment requirement."

[policy."crmf:0.2.0".dependency-criteria]
cms = "safe-to-deploy"
der = "safe-to-deploy"
spki = "safe-to-deploy"
x509-cert = "safe-to-deploy"

[policy.filebelt-controller]
dependency-criteria = { sigstore-verify = "filebelt-constrained-deployment" }
notes = "The controller is the sole sigstore-verify caller and enforces FileBelt's bounded offline trust profile before accepting a runner catalog entry."

[policy.filebelt-fuzz]
dependency-criteria = { libfuzzer-sys = "safe-to-run" }
notes = "The native libFuzzer runtime is test-only and never enters a deployed FileBelt dependency graph."

[policy."sigstore-verify:0.11.0"]
notes = "The constrained verifier criterion applies only to sigstore-verify itself; its direct dependencies retain the standard deployment requirement."

[policy."sigstore-verify:0.11.0".dependency-criteria]
base64 = "safe-to-deploy"
cms = "safe-to-deploy"
const-oid = "safe-to-deploy"
hex = "safe-to-deploy"
jiff = "safe-to-deploy"
pem = "safe-to-deploy"
rustls-pki-types = "safe-to-deploy"
rustls-webpki = "safe-to-deploy"
serde = "safe-to-deploy"
serde_json = "safe-to-deploy"
serde_json_canonicalizer = "safe-to-deploy"
sigstore-bundle = "safe-to-deploy"
sigstore-crypto = "safe-to-deploy"
sigstore-merkle = "safe-to-deploy"
sigstore-rekor = "safe-to-deploy"
sigstore-trust-root = "safe-to-deploy"
sigstore-tsa = "safe-to-deploy"
sigstore-types = "safe-to-deploy"
thiserror = "safe-to-deploy"
tls_codec = "safe-to-deploy"
tracing = "safe-to-deploy"
x509-cert = "safe-to-deploy"

