notes = "Reviewed the complete checksum-matched 1.11.0 source and the 1.10.1-to-1.11.0 delta; the changed HTTP/1 parser removes Content-Length and disables keep-alive when Transfer-Encoding is present, changed ReadBufCursor methods preserve initialized-length and capacity invariants, and the remaining unsafe edits are equivalent pointer casts or existing guarded header/index operations. OxiBelt adds a bounded pre-parser guard that retains its stricter rejection policy before service dispatch."

