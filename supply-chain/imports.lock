[[audits.oxibelt.audits.android_system_properties]]
who = "OpenAI Codex"
criteria = "safe-to-deploy"
delta = "0.1.5 -> 0.1.6"
notes = "Reviewed the complete checksum-matched 0.1.5-to-0.1.6 source delta. The Android property callback now uses the correct extern C ABI and void return, carries an Option<String> cookie, documents its pointer invariants, and maps invalid UTF-8 to None instead of unwinding through FFI. The fallback buffer still consumes only the length initialized by __system_property_get; no build script or new external capability was added."

[[audits.oxibelt.audits.anyhow]]
who = "OpenAI Codex"
criteria = "safe-to-deploy"
version = "1.0.104"
notes = "Reviewed complete 1.0.104 source and the 1.0.103 delta; error-erasure, downcast, pointer-ownership, and formatting-buffer unsafe invariants are contained, the build script only performs a Cargo-rustc probe in OUT_DIR, and the source delta is documentation-only."

[[audits.oxibelt.audits.aws-lc-fips-sys]]
who = "OpenAI Codex"
criteria = "safe-to-deploy"
delta = "0.13.16 -> 0.14.1"
notes = "Reviewed the complete checksum-matched cached 0.13.16-to-0.14.1 delta and its locally available provenance. The crate moves from AWS-LC-FIPS 3.4.0/API 30 to the FIPS 4.x branch, 4.1.0/API 35, with regenerated bindings and a broad native module update including ML-DSA, ML-KEM, entropy, self-check, and X.509 surfaces. Its build remains a local CMake/compiler/bindgen boundary with no downloader or network client; the added FIPS small-build warning correctly identifies a configuration that can affect compliance. OxiBelt does not select aws-lc-rs/fips, so this update does not alter its selected runtime crypto module."

[[audits.oxibelt.audits.aws-lc-rs]]
who = "OpenAI Codex"
criteria = "safe-to-deploy"
delta = "1.17.3 -> 1.18.0"
notes = "Reviewed the complete checksum-matched cached 1.17.3-to-1.18.0 delta and its locally available provenance. The facade adds checked out-of-place TLS AEAD sealing, fixes key-wrap short-input rejection, zeroizes key-wrap keys, and stabilizes ML-DSA-facing APIs while retaining deprecated compatibility aliases. OxiBelt's first-party mutation-pqc features use the stable signature API and no longer request aws-lc-rs/unstable; the locked quic-parser 0.1.5 dependency still requests that feature independently for its AWS-LC backend. The new AEAD FFI call validates all caller-controlled output lengths before invocation; OxiBelt continues to use only the existing in-place AEAD methods and its ML-DSA-44 signature lengths remain explicitly checked."

[[audits.oxibelt.audits.aws-lc-sys]]
who = "OpenAI Codex"
criteria = "safe-to-deploy"
delta = "0.43.0 -> 0.44.0"
notes = "Reviewed the complete checksum-matched cached 0.43.0-to-0.44.0 delta and its locally available provenance. The embedded AWS-LC revision advances to 991e67ff4cf04df4dd89e407f8b920c6936cb56a; generated bindings preserve examined ABI layouts while advancing AWS-LC 5.2.0 to 5.5.0 and adding EVP_AEAD_CTX_copy. Native changes cover maintained cipher, bignum, CPU-dispatch, entropy, ML-DSA, and ML-KEM sources. Build changes remain local to selected compiler/CMake/bindgen tooling and OUT_DIR, add writable copies for read-only stores and link metadata, and introduce no download or network behavior. OxiBelt's riscv64-musl bindgen feature remains local libclang generation."

[[audits.oxibelt.audits.base64]]
who = "OpenAI Codex"
criteria = "safe-to-deploy"
delta = "0.22.1 -> 0.23.0"
notes = "Reviewed the complete 0.22.1-to-0.23.0 source delta, including custom-padding and decode-error changes plus the new AVX2 and NEON engines; SIMD loads and stores are guarded by slice bounds, instruction dispatch is runtime-checked or requires explicit unsafe construction, and the scalar implementation remains free of unsafe code. OxiBelt's direct declarations disable default features and select std, while the existing clubcard-crlite edge enables simd-unsafe through Cargo feature unification."

[[audits.oxibelt.audits.base64]]
who = "OpenAI Codex"
criteria = "safe-to-deploy"
delta = "0.23.0 -> 0.23.1"
notes = "Reviewed the complete checksum-matched 0.23.0-to-0.23.1 crate delta; production encoding, decoding, SIMD dispatch, and unsafe blocks are unchanged, while tests now compile the generic SIMD wrapper only on supported architectures. OxiBelt's direct declarations continue to disable default features and select std, the existing clubcard-crlite edge continues to enable simd-unsafe through Cargo feature unification, and the crate has no build script or external side effects."

[[audits.oxibelt.audits.cc]]
who = "OpenAI Codex"
criteria = "safe-to-deploy"
version = "1.4.0"
notes = "Reviewed complete 1.4.0 source and the 1.2.67 delta; compiler discovery and invocation remain explicit build-time behavior confined to caller-selected inputs and OUT_DIR, and the functional delta only propagates Cargo trim-path settings into compiler prefix-map flags that OxiBelt does not set."

[[audits.oxibelt.audits.clap]]
