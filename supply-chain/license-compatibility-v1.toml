# SPDX-License-Identifier: Apache-2.0

schema_version = 1

[repository]
metadata_format_version = 1
relationship_types = ["linked", "copied", "separate-executable", "external", "build-only"]
restricted_licenses = [
  "MPL-2.0",
  "MPL-2.0-no-copyleft-exception",
  "LGPL-2.0-only",
  "LGPL-2.0-or-later",
  "LGPL-2.1-only",
  "LGPL-2.1-or-later",
  "LGPL-3.0-only",
  "LGPL-3.0-or-later",
  "GPL-2.0-only",
  "GPL-2.0-or-later",
  "GPL-3.0-only",
  "GPL-3.0-or-later",
  "AGPL-3.0-only",
  "AGPL-3.0-or-later",
]
forbidden_git_implementation_packages = ["git2", "git2-curl", "gix", "libgit2-sys", "gitoxide"]
forbidden_git_implementation_prefixes = ["gix-"]
image_build_preconditions = [
  "source-bundle",
  "dependency-compatibility",
  "component-policy",
  "license-notices",
  "build-inputs",
  "immutable-source",
  "build-context",
]

[[workspaces]]
id = "root"
manifest = "Cargo.toml"
lockfile = "Cargo.lock"
region = "root-apache"
license = "Apache-2.0"
allowed_local_dependencies = []
restricted_license_exceptions = [
  { package = "option-ext", version = "0.2.0", license = "MPL-2.0", relationship = "linked" },
]

[workspaces.package_licenses]
filebelt = "Apache-2.0"
filebelt-api = "Apache-2.0"
filebelt-authz = "Apache-2.0"
filebelt-build-identity = "Apache-2.0"
filebelt-capability-keyset = "Apache-2.0"
filebelt-collaboration = "Apache-2.0"
filebelt-collaboration-protocol = "Apache-2.0"
filebelt-control-protocol = "Apache-2.0"
filebelt-controller = "Apache-2.0"
filebelt-database = "Apache-2.0"
filebelt-deployment-diagnostics = "Apache-2.0"
filebelt-document = "Apache-2.0"
filebelt-document-protocol = "Apache-2.0"
filebelt-domain = "Apache-2.0"
filebelt-events-protocol = "Apache-2.0"
filebelt-fuzz = "Apache-2.0"
filebelt-headscale-sync = "Apache-2.0"
filebelt-mcp-broker = "Apache-2.0"
filebelt-mcp-policy = "Apache-2.0"
filebelt-mcp-protocol = "Apache-2.0"
filebelt-mcp-runner = "Apache-2.0"
filebelt-mcp-vault = "Apache-2.0"
filebelt-media-controller = "Apache-2.0"
filebelt-nfs-relay = "Apache-2.0"
filebelt-repository-tests = "Apache-2.0"
filebelt-revision = "Apache-2.0"
filebelt-revision-protocol = "Apache-2.0"
filebelt-runtime = "Apache-2.0"
filebelt-secret-vault = "Apache-2.0"
filebelt-storage = "Apache-2.0"
filebelt-storage-protocol = "Apache-2.0"
filebelt-unsafe-harness = "Apache-2.0"
filebelt-vfs = "Apache-2.0"
filebelt-vfs-protocol = "Apache-2.0"
filebelt-worker-io = "Apache-2.0"
filebelt-worker-maintenance = "Apache-2.0"
filebeltctl = "Apache-2.0"

[[workspaces]]
id = "smb"
manifest = "adapters/smb/Cargo.toml"
lockfile = "adapters/smb/Cargo.lock"
region = "adapter-gpl3"
license = "GPL-3.0-or-later"
allowed_local_dependencies = [
  { package = "filebelt-vfs-protocol", license = "Apache-2.0", relationship = "linked" },
]
restricted_license_exceptions = []

[workspaces.package_licenses]
filebelt-smb-bridge = "GPL-3.0-or-later"

