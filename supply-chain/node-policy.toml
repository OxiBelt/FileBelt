# SPDX-License-Identifier: Apache-2.0

version = 1
registry = "https://registry.npmjs.org/"
allow_lifecycle_scripts = []
allow_git_dependencies = []
allowed_licenses = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BlueOak-1.0.0",
  "ISC",
  "MIT",
  "(MPL-2.0 OR Apache-2.0)",
  "(MIT OR CC0-1.0)",
  "MIT-0",
  "0BSD",
  "Python-2.0",
  "Unlicense",
  "Unicode-3.0",
  "Zlib",
]

# `khroma` ships an MIT license file but omits the package.json license field.
# Keep the correction exact so an unknown license from any other package fails.
[package_license_overrides]
"khroma@2.1.0" = "MIT"

# Vite 8 uses Lightning CSS only while building and testing the browser bundle.
# Keep MPL-2.0 admission exact: these packages are unmodified, declare no
# install-time lifecycle hooks, and are not copied into the published SPA or
# the OxiBelt runtime image. FileBelt disables dependency script execution.
[package_license_admissions]
"lightningcss@1.33.0" = "MPL-2.0"
"lightningcss-android-arm64@1.33.0" = "MPL-2.0"
"lightningcss-darwin-arm64@1.33.0" = "MPL-2.0"
"lightningcss-darwin-x64@1.33.0" = "MPL-2.0"
"lightningcss-freebsd-x64@1.33.0" = "MPL-2.0"
"lightningcss-linux-arm-gnueabihf@1.33.0" = "MPL-2.0"
"lightningcss-linux-arm64-gnu@1.33.0" = "MPL-2.0"
"lightningcss-linux-arm64-musl@1.33.0" = "MPL-2.0"
"lightningcss-linux-x64-gnu@1.33.0" = "MPL-2.0"
"lightningcss-linux-x64-musl@1.33.0" = "MPL-2.0"
"lightningcss-win32-arm64-msvc@1.33.0" = "MPL-2.0"
"lightningcss-win32-x64-msvc@1.33.0" = "MPL-2.0"
