# SPDX-License-Identifier: Apache-2.0

version = 1

[language]
rust = "1.97.1"
node = "24.19.0"
pnpm = "11.21.0"

# CI installers must update these exact versions and their checksums together.
# Buf becomes a required download when the first .proto file is accepted.
[repository]
python = "3.14.7"
buf = "1.72.0"
reuse = "6.2.0"
cargo_audit = "0.22.2"
cargo_deny = "0.20.2"
cargo_vet = "0.10.2"

[protocol_generation]
prost_plugin = "buf.build/community/neoeinstein-prost:v0.5.0"
prost_plugin_revision = 1
openapi_typescript = "7.13.0"
openapi_fetch = "0.17.0"

[platforms]
native_full = ["linux/amd64", "linux/arm64"]
qemu_smoke = ["linux/riscv64"]

[image_build.native]
builder = "docker.io/library/rust@sha256:b1b3c9c0d921d7fa0a6d1f9ec7e4eab87f8c8ec97644c3d791450f131dec813f"
debian_snapshot = "20260713T000000Z"
binutils = "2.44-3"
gcc = "14.2.0-19"
musl = "1.2.5-3.1~deb13u1"

[image_build.riscv64]
builder = "docker.io/library/rust@sha256:b1b3c9c0d921d7fa0a6d1f9ec7e4eab87f8c8ec97644c3d791450f131dec813f"
cross_toolchain = "ghcr.io/cross-rs/riscv64gc-unknown-linux-musl@sha256:60372bf6ad955bc04ac9b0689476b05955b4e90fc2030d311be687025672cc6d"
cross_toolchain_revision = "55f847251389c5406df85579191c0eac412fab3a"
compiler_sha256 = "3fe20d705129f8ba4ae6be393fd4c484479f688f576af78c0ff2bb10e59d5f86"
debian_snapshot = "20260713T000000Z"
binutils = "2.45"
clang = "1:19.0-63"
cmake = "3.31.6-2"
gcc = "14.3.0"
libclang_dev = "1:19.0-63"
musl = "1.2.5"
ninja_build = "1.12.1-1"
