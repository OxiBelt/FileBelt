# SPDX-License-Identifier: Apache-2.0

[config]
strict_unknown_fields = true
warn_on_deprecated_fields = true
lb_policy_compat_profile = "strict"

[logging]
level = "info"

[runtime]
linux_only = true
read_only_rootfs_compatible = true
memory_only_state = true
unprivileged_mode = true
worker_threads = "auto"

[runtime.accept]
workers = "auto"
reuse_port = true
backlog = 1024
accept_error_backoff_ms = 10

[runtime.drain]
graceful_timeout_ms = 30000
long_connection_close_delay_ms = 60000
shutdown_delay_ms = 0

[listeners]
https_binds = ["0.0.0.0:8443"]
http1 = true
http2 = true
http3 = false

[tls]
cert_chain = "filebelt.crt"
private_key = "filebelt.key"
server_names = ["filebelt.localhost"]
require_sni = false
reject_unknown_sni = false
min_version = "tls1.3"
max_version = "tls1.3"
ssl_early_data = "off"

[tls.ocsp]
mode = "disabled"

[proxy]
trusted_ca_certs = []

[proxy.forwarded_headers]
mode = "overwrite"
client_ip_source = "resolved"

[proxy.real_ip]
enabled = false
trusted_proxies = []
header = "x-forwarded-for"
recursive = true
fail_on_untrusted_forwarded_headers = true

[proxy.auto_upgrade]
enabled = true
max_http_version = "h2"

[proxy.upgrades]
websocket = true
generic_http_upgrade = false
connect_tunneling = false

[proxy.retry]
enabled = false
tries = 1
timeout_ms = 5000
retry_non_idempotent = false

[proxy.buffering]
request = "streaming"
response = "streaming"
max_memory_body_bytes = 1048576
max_temp_file_bytes = 0

[proxy.static_files]
sendfile = "auto"
open_file_cache_max_entries = 256
open_file_cache_ttl_ms = 1000
hot_object_cache_max_bytes = 8388608
hot_object_cache_max_file_bytes = 262144

[cache]
enabled = false

[compression]
enabled = true
gzip = true
deflate = true
zstd = true
br = true
min_size_bytes = 1024

[limits]
max_connections = 4096
max_connections_per_ip = 64
max_requests_per_connection = 1000
client_header_timeout_ms = 10000
client_body_timeout_ms = 30000
client_idle_timeout_ms = 75000
tls_handshake_timeout_ms = 10000
response_send_timeout_ms = 60000
max_headers = 128
max_header_name_bytes = 128
max_header_value_bytes = 8192
max_total_header_bytes = 65536
max_uri_bytes = 8192
max_request_body_bytes = 268435456

[security.headers]
hsts = true
hsts_max_age_seconds = 31536000
hsts_include_subdomains = false
hsts_preload = false
x_content_type_options = "nosniff"
referrer_policy = "no-referrer"
permissions_policy = "camera=(), display-capture=(), geolocation=(), microphone=(), payment=(), usb=()"

[waf]
enabled = false
mode = "enforcing"
fail_policy = "closed"

[[upstreams]]
name = "filebelt-api"
origin = "http://filebelt-api:8080"
max_http_version = "h1"
connect_timeout_ms = 3000
request_timeout_ms = 30000
first_byte_timeout_ms = 30000
read_timeout_ms = 30000
send_timeout_ms = 30000
idle_timeout_ms = 75000
pool_max_idle_per_host = 64
preserve_host = false
websocket = false
webrtc = false
webtransport = false

[upstreams.tls.ech]
mode = "disabled"

[[upstreams]]
name = "filebelt-io"
origin = "http://filebelt-worker-io:8081"
max_http_version = "h1"
connect_timeout_ms = 3000
request_timeout_ms = 30000
first_byte_timeout_ms = 30000
read_timeout_ms = 60000
send_timeout_ms = 60000
idle_timeout_ms = 75000
pool_max_idle_per_host = 64
preserve_host = false
websocket = false
webrtc = false
webtransport = false

[upstreams.tls.ech]
mode = "disabled"

[[upstreams]]
name = "filebelt-collaboration"
origin = "http://filebelt-collaboration:8085"
max_http_version = "h1"
connect_timeout_ms = 3000
request_timeout_ms = 30000
first_byte_timeout_ms = 30000
read_timeout_ms = 75000
send_timeout_ms = 75000
idle_timeout_ms = 75000
pool_max_idle_per_host = 64
preserve_host = false
websocket = true
webrtc = false
webtransport = false

[upstreams.tls.ech]
mode = "disabled"

[[routes]]
name = "filebelt-api-v1"
hosts = ["filebelt.localhost"]
path_prefix = "/api/v1"
upstream = "filebelt-api"
compression = "off"
security_headers = "default"
generic_http_upgrade = false
connect_tunneling = false
grpc_web = false

[routes.retry]
enabled = false

[routes.limits]
max_request_body_bytes = 10485760

[routes.actions.request_headers]
remove = [
  "x-user",
  "x-group",
  "x-groups",
  "x-principal",
  "x-tenant",
  "x-filebelt-principal",
  "x-filebelt-tenant",
  "x-auth-request-user",
  "x-auth-request-groups",
  "x-remote-user",
  "x-remote-groups",
]

[[routes.actions.response_headers.set]]
name = "Cache-Control"
value = "no-store"

[[routes.actions.response_headers.set]]
name = "Pragma"
value = "no-cache"

[[routes]]
name = "filebelt-io-v1"
hosts = ["filebelt.localhost"]
path_prefix = "/io/v1"
upstream = "filebelt-io"
compression = "off"
security_headers = "default"
generic_http_upgrade = false
connect_tunneling = false
grpc_web = false

[routes.retry]
enabled = false

[routes.limits]
max_request_body_bytes = 268435456

[routes.actions.request_headers]
remove = [
  "x-user",
  "x-group",
  "x-groups",
  "x-principal",
  "x-tenant",
  "x-filebelt-principal",
  "x-filebelt-tenant",
  "x-auth-request-user",
  "x-auth-request-groups",
  "x-remote-user",
  "x-remote-groups",
]

[[routes.actions.response_headers.set]]
name = "Cache-Control"
value = "no-store"

[[routes.actions.response_headers.set]]
name = "Pragma"
value = "no-cache"

[[routes]]
name = "filebelt-public-v1"
hosts = ["filebelt.localhost"]
path_prefix = "/public/v1"
upstream = "filebelt-api"
compression = "off"
security_headers = "default"
generic_http_upgrade = false
connect_tunneling = false
grpc_web = false

[routes.retry]
enabled = false

[routes.limits]
max_request_body_bytes = 10485760

[routes.actions.request_headers]
remove = [
  "x-user",
  "x-group",
  "x-groups",
  "x-principal",
  "x-tenant",
  "x-filebelt-principal",
  "x-filebelt-tenant",
  "x-auth-request-user",
  "x-auth-request-groups",
  "x-remote-user",
  "x-remote-groups",
]

[[routes.actions.response_headers.set]]
name = "Cache-Control"
value = "no-store"

[[routes.actions.response_headers.set]]
name = "Pragma"
value = "no-cache"

[[routes]]
name = "filebelt-collaboration-ws-v1"
hosts = ["filebelt.localhost"]
path_prefix = "/collaboration/v1/ws"
upstream = "filebelt-collaboration"
compression = "off"
security_headers = "default"
generic_http_upgrade = false
connect_tunneling = false
grpc_web = false

[routes.match]
methods = ["GET"]
protocols = ["websocket"]

[[routes.match.headers]]
name = "origin"
exact = "https://filebelt.localhost:8443"

[routes.retry]
enabled = false

[routes.limits]
max_request_body_bytes = 4096

[routes.timeouts]
websocket_idle_timeout_ms = 60000

[routes.actions.request_headers]
remove = [
  "authorization",
  "cookie",
  "x-user",
  "x-group",
  "x-groups",
  "x-principal",
  "x-tenant",
  "x-filebelt-principal",
  "x-filebelt-tenant",
  "x-auth-request-user",
  "x-auth-request-groups",
  "x-remote-user",
  "x-remote-groups",
]

[[routes.actions.response_headers.set]]
name = "Cache-Control"
value = "no-store"

[[routes.actions.response_headers.set]]
name = "Pragma"
value = "no-cache"

[[routes]]
name = "filebelt-markdown-preview"
hosts = ["filebelt.localhost"]
path_prefix = "/markdown-preview/"
static_root = "/srv/filebelt/markdown-preview"
compression = "default"
security_headers = "default"
generic_http_upgrade = false
connect_tunneling = false
grpc_web = false

[routes.static_files]
directory_index = ["index.html"]
try_files = ["{path}"]
precompressed = ["br", "zstd", "gzip"]
cache_control = "no-store"

[routes.static_files.cache_control_by_extension]
css = "public, max-age=31536000, immutable"
js = "no-store"
html = "no-store"

[[routes.actions.response_headers.set]]
name = "Content-Security-Policy"
value = "default-src 'none'; base-uri 'none'; connect-src 'none'; font-src 'self'; form-action 'none'; frame-src 'none'; frame-ancestors 'self'; img-src 'self' blob:; media-src 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; require-trusted-types-for 'script'; trusted-types filebelt-markdown-generated"

[[routes.actions.response_headers.set]]
name = "Cross-Origin-Resource-Policy"
value = "cross-origin"

[[routes.actions.response_headers.set]]
name = "Access-Control-Allow-Origin"
value = "*"

[[routes]]
name = "filebelt-spa"
hosts = ["filebelt.localhost"]
path_prefix = "/"
static_root = "/srv/filebelt/web"
compression = "default"
security_headers = "default"
generic_http_upgrade = false
connect_tunneling = false
grpc_web = false

[routes.static_files]
directory_index = ["index.html"]
try_files = ["{path}", "/index.html"]
spa_fallback = "/index.html"
precompressed = ["br", "zstd", "gzip"]
cache_control = "no-store"

[routes.static_files.cache_control_by_extension]
css = "public, max-age=31536000, immutable"
js = "no-store"
png = "public, max-age=31536000, immutable"
svg = "public, max-age=31536000, immutable"
webp = "public, max-age=31536000, immutable"
woff = "public, max-age=31536000, immutable"
woff2 = "public, max-age=31536000, immutable"
html = "no-store"

[[routes.actions.response_headers.set]]
name = "Content-Security-Policy"
value = "default-src 'self'; base-uri 'none'; connect-src 'self'; font-src 'self' data:; form-action 'self'; frame-src 'self'; frame-ancestors 'none'; img-src 'self' data: blob:; media-src 'self' blob:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; require-trusted-types-for 'script'; trusted-types 'none'"

[[routes.actions.response_headers.set]]
name = "Cross-Origin-Opener-Policy"
value = "same-origin"

[[routes.actions.response_headers.set]]
name = "Cross-Origin-Resource-Policy"
value = "same-origin"
